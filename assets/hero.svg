<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">CodeWithDeved: Engineering the intersection of code and cognitive design</title>
  <desc id="d">Dark premium banner with a gold and blue node network framed by code brackets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <radialGradient id="glowB" cx="950" cy="200" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="1180" cy="30" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A45C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A45C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DB3FF"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A45C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98A"/>
      <stop offset="1" stop-color="#C9A45C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .tw { animation: tw 3.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 10; animation: flow 5s linear infinite; }
    @keyframes tw { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -64; } }
    @media (prefers-reduced-motion: reduce) { .tw, .flow { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glowB)"/>
    <rect width="1200" height="400" fill="url(#glowG)"/>

    <!-- left copy -->
    <text x="70" y="96" fill="#C9A45C" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="9">CODEWITHDEVED</text>
    <rect x="70" y="112" width="64" height="3" rx="1.5" fill="#C9A45C"/>
    <text x="70" y="182" fill="#F5F1E8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800">Engineering the</text>
    <text x="70" y="242" fill="#F5F1E8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800">Intersection of Code &amp;</text>
    <text x="70" y="302" fill="url(#blueText)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800">Cognitive Design.</text>
    <text x="70" y="342" fill="#CBD5E1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Software Engineer  •  Founder and CEO at Vibeans Solutions</text>
    <text x="70" y="366" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">AI SaaS Architecture  •  Cognitive UX Design  •  Distributed Cloud Systems</text>

    <!-- right art: code brackets around a node network -->
    <g fill="none" stroke="#C9A45C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <polyline points="778,130 728,200 778,270"/>
      <polyline points="1122,130 1172,200 1122,270"/>
    </g>

    <g stroke="#C9A45C" stroke-opacity="0.55" stroke-width="1.6" fill="none">
      <line x1="810" y1="200" x2="860" y2="130"/>
      <line x1="810" y1="200" x2="868" y2="274"/>
      <line x1="810" y1="200" x2="930" y2="200"/>
      <line x1="860" y1="130" x2="930" y2="200"/>
      <line x1="868" y1="274" x2="930" y2="200"/>
      <line x1="860" y1="130" x2="940" y2="96"/>
      <line x1="868" y1="274" x2="945" y2="312"/>
      <line x1="930" y1="200" x2="995" y2="148"/>
      <line x1="930" y1="200" x2="1000" y2="256"/>
      <line x1="940" y1="96" x2="995" y2="148"/>
      <line x1="945" y1="312" x2="1000" y2="256"/>
      <line x1="995" y1="148" x2="1058" y2="200"/>
      <line x1="1000" y1="256" x2="1058" y2="200"/>
      <line x1="995" y1="148" x2="1048" y2="96"/>
      <line x1="1000" y1="256" x2="1052" y2="306"/>
      <line x1="1048" y1="96" x2="1058" y2="200"/>
      <line x1="1052" y1="306" x2="1058" y2="200"/>
    </g>
    <g stroke="#60A5FA" stroke-width="2" fill="none" class="flow" opacity="0.8">
      <line x1="810" y1="200" x2="930" y2="200"/>
      <line x1="930" y1="200" x2="1058" y2="200" stroke-opacity="0"/>
      <line x1="930" y1="200" x2="995" y2="148"/>
    </g>

    <g fill="#E3C98A">
      <circle cx="810" cy="200" r="7" class="tw"/>
      <circle cx="860" cy="130" r="6" class="tw" style="animation-delay:.6s"/>
      <circle cx="868" cy="274" r="6" class="tw" style="animation-delay:1.2s"/>
      <circle cx="940" cy="96" r="5" class="tw" style="animation-delay:1.8s"/>
      <circle cx="945" cy="312" r="5" class="tw" style="animation-delay:2.4s"/>
      <circle cx="1048" cy="96" r="5" class="tw" style="animation-delay:.9s"/>
      <circle cx="1052" cy="306" r="5" class="tw" style="animation-delay:1.5s"/>
    </g>
    <g fill="#3B82F6">
      <circle cx="930" cy="200" r="13" fill-opacity="0.22"/>
      <circle cx="930" cy="200" r="8" class="tw"/>
      <circle cx="995" cy="148" r="6" class="tw" style="animation-delay:.3s"/>
      <circle cx="1000" cy="256" r="6" class="tw" style="animation-delay:2.1s"/>
      <circle cx="1058" cy="200" r="7" class="tw" style="animation-delay:1s"/>
    </g>

    <text x="1130" y="372" text-anchor="end" fill="#C9A45C" fill-opacity="0.85" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">CEO @ VIBEANS SOLUTIONS</text>
    <rect x="0" y="396" width="1200" height="4" fill="url(#goldLine)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#1B2A47"/>
</svg>
