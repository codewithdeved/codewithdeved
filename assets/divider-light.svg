<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 26" width="1200" height="26" role="img" aria-label="Section divider (Light Mode)">
  <defs>
    <linearGradient id="trackGradLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="photonLeftLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="photonRightLight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0"/>
      <stop offset="70%" stop-color="#B45309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <style>
    .track-light { stroke: url(#trackGradLight); stroke-width: 1.2; }
    .beam-left-light { animation: moveLeft 4s ease-in-out infinite; }
    .beam-right-light { animation: moveRight 4s ease-in-out infinite; }
    .core-pulse-light { animation: pulseCore 2.2s ease-in-out infinite; transform-origin: 600px 13px; }
    .ring-rotate-light { animation: rotateRing 8s linear infinite; transform-origin: 600px 13px; }
    
    @keyframes moveLeft {
      0% { transform: translateX(-420px); opacity: 0; }
      20% { opacity: 1; }
      48% { opacity: 1; }
      52% { transform: translateX(220px); opacity: 0; }
      100% { transform: translateX(220px); opacity: 0; }
    }
    @keyframes moveRight {
      0% { transform: translateX(420px); opacity: 0; }
      20% { opacity: 1; }
      48% { opacity: 1; }
      52% { transform: translateX(-220px); opacity: 0; }
      100% { transform: translateX(-220px); opacity: 0; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .beam-left-light, .beam-right-light, .core-pulse-light, .ring-rotate-light { animation: none; }
    }
  </style>

  <!-- Edge-to-Edge Base Grid Track -->
  <line x1="4" y1="13" x2="1196" y2="13" class="track-light"/>
  <circle cx="4" cy="13" r="2" fill="#2563EB" opacity="0.6"/>
  <circle cx="1196" cy="13" r="2" fill="#2563EB" opacity="0.6"/>
  
  <!-- Optical Precision Ticks -->
  <line x1="150" y1="9" x2="150" y2="17" stroke="#2563EB" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="10" x2="300" y2="16" stroke="#0284C7" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="9" x2="450" y2="17" stroke="#B45309" stroke-width="1" opacity="0.6"/>
  <line x1="750" y1="9" x2="750" y2="17" stroke="#B45309" stroke-width="1" opacity="0.6"/>
  <line x1="900" y1="10" x2="900" y2="16" stroke="#0284C7" stroke-width="1" opacity="0.5"/>
  <line x1="1050" y1="9" x2="1050" y2="17" stroke="#2563EB" stroke-width="1" opacity="0.5"/>

  <!-- Left & Right Traveling Beams -->
  <rect class="beam-left-light" x="360" y="11.5" width="160" height="3" rx="1.5" fill="url(#photonLeftLight)"/>
  <rect class="beam-right-light" x="680" y="11.5" width="160" height="3" rx="1.5" fill="url(#photonRightLight)"/>

  <!-- Center Quantum Node Chassis -->
  <g class="ring-rotate-light">
    <circle cx="600" cy="13" r="10" fill="none" stroke="#2563EB" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.85"/>
  </g>
  <g class="core-pulse-light">
    <polygon points="600,4 609,13 600,22 591,13" fill="#FFFFFF" stroke="#B45309" stroke-width="1.8"/>
    <circle cx="600" cy="13" r="2.5" fill="#0F172A"/>
  </g>
</svg>
