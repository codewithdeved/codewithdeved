<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 44" width="392" height="44" role="img" aria-label="02 : SYSTEM ARCHITECTURE">
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Button Glass Chassis -->
  <rect x="0.75" y="0.75" width="390.5" height="42.5" rx="6" fill="url(#btnBg)" stroke="#1E293B" stroke-width="1.2"/>
  <line x1="20" y1="0.75" x2="372" y2="0.75" stroke="url(#topGlow)" stroke-width="1.4"/>

  <!-- Left Domain Icon -->
  <g transform="translate(6, 0)">
    <circle cx="20" cy="22" r="7" stroke="#38BDF8" stroke-width="1.6" fill="none"/>
        <circle cx="20" cy="22" r="2.5" fill="#C9A45C"/>
        <line x1="20" y1="11" x2="20" y2="14" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="20" y1="30" x2="20" y2="33" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="9" y1="22" x2="12" y2="22" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="28" y1="22" x2="31" y2="22" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Keycap Shortcut Pill (Pure Vector + Monospace Index) -->
  <rect x="44" y="12" width="34" height="20" rx="4" fill="#050914" stroke="#1E293B" stroke-width="1"/>
  <text x="61" y="25.5" text-anchor="middle" fill="#38BDF8" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="700">02</text>

  <!-- Title Text (Guaranteed zero overlap with right pill at x=306) -->
  <text x="88" y="26.5" fill="#F8FAFC" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6px">SYSTEM ARCHITECTURE</text>

  <!-- Right Pill Tag -->
  <rect x="306" y="11" width="74" height="22" rx="4" fill="#050914" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.75"/>
  <text x="343" y="25.5" text-anchor="middle" fill="#38BDF8" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.6px">CORE</text>
</svg>
