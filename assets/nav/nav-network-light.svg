<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 44" width="380" height="44" role="img" aria-label="06 : VENTURES &amp; CONNECT (Light Mode)">
  <defs>
    <linearGradient id="btnBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="topGlowGoldLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Button Porcelain Chassis -->
  <rect x="1" y="1" width="378" height="42" rx="6" fill="url(#btnBgLight)" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="24" y1="1" x2="356" y2="1" stroke="url(#topGlowGoldLight)" stroke-width="1.2"/>

  <!-- Left Icon -->
  <g transform="translate(10, 0)">
    <!-- Studio Globe / Compass Icon -->
    <circle cx="20" cy="22" r="8" stroke="#B45309" stroke-width="1.6" fill="none"/>
    <ellipse cx="20" cy="22" rx="4" ry="8" stroke="#1D4ED8" stroke-width="1.2" fill="none"/>
    <line x1="12" y1="22" x2="28" y2="22" stroke="#B45309" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="1.5" fill="#0F172A"/>
  </g>

  <!-- Title Text -->
  <text x="56" y="27" fill="#0F172A" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1px">06 : VENTURES &amp; CONNECT</text>

  <!-- Right Pill Tag -->
  <rect x="296" y="11" width="70" height="22" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
  <text x="331" y="26" text-anchor="middle" fill="#B45309" font-family="'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="0.8px">VENTURES</text>
</svg>
