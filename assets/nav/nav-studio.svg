  </defs>

  <!-- Button Glass Chassis -->
  <rect x="0.75" y="0.75" width="390.5" height="42.5" rx="6" fill="url(#btnBg)" stroke="#1E293B" stroke-width="1.2"/>
  <line x1="20" y1="0.75" x2="372" y2="0.75" stroke="url(#topGlow)" stroke-width="1.4"/>

  <!-- Left Domain Icon -->
  <g transform="translate(6, 0)">
    <circle cx="20" cy="22" r="8" stroke="#C9A45C" stroke-width="1.6" fill="none"/>
        <ellipse cx="20" cy="22" rx="4" ry="8" stroke="#38BDF8" stroke-width="1.2" fill="none"/>
        <line x1="12" y1="22" x2="28" y2="22" stroke="#C9A45C" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Keycap Shortcut Pill (Pure Vector + Monospace Index) -->
  <rect x="44" y="12" width="34" height="20" rx="4" fill="#050914" stroke="#1E293B" stroke-width="1"/>
  <text x="61" y="25.5" text-anchor="middle" fill="#C9A45C" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="700">06</text>

  <!-- Title Text (Guaranteed zero overlap with right pill at x=306) -->
  <text x="88" y="26.5" fill="#F8FAFC" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6px">VIBEANS STUDIO</text>

  <!-- Right Pill Tag -->
