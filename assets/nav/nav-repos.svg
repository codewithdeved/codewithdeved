      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Button Glass Chassis -->
  <rect x="1" y="1" width="378" height="42" rx="6" fill="url(#btnBg)" stroke="#1E293B" stroke-width="1"/>
  <line x1="24" y1="1" x2="356" y2="1" stroke="url(#topGlow)" stroke-width="1.2"/>

  <!-- Left Icon -->
  <g transform="translate(10, 0)">
    
        <!-- Git Branch / Repo Icon -->
        <circle cx="15" cy="17" r="2.5" fill="#38BDF8"/>
        <circle cx="25" cy="17" r="2.5" fill="#C9A45C"/>
        <circle cx="15" cy="27" r="2.5" fill="#38BDF8"/>
        <line x1="15" y1="19.5" x2="15" y2="24.5" stroke="#38BDF8" stroke-width="1.6"/>
        <path d="M15 27c4 0 10-3 10-7.5" stroke="#38BDF8" stroke-width="1.6" fill="none"/>
        
  </g>

  <!-- Title Text -->
  <text x="56" y="27" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1px">04 : OPEN REPOSITORIES</text>

  <!-- Right Pill Tag -->
  <rect x="296" y="11" width="70" height="22" rx="4" fill="#050914" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.7"/>
  <text x="331" y="26" text-anchor="middle" fill="#38BDF8" font-family="'Consolas', monospace" font-size="9" font-weight="700" letter-spacing="0.8px">CODE</text>
