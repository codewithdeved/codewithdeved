<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="TECHNICAL FOCUS &amp; CAPABILITIES">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="bottomScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Glass Chassis -->
  <rect x="2" y="2" width="1196" height="116" rx="7" fill="url(#bg)" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="160" y1="118" x2="1040" y2="118" stroke="url(#bottomScan)" stroke-width="1.5"/>

  <!-- Left Beacon &amp; Tag -->
  <circle cx="24" cy="22" r="3.5" fill="#10B981"/>
  <text x="34" y="25" fill="#38BDF8" font-family="'Consolas', monospace" font-size="10" font-weight="700">SECTION 03 • CORE DOMAINS &amp; ARCHITECTURE</text>

  <!-- Main Section Title -->
  <text x="24" y="52" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700">TECHNICAL FOCUS &amp; CAPABILITIES</text>

  <!-- Golden Rule under title -->
  <line x1="24" y1="62" x2="420" y2="62" stroke="#C9A45C" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Subtitle -->
  <text x="24" y="85" fill="#94A3B8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5">Specialized engineering across Generative AI, full stack SaaS, cognitive UX, and enterprise FinTech.</text>

  <!-- Center-Right Telemetry Console -->
  <rect x="690" y="26" width="340" height="32" rx="4" fill="#0B1426" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="704" cy="42" r="3" fill="#10B981"/>
  <text x="714" y="46" fill="#10B981" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">CORE CLUSTERS: 4 DOMAINS</text>
  <text x="960" y="46" fill="#C9A45C" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">PRODUCTION GRADE</text>
  <text x="714" y="74" fill="#64748B" font-family="'Consolas', monospace" font-size="8">PRODUCTION RAG • TYPESCRIPT • COGNITIVE UX • FINTECH</text>

  <!-- Right Decorative Icon Symbol -->
  <g transform="translate(1110, 60)" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <polygon points="0,-28 21,0 0,28 -21,0"/>
    <circle cx="0" cy="0" r="2.5" fill="#C9A45C"/>
  </g>
