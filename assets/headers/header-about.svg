<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="ABOUT &amp; ENGINEERING PHILOSOPHY">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="bottomScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Glass Chassis -->
  <rect x="2" y="2" width="1196" height="156" rx="10" fill="url(#bg)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="200" y1="158" x2="1000" y2="158" stroke="url(#bottomScan)" stroke-width="2"/>

  <!-- Left Beacon &amp; Tag -->
  <circle cx="32" cy="28" r="4" fill="#10B981"/>
  <text x="44" y="32" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11" font-weight="700">// 01 ARCHITECTURE &amp; PHILOSOPHY</text>

  <!-- Main Section Title -->
  <text x="32" y="72" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="700">ABOUT &amp; ENGINEERING PHILOSOPHY</text>

  <!-- Golden Rule under title -->
  <line x1="32" y1="84" x2="480" y2="84" stroke="#C9A45C" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Subtitle -->
  <text x="32" y="112" fill="#94A3B8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13">Architecting web systems at the intersection of production code and cognitive human design.</text>

  <!-- Right Status Capsule -->
  <rect x="880" y="24" width="160" height="24" rx="5" fill="#0B1426" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.7"/>
  <text x="960" y="40" text-anchor="middle" fill="#C9A45C" font-family="'Consolas', monospace" font-size="10" font-weight="700">LEADERSHIP &amp; ARCHITECTURE</text>

  <!-- Right Decorative Icon Symbol -->
  <g transform="translate(1085, 80)" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <polygon points="0,-35 26,0 0,35 -26,0"/>
    <circle cx="0" cy="0" r="3" fill="#C9A45C"/>
  </g>
</svg>
