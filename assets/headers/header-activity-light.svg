<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="LANGUAGES &amp; ACTIVITY ON GITHUB (Light Mode)">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="bottomScanLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Porcelain Chassis -->
  <rect x="2" y="2" width="1196" height="116" rx="7" fill="url(#bgLight)" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="160" y1="118" x2="1040" y2="118" stroke="url(#bottomScanLight)" stroke-width="1.5"/>

  <!-- Left Beacon &amp; Tag -->
  <circle cx="24" cy="22" r="3.5" fill="#059669"/>
  <text x="34" y="25" fill="#B45309" font-family="'Consolas', monospace" font-size="10" font-weight="700">SECTION 06 • TELEMETRY &amp; ACTIVITY STREAM</text>

  <!-- Main Section Title -->
  <text x="24" y="52" fill="#0F172A" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700">LANGUAGES &amp; ACTIVITY ON GITHUB</text>

  <!-- Golden Rule under title -->
  <line x1="24" y1="62" x2="420" y2="62" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Subtitle -->
  <text x="24" y="85" fill="#475569" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5">Live repository metrics, multilingual distribution, and automated contribution telemetry.</text>

  <!-- Center-Right Telemetry Console -->
  <rect x="690" y="26" width="340" height="32" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
  <circle cx="704" cy="42" r="3" fill="#059669"/>
  <text x="714" y="46" fill="#059669" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">REAL TIME TELEMETRY</text>
  <text x="960" y="46" fill="#1D4ED8" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">LIVE GITHUB SYNC</text>
  <text x="714" y="74" fill="#64748B" font-family="'Consolas', monospace" font-size="8">STREAKS • MULTILINGUAL CODE DISTRIBUTION • AUTOMATION</text>

  <!-- Right Decorative Icon Symbol -->
  <g transform="translate(1110, 60)" stroke="#B45309" stroke-width="1.2" fill="none">
    <polygon points="0,-28 21,0 0,28 -21,0" fill="#FEF3C7"/>
    <circle cx="0" cy="0" r="2.5" fill="#1D4ED8"/>
  </g>
</svg>
