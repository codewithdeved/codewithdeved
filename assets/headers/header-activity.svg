<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="LANGUAGES &amp; ACTIVITY ON GITHUB">
  <defs>
    <linearGradient id="headerBg_header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="headerLaser_header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A45C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseBeaconDot_header {
      0%, 100% { opacity: 0.55; r: 3.5; }
      50% { opacity: 1; r: 4.8; filter: drop-shadow(0 0 6px #10B981); }
    }
    @keyframes scanLaser_header {
      0% { transform: translateX(-400px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    @keyframes spinGyro_header {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes borderPulse_header {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 0.95; stroke: #C9A45C; }
    }
    .beacon_header { animation: pulseBeaconDot_header 2s ease-in-out infinite; }
    .scan-beam_header { animation: scanLaser_header 5s ease-in-out infinite; }
    .gyro-spin_header { animation: spinGyro_header 14s linear infinite; transform-origin: 1110px 60px; }
    .chassis_header { animation: borderPulse_header 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beacon_header, .scan-beam_header, .gyro-spin_header, .chassis_header { animation: none; }
    }
  </style>

  <!-- Outer Glass Chassis -->
  <rect x="2" y="2" width="1196" height="116" rx="7" fill="url(#headerBg_header)" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.6" class="chassis_header"/>
  
  <!-- Edge-to-Edge Base Glint Line -->
  <line x1="80" y1="118" x2="1120" y2="118" stroke="#1E293B" stroke-width="1"/>

  <!-- Scanning Laser Beam along bottom -->
  <g class="scan-beam_header">
    <line x1="0" y1="118" x2="300" y2="118" stroke="url(#headerLaser_header)" stroke-width="2"/>
  </g>

  <!-- Left Beacon &amp; Tag -->
  <circle cx="24" cy="22" r="3.5" fill="#10B981" class="beacon_header"/>
  <text x="34" y="25" fill="#C9A45C" font-family="'Consolas', monospace" font-size="10" font-weight="700">TELEMETRY STREAM • GITHUB ACTIVITY &amp; METRICS</text>

  <!-- Main Section Title -->
  <text x="24" y="52" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700">LANGUAGES &amp; ACTIVITY ON GITHUB</text>

  <!-- Golden Rule under title -->
  <line x1="24" y1="62" x2="420" y2="62" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Subtitle -->
  <text x="24" y="85" fill="#94A3B8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5">Live repository metrics, multilingual distribution, and automated contribution telemetry.</text>

  <!-- Center-Right Telemetry Console -->
  <rect x="690" y="26" width="340" height="32" rx="4" fill="#0B1426" stroke="#C9A45C" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="704" cy="42" r="3" fill="#10B981" class="beacon_header"/>
  <text x="714" y="46" fill="#10B981" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">REAL TIME TELEMETRY</text>
  <text x="960" y="46" fill="#38BDF8" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">LIVE GITHUB SYNC</text>
  <text x="714" y="74" fill="#64748B" font-family="'Consolas', monospace" font-size="8">STREAKS • MULTILINGUAL CODE DISTRIBUTION • AUTOMATION</text>

  <!-- Right Decorative Gyroscope Symbol -->
  <g class="gyro-spin_header" stroke="#C9A45C" stroke-width="1.2" fill="none">
    <polygon points="1110,32 1131,60 1110,88 1089,60"/>
    <circle cx="1110" cy="60" r="2.5" fill="#38BDF8"/>
  </g>
</svg>
