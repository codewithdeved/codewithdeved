<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#C9A45C" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="photonLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="photonRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0"/>
      <stop offset="70%" stop-color="#C9A45C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .track { stroke: url(#trackGrad); stroke-width: 1.2; }
    .beam-left { animation: moveLeft 4s ease-in-out infinite; }
    .beam-right { animation: moveRight 4s ease-in-out infinite; }
    .core-pulse { animation: pulseCore 2s ease-in-out infinite; transform-origin: 600px 16px; }
    .ring-rotate { animation: rotateRing 8s linear infinite; transform-origin: 600px 16px; }
    
    @keyframes moveLeft {
      0% { transform: translateX(-350px); opacity: 0; }
      20% { opacity: 1; }
      48% { opacity: 1; }
      52% { transform: translateX(250px); opacity: 0; }
      100% { transform: translateX(250px); opacity: 0; }
    }
    @keyframes moveRight {
      0% { transform: translateX(350px); opacity: 0; }
      20% { opacity: 1; }
      48% { opacity: 1; }
      52% { transform: translateX(-250px); opacity: 0; }
      100% { transform: translateX(-250px); opacity: 0; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.95); opacity: 0.85; filter: drop-shadow(0 0 2px #C9A45C); }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #C9A45C); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .beam-left, .beam-right, .core-pulse, .ring-rotate { animation: none; }
    }
  </style>

  <!-- Base Grid Track -->
  <line x1="80" y1="16" x2="1120" y2="16" class="track"/>
  
  <!-- Optical Precision Ticks -->
  <line x1="180" y1="12" x2="180" y2="20" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="13" x2="320" y2="19" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
  <line x1="460" y1="12" x2="460" y2="20" stroke="#C9A45C" stroke-width="1" opacity="0.6"/>
  <line x1="740" y1="12" x2="740" y2="20" stroke="#C9A45C" stroke-width="1" opacity="0.6"/>
  <line x1="880" y1="13" x2="880" y2="19" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
  <line x1="1020" y1="12" x2="1020" y2="20" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>

  <!-- Left Traveling Beam -->
  <rect class="beam-left" x="350" y="14.5" width="160" height="3" rx="1.5" fill="url(#photonLeft)"/>
  
  <!-- Right Traveling Beam -->
  <rect class="beam-right" x="690" y="14.5" width="160" height="3" rx="1.5" fill="url(#photonRight)"/>

  <!-- Center Quantum Node Chassis -->
  <g class="ring-rotate">
    <circle cx="600" cy="16" r="11" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.8"/>
  </g>
  <g class="core-pulse">
    <rect x="593" y="9" width="14" height="14" transform="rotate(45 600 16)" fill="#0B1426" stroke="#C9A45C" stroke-width="1.8"/>
    <circle cx="600" cy="16" r="2.5" fill="#F8FAFC" filter="url(#coreGlow)"/>
  </g>
</svg>
