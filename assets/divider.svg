<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A45C" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#C9A45C"/>
      <stop offset="0.65" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .glint { animation: sweep 5s ease-in-out infinite; }
    .gem { animation: pulse 2.5s ease-in-out infinite; transform-origin: 600px 14px; }
    @keyframes sweep { 0% { transform: translateX(-220px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(1240px); opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .glint { animation: none; opacity: 0; } .gem { animation: none; } }
  </style>
  <rect x="40" y="13" width="1120" height="2" rx="1" fill="url(#l)" opacity="0.8"/>
  <rect class="glint" x="0" y="12" width="180" height="4" rx="2" fill="url(#glint)"/>
  <rect class="gem" x="592" y="8" width="16" height="16" transform="rotate(45 600 14)" fill="#0B1426" stroke="#C9A45C" stroke-width="2"/>
</svg>
