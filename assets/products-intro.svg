<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Selected Products &amp; Platforms - 03 Projects">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="prodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E1E"/>
      <stop offset="50%" stop-color="#0B152B"/>
      <stop offset="100%" stop-color="#081022"/>
    </linearGradient>

    <!-- Border Glow Gradient (Cyan to Amber) -->
    <linearGradient id="prodBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Top Laser Sheen Gradient -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Left Main Icon Aura -->
    <radialGradient id="iconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtitle Icon Aura -->
    <radialGradient id="subAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Traveling Border Trace Gradient -->
    <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Moving Top Laser Glint -->
    <linearGradient id="laserGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Pill Glass Shimmer -->
    <linearGradient id="pillSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A7F3D0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clipProdChassis">
      <rect x="1" y="1" width="1198" height="158" rx="16"/>
    </clipPath>
    <clipPath id="clipProdPill">
      <rect x="0" y="0" width="128" height="34" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 450; }
    .font-badge { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; }
    @keyframes pulseSheen {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes borderTrace {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes topSweep {
      0% { transform: translateX(-280px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1240px); opacity: 0; }
    }
    @keyframes auraBreathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.95; }
    }
    @keyframes cubeLaunch {
      0%, 100% { opacity: 0.7; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-1.5px); }
    }
    @keyframes compassSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes compassOsc {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes pillWave {
      0%, 25% { transform: translateX(-140px); opacity: 0; }
      35% { opacity: 1; }
      55% { transform: translateX(160px); opacity: 0; }
      100% { transform: translateX(160px); opacity: 0; }
    }
    .pulse-sheen { animation: pulseSheen 3s ease-in-out infinite; }
    .border-trace-halo { stroke-dasharray: 140 360; stroke-linecap: round; animation: borderTrace 7.5s linear infinite; }
    .border-trace-mid  { stroke-dasharray: 85 415;  stroke-linecap: round; animation: borderTrace 7.5s linear infinite; }
    .border-trace-core { stroke-dasharray: 38 462;  stroke-linecap: round; animation: borderTrace 7.5s linear infinite; }
    .top-glint { animation: topSweep 4.8s ease-in-out infinite; }
    .aura-breathe { animation: auraBreathe 3.6s ease-in-out infinite; }
    .cube-beam { animation: cubeLaunch 2.6s ease-in-out infinite; }
    .compass-ring { animation: compassSpin 18s linear infinite; transform-origin: 16px 16px; }
    .compass-needle { animation: compassOsc 4.2s ease-in-out infinite; transform-origin: 16px 16px; }
    .pill-shimmer { animation: pillWave 5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-sheen, .border-trace-halo, .border-trace-mid, .border-trace-core, .top-glint,
      .aura-breathe, .cube-beam, .compass-ring, .compass-needle, .pill-shimmer { animation: none; }
    }
  </style>

  <!-- Card Chassis -->
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="url(#prodBg)" stroke="url(#prodBorder)" stroke-width="1.5"/>

  <!-- Feathered Volumetric Perimeter Border Glow -->
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="none" stroke="url(#traceGrad)" stroke-width="4.5" stroke-opacity="0.16" pathLength="1000" class="border-trace-halo"/>
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="none" stroke="url(#traceGrad)" stroke-width="2.4" stroke-opacity="0.42" pathLength="1000" class="border-trace-mid"/>
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="none" stroke="url(#traceGrad)" stroke-width="1.5" stroke-opacity="0.92" pathLength="1000" class="border-trace-core"/>

  <!-- Top Specular Laser Line & Sweep -->
  <rect x="220" y="1" width="760" height="2" fill="url(#topSheen)" class="pulse-sheen"/>
  <g clip-path="url(#clipProdChassis)">
    <rect x="0" y="0.5" width="240" height="2.5" fill="url(#laserGlint)" class="top-glint"/>
  </g>

  <!-- ================= ROW 1 ================= -->
  <!-- Main Heading Icon: 44x44 at x=52, y=26 -->
  <circle cx="74" cy="48" r="28" fill="url(#iconAura)" class="aura-breathe"/>
  <rect x="52" y="26" width="44" height="44" rx="10" fill="#0F1D38" stroke="#38BDF8" stroke-width="1.3"/>
  <g transform="translate(58, 32)">
    <polygon points="16,3 27,9 16,15 5,9" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="5,9 16,15 16,28 5,22" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="16,15 27,9 27,22 16,28" fill="#132347" stroke="#38BDF8" stroke-width="1.2"/>
    <g class="cube-beam">
      <polygon points="16,6 20,9 16,12 12,9" fill="#F59E0B"/>
      <line x1="16" y1="6" x2="16" y2="1" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main Section Title: Aligned at x=114, baseline at y=57 (center y=48) -->
  <text x="114" y="57" fill="#F8FAFC" class="font-title" font-size="29" letter-spacing="-0.4">Selected Products &amp; Platforms</text>

  <!-- Right Side Badge: "03 Projects" (centered vertically at y=48) -->
  <g transform="translate(1020, 31)">
    <rect x="0" y="0" width="128" height="34" rx="8" fill="#0A162B" stroke="#10B981" stroke-width="1.2"/>
    <rect x="2" y="2" width="124" height="14" rx="6" fill="#10B981" fill-opacity="0.08"/>
    <g clip-path="url(#clipProdPill)">
      <rect x="0" y="0" width="70" height="34" fill="url(#pillSheen)" class="pill-shimmer"/>
    </g>
    <g transform="translate(13, 9)">
      <path d="M1 11 L8 14.5 L15 11" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M1 7.5 L8 11 L15 7.5" stroke="#34D399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polygon points="8,1 15,4.5 8,8 1,4.5" fill="#064E3B" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/>
      <circle cx="8" cy="4.5" r="1.3" fill="#A7F3D0"/>
    </g>
    <text x="37" y="22" fill="#34D399" class="font-badge" font-size="13" letter-spacing="0.5">03 Projects</text>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- Subheading Icon: 44x44 at x=52, y=90 (EXACTLY ALIGNED WITH MAIN ICON!) -->
  <circle cx="74" cy="112" r="28" fill="url(#subAura)" class="aura-breathe"/>
  <rect x="52" y="90" width="44" height="44" rx="10" fill="#0F1D38" stroke="#38BDF8" stroke-width="1.3"/>
  <g transform="translate(58, 96)">
    <!-- Outer isometric / circular discovery ring -->
    <ellipse cx="16" cy="16" rx="13" ry="13" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 2" class="compass-ring"/>
    <circle cx="16" cy="16" r="11" fill="#0B132B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <!-- 4-Point Explorer Compass Diamond Needle -->
    <g class="compass-needle">
      <path d="M16 4 L19 13 L28 16 L19 19 L16 28 L13 19 L4 16 L13 13 Z" fill="#132347" stroke="#38BDF8" stroke-width="1.2"/>
      <!-- Cardinal Primary Needle in Amber/Cyan -->
      <polygon points="16,5 18.5,14 16,16 13.5,14" fill="#F59E0B"/>
      <polygon points="16,27 18.5,18 16,16 13.5,18" fill="#38BDF8"/>
    </g>
    <!-- Central Core Energy Eye -->
    <circle cx="16" cy="16" r="2.2" fill="#F59E0B"/>
    <circle cx="16" cy="16" r="1" fill="#FEF3C7"/>
  </g>

  <!-- Subheading Text: Aligned at x=114 (EXACTLY ALIGNED WITH MAIN HEADING!), baseline at y=118.5 -->
  <text x="114" y="118.5" fill="#94A3B8" class="font-sub" font-size="16.6" letter-spacing="0">Explore three of our featured platforms, actively developed and deployed across AI, sales intelligence, and digital learning.</text>
</svg>
