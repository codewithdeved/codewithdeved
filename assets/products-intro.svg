<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Featured Products - Production Deployments">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="prodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="50%" stop-color="#0C162D"/>
      <stop offset="100%" stop-color="#091224"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="prodBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Top Laser Sheen Gradient -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Icon Radial Aura -->
    <radialGradient id="iconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Status Beacon Glow -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 450; }
    @keyframes pulseLive {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .pulse-dot { animation: pulseLive 2.5s ease-in-out infinite; transform-origin: 1115px 45px; }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot { animation: none; }
    }
  </style>

  <!-- Card Chassis -->
  <rect x="1" y="1" width="1198" height="148" rx="16" fill="url(#prodBg)" stroke="url(#prodBorder)" stroke-width="1.5"/>
  
  <!-- Top Specular Laser Line -->
  <rect x="250" y="1" width="700" height="2" fill="url(#topSheen)"/>

  <!-- Left Icon & Main Heading Group -->
  <!-- 44x44 Icon Container (Center cx=78, cy=63) -->
  <circle cx="78" cy="63" r="28" fill="url(#iconAura)"/>
  <rect x="56" y="41" width="44" height="44" rx="10" fill="#0F1D38" stroke="#38BDF8" stroke-width="1.2"/>
  
  <!-- 3D Enterprise Production Platform Icon -->
  <g transform="translate(62, 47)">
    <!-- Isometric Top Face -->
    <polygon points="16,3 27,9 16,15 5,9" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Isometric Left Face -->
    <polygon points="5,9 16,15 16,28 5,22" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Isometric Right Face -->
    <polygon points="16,15 27,9 27,22 16,28" fill="#132347" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Center Core Energy Diamond -->
    <polygon points="16,6 20,9 16,12 12,9" fill="#F59E0B"/>
    <!-- Ascending Projection Ray -->
    <line x1="16" y1="6" x2="16" y2="1" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Section Title: Strictly aligned at x=116 -->
  <text x="116" y="72" fill="#F8FAFC" class="font-title" font-size="31" letter-spacing="-0.5">Featured Products</text>

  <!-- Right Side Telemetry Badge -->
  <g transform="translate(1004, 45)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#0E1A33" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="15" r="4" fill="#10B981" filter="url(#beaconGlow)" class="pulse-dot"/>
    <text x="27" y="19" fill="#34D399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1">3 LIVE SYSTEMS</text>
  </g>

  <!-- One-Line Subtitle Statement: Strictly aligned at x=116 -->
  <text x="116" y="112" fill="#94A3B8" class="font-sub" font-size="14.6" letter-spacing="0">Explore my top three featured platforms currently active in production across artificial intelligence, outbound sales intelligence, and computing education.</text>
</svg>
