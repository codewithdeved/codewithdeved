<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="CodeWithDeved signature footer. Engineering the intersection of code and cognitive design.">
  <defs>
    <linearGradient id="horizonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#C9A45C" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brandGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C"/>
      <stop offset="50%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#C9A45C"/>
    </linearGradient>
    <linearGradient id="glintAnim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes glintSweep {
      0% { transform: translateX(-300px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    @keyframes breatheEmblem {
      0%, 100% { transform: scale(1) rotate(45deg); opacity: 0.8; }
      50% { transform: scale(1.15) rotate(45deg); opacity: 1; }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .glint-beam { animation: glintSweep 7s ease-in-out infinite; }
    .emblem-gem { animation: breatheEmblem 3.5s ease-in-out infinite; transform-origin: 600px 22px; }
    .pulse-dot { animation: pulseLive 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .glint-beam, .emblem-gem, .pulse-dot { animation: none; }
    }
  </style>

  <!-- Ambient Horizon Line (no enclosing box) -->
  <line x1="80" y1="22" x2="1120" y2="22" stroke="url(#horizonLine)" stroke-width="1.5"/>
  <rect class="glint-beam" x="0" y="21" width="220" height="2" fill="url(#glintAnim)"/>

  <!-- Centered Diamond Emblem -->
  <g class="emblem-gem">
    <rect x="593" y="15" width="14" height="14" rx="2" fill="#0B1426" stroke="#C9A45C" stroke-width="1.6"/>
    <circle cx="600" cy="22" r="2.5" fill="#C9A45C"/>
  </g>

  <!-- Brand Typography -->
  <text x="600" y="60" text-anchor="middle" fill="url(#brandGold)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="8">CODEWITHDEVED</text>

  <!-- Tagline -->
  <text x="600" y="86" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2.5">ENGINEERING THE INTERSECTION OF CODE <tspan fill="#3B82F6">×</tspan> COGNITIVE DESIGN</text>

  <!-- Bio & Location Metadata -->
  <text x="600" y="110" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1">Tayyab Ali • Founder, Vibeans Solutions • Karachi, Pakistan (UTC+5)</text>

  <!-- Terminal Style Verification Line -->
  <g transform="translate(600, 128)">
    <circle class="pulse-dot" cx="-140" cy="-3.5" r="3" fill="#10B981"/>
    <text x="-130" y="0" fill="#10B981" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="600">PRODUCTION DEPLOYMENT VERIFIED</text>
    <text x="50" y="0" fill="#475569" font-family="'Consolas', 'Courier New', monospace" font-size="10">| git commit: stable</text>
  </g>
</svg>
