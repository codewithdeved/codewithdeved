<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Technical Focus Areas - Generative AI, Full Stack SaaS, Cognitive UX, and FinTech">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C98A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#997028" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="cardPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    @keyframes glowPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
    @keyframes orbitNode { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes beamFlow { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
    .glow-1 { animation: glowPulse 3s ease-in-out infinite; }
    .glow-2 { animation: glowPulse 3.5s ease-in-out infinite 0.5s; }
    .glow-3 { animation: glowPulse 4s ease-in-out infinite 1s; }
    .glow-4 { animation: glowPulse 3.2s ease-in-out infinite 1.5s; }
    .beam { stroke-dasharray: 6 8; animation: beamFlow 2.5s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .glow-1, .glow-2, .glow-3, .glow-4, .beam { animation: none; }
    }
  </style>

  <!-- CARD 1: Generative AI & Systems (x=0, y=0, w=585, h=165) -->
  <g class="glow-1">
    <rect x="0.5" y="0.5" width="584" height="164" rx="14" fill="url(#cardGrad)" stroke="url(#blueEdge)" stroke-width="1.2"/>
    <rect x="1" y="1" width="583" height="163" rx="13" fill="url(#cardPattern)"/>
    <circle cx="48" cy="48" r="22" fill="#1E3A8A" fill-opacity="0.4"/>
    <circle cx="48" cy="48" r="28" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" class="beam"/>
    <text x="48" y="55" text-anchor="middle" font-size="20">🧠</text>
    
    <text x="86" y="42" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Generative AI &amp; Intelligent Systems</text>
    <rect x="86" y="52" width="130" height="18" rx="4" fill="#1E3A8A" fill-opacity="0.4"/>
    <text x="94" y="65" fill="#93C5FD" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">PRODUCTION LLMs • RAG</text>
    
    <text x="30" y="104" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">Engineering production grade AI systems with Retrieval Augmented Generation,</text>
    <text x="30" y="124" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">multi modal model synthesis, and deterministic prompt engineering architectures.</text>
    <text x="30" y="148" fill="#3B82F6" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Core: LangChain • Vectors • Function Calling • Multi Modal Models</text>
  </g>

  <!-- CARD 2: Full Stack & Scalable Web SaaS (x=615, y=0, w=585, h=165) -->
  <g class="glow-2">
    <rect x="615.5" y="0.5" width="584" height="164" rx="14" fill="url(#cardGrad)" stroke="url(#goldEdge)" stroke-width="1.2"/>
    <rect x="616" y="1" width="583" height="163" rx="13" fill="url(#cardPattern)"/>
    <circle cx="663" cy="48" r="22" fill="#78350F" fill-opacity="0.35"/>
    <circle cx="663" cy="48" r="28" fill="none" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.3" class="beam"/>
    <text x="663" y="55" text-anchor="middle" font-size="20">🌐</text>
    
    <text x="701" y="42" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Full Stack &amp; Scalable Web SaaS</text>
    <rect x="701" y="52" width="140" height="18" rx="4" fill="#78350F" fill-opacity="0.35"/>
    <text x="709" y="65" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">NEXT.JS • REACT • TYPESCRIPT</text>
    
    <text x="645" y="104" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">Architecting resilient, high performance web applications from initial system</text>
    <text x="645" y="124" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">design through high scale production cloud deployment and edge optimization.</text>
    <text x="645" y="148" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Core: Next.js • TypeScript • Node.js • Edge Middleware • Cloudflare</text>
  </g>

  <!-- CARD 3: Cognitive Design & Decision UX (x=0, y=190, w=585, h=165) -->
  <g class="glow-3">
    <rect x="0.5" y="190.5" width="584" height="164" rx="14" fill="url(#cardGrad)" stroke="url(#goldEdge)" stroke-width="1.2"/>
    <rect x="1" y="191" width="583" height="163" rx="13" fill="url(#cardPattern)"/>
    <circle cx="48" cy="238" r="22" fill="#78350F" fill-opacity="0.35"/>
    <circle cx="48" cy="238" r="28" fill="none" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.3" class="beam"/>
    <text x="48" y="245" text-anchor="middle" font-size="20">🎨</text>
    
    <text x="86" y="232" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">Cognitive Design &amp; User Experience (UX)</text>
    <rect x="86" y="242" width="138" height="18" rx="4" fill="#78350F" fill-opacity="0.35"/>
    <text x="94" y="255" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">HUMAN DECISION DESIGN</text>
    
    <text x="30" y="294" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">Bridging human psychology and technical software design to eliminate cognitive</text>
    <text x="30" y="314" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">load, establish organic user trust, and optimize complex software workflows.</text>
    <text x="30" y="338" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Core: Cognitive Psychology • Micro Interactions • Design Systems • Figma</text>
  </g>

  <!-- CARD 4: FinTech & Healthcare Technology (x=615, y=190, w=585, h=165) -->
  <g class="glow-4">
    <rect x="615.5" y="190.5" width="584" height="164" rx="14" fill="url(#cardGrad)" stroke="url(#blueEdge)" stroke-width="1.2"/>
    <rect x="616" y="191" width="583" height="163" rx="13" fill="url(#cardPattern)"/>
    <circle cx="663" cy="238" r="22" fill="#1E3A8A" fill-opacity="0.4"/>
    <circle cx="663" cy="238" r="28" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" class="beam"/>
    <text x="663" y="245" text-anchor="middle" font-size="20">💳</text>
    
    <text x="701" y="232" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="700">FinTech &amp; Healthcare Technology</text>
    <rect x="701" y="242" width="154" height="18" rx="4" fill="#1E3A8A" fill-opacity="0.4"/>
    <text x="709" y="255" fill="#93C5FD" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">HIGH DATA INTEGRITY &amp; TRUST</text>
    
    <text x="645" y="294" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">Engineering secure, highly reliable software for financial workflows, transaction</text>
    <text x="645" y="314" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">clarity, enterprise real estate portals, and mission critical health data systems.</text>
    <text x="645" y="338" fill="#3B82F6" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Core: Data Privacy • Audit Trails • Resilient Workflows • Enterprise Security</text>
  </g>
</svg>
