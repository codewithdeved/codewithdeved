<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 38" width="1200" height="38" role="img" aria-label="Live Telemetry: AI Powered SaaS, Cognitive UX, and Modern Web Architecture">
  <defs>
    <linearGradient id="tickerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="25%" stop-color="#081022"/>
      <stop offset="50%" stop-color="#0B1426"/>
      <stop offset="75%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="topGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .beacon { animation: pulseGreen 1.8s ease-in-out infinite; }
    .stream { font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; opacity: 0; animation: rotateCycle 12s ease-in-out infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 4s; }
    .s3 { animation-delay: 8s; }
    .glint-beam { animation: scanTrack 6s ease-in-out infinite; }
    
    @keyframes pulseGreen {
      0%, 100% { opacity: 0.65; r: 3.5; }
      50% { opacity: 1; r: 4.5; filter: drop-shadow(0 0 4px #10B981); }
    }
    @keyframes rotateCycle {
      0% { opacity: 0; transform: translateY(5px); }
      5% { opacity: 1; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(0); }
      35% { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes scanTrack {
      0% { transform: translateX(-200px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1240px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stream { animation: none; opacity: 0; }
      .s1 { opacity: 1; }
      .glint-beam { animation: none; opacity: 0; }
      .beacon { animation: none; }
    }
  </style>

  <!-- Slim Glass Chassis -->
  <rect x="0.5" y="0.5" width="1199" height="37" rx="6" fill="url(#tickerBg)" stroke="#1E293B" stroke-width="1"/>
  <line x1="60" y1="0.5" x2="1140" y2="0.5" stroke="url(#topGlint)" stroke-width="1.2"/>
  <rect class="glint-beam" x="0" y="0.5" width="140" height="1.5" rx="0.75" fill="url(#beam)"/>

  <!-- Left Zone (0..255): Live Production Status -->
  <circle class="beacon" cx="22" cy="19" r="3.8" fill="#10B981"/>
  <text x="34" y="23" fill="#10B981" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.5px">STATUS: PRODUCTION ACTIVE</text>
  <line x1="255" y1="8" x2="255" y2="30" stroke="#1E293B" stroke-width="1"/>

  <!-- Center Zone (255..945): Animated Capabilities Stream -->
  <g text-anchor="middle">
    <text class="stream s1" x="600" y="23.5" fill="#F8FAFC">
      AI POWERED SAAS <tspan fill="#C9A45C">•</tspan> COGNITIVE UX <tspan fill="#C9A45C">•</tspan> MODERN WEB ARCHITECTURE
    </text>
    <text class="stream s2" x="600" y="23.5" fill="#F8FAFC">
      NEXT.JS APP ROUTER <tspan fill="#38BDF8">•</tspan> EDGE COMPUTE <tspan fill="#38BDF8">•</tspan> CLIENT SIDE WASM
    </text>
    <text class="stream s3" x="600" y="23.5" fill="#F8FAFC">
      AUTONOMOUS AI AGENTS <tspan fill="#C9A45C">•</tspan> VECTOR PIPELINES <tspan fill="#C9A45C">•</tspan> DISTRIBUTED SYSTEMS
    </text>
  </g>

  <!-- Right Zone (945..1200): Edge Latency Metric -->
  <line x1="945" y1="8" x2="945" y2="30" stroke="#1E293B" stroke-width="1"/>
  <circle cx="968" cy="19" r="3" fill="#C9A45C"/>
  <text x="1180" y="23" text-anchor="end" fill="#C9A45C" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.5px">GLOBAL EDGE : 12ms LATENCY</text>
</svg>
