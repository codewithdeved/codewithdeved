<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 38" width="1200" height="38" role="img" aria-label="Live Telemetry: AI Powered SaaS, Cognitive UX, and Modern Web Architecture">
  <defs>
    <linearGradient id="tickerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="25%" stop-color="#081022"/>
      <stop offset="50%" stop-color="#0B1426"/>
      <stop offset="75%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="topGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .beacon { animation: pulseGreen 1.8s ease-in-out infinite; }
    .stream { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; opacity: 0; animation: rotateCycle 12s ease-in-out infinite; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 4s; }
    .s3 { animation-delay: 8s; }
    .glint-beam { animation: scanTrack 6s ease-in-out infinite; }
    
    @keyframes pulseGreen {
      0%, 100% { opacity: 0.6; r: 3.5; }
      50% { opacity: 1; r: 4.5; filter: drop-shadow(0 0 4px #10B981); }
    }
    @keyframes rotateCycle {
      0% { opacity: 0; transform: translateY(6px); }
      5% { opacity: 1; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(0); }
      35% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes scanTrack {
      0% { transform: translateX(-240px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1280px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stream { animation: none; opacity: 0; }
      .s1 { opacity: 1; }
      .glint-beam { animation: none; opacity: 0; }
      .beacon { animation: none; }
    }
  </style>

  <!-- Slim Glass Chassis -->
  <rect x="1" y="1" width="1198" height="36" rx="6" fill="url(#tickerBg)" stroke="#1E293B" stroke-width="0.8"/>
  <line x1="80" y1="1" x2="1120" y2="1" stroke="url(#topGlint)" stroke-width="1.2"/>
  <rect class="glint-beam" x="0" y="0.5" width="140" height="1.5" rx="0.75" fill="url(#beam)"/>

  <!-- Left: Live Production Status -->
  <circle class="beacon" cx="24" cy="19" r="4" fill="#10B981"/>
  <text x="36" y="23" fill="#10B981" font-family="'Consolas', monospace" font-size="10" font-weight="700">STATUS: PRODUCTION ACTIVE</text>

  <!-- Center: Animated Capabilities Stream -->
  <g text-anchor="middle">
    <text class="stream s1" x="600" y="24" fill="#F8FAFC">
      AI POWERED SAAS <tspan fill="#C9A45C">•</tspan> COGNITIVE UX <tspan fill="#C9A45C">•</tspan> MODERN WEB ARCHITECTURE
    </text>
    <text class="stream s2" x="600" y="24" fill="#F8FAFC">
      NEXT.JS 14 APP ROUTER <tspan fill="#38BDF8">•</tspan> EDGE COMPUTE <tspan fill="#38BDF8">•</tspan> CLIENT SIDE WASM
    </text>
    <text class="stream s3" x="600" y="24" fill="#F8FAFC">
      AUTONOMOUS AI AGENTS <tspan fill="#C9A45C">•</tspan> VECTOR PIPELINES <tspan fill="#C9A45C">•</tspan> DISTRIBUTED SYSTEMS
    </text>
  </g>

  <!-- Right: Edge Latency Metric -->
  <text x="1176" y="23" text-anchor="end" fill="#C9A45C" font-family="'Consolas', monospace" font-size="10" font-weight="700">GLOBAL EDGE : 12ms LATENCY</text>
</svg>
