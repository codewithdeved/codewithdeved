<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="AI Powered SaaS. Cognitive UX. Modern Web Architecture.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="0.5" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A45C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98A"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p { opacity: 0; animation: cycle 9s ease-in-out infinite; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 3px; }
    .p2 { animation-delay: 3s; }
    .p3 { animation-delay: 6s; }
    .dot { animation: blink 1.4s ease-in-out infinite; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      5% { opacity: 1; transform: translateY(0); }
      28% { opacity: 1; transform: translateY(0); }
      33% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .p { animation: none; opacity: 0; }
      .p1 { opacity: 1; }
      .dot { animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="71" rx="14" fill="url(#bg)" stroke="#1B2A47"/>
  <rect x="120" y="70" width="960" height="2" fill="url(#edge)"/>
  <circle class="dot" cx="340" cy="36" r="6" fill="#3B82F6"/>
  <text class="p p1" x="600" y="47" text-anchor="middle" fill="#F5F1E8">AI POWERED <tspan fill="#C9A45C">SAAS</tspan></text>
  <text class="p p2" x="600" y="47" text-anchor="middle" fill="#F5F1E8">COGNITIVE <tspan fill="#C9A45C">UX</tspan></text>
  <text class="p p3" x="600" y="47" text-anchor="middle" fill="#F5F1E8">MODERN <tspan fill="#C9A45C">WEB ARCHITECTURE</tspan></text>
</svg>
