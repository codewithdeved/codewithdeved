<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Bugatti repository - CSS3 3D Transforms on React.js (Light Mode)">
  <defs>
    <linearGradient id="repoBgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="repoStrokeBlueLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLiveLight { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes borderPulseLight { 0%, 100% { stroke-opacity: 0.9; } 50% { stroke-opacity: 0.4; } }
    .pulse-dot-light { animation: pulseLiveLight 2s ease-in-out infinite; }
    .card-border-light { animation: borderPulseLight 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-dot-light, .card-border-light { animation: none; } }
  </style>

  <!-- Container -->
  <rect class="card-border-light" x="0.5" y="0.5" width="579" height="199" rx="12" fill="url(#repoBgLight)" stroke="url(#repoStrokeBlueLight)" stroke-width="1.2"/>

  <!-- Top Bar: Octicon + Title + Public Badge -->
  <path d="M 28 26 c -1.1 0 -2 0.9 -2 2 v 16 c 0 0.6 0.4 1 1 1 h 12 c 0.6 0 1 -0.4 1 -1 V 28 c 0 -1.1 -0.9 -2 -2 -2 H 28 z M 30 28 h 6 v 14 h -6 V 28 z" fill="#64748B"/>
  <text x="46" y="38" fill="#1D4ED8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Bugatti</text>
  
  <!-- Public Pill -->
  <rect x="125" y="24" width="55" height="18" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="152" y="36.5" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Public</text>

  <!-- Category Tag on Right -->
  <rect x="390" y="22" width="165" height="22" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <circle class="pulse-dot-light" cx="404" cy="33" r="3.5" fill="#2563EB"/>
  <text x="414" y="37" fill="#1D4ED8" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">3D PERSPECTIVE UI</text>

  <!-- Description (no hyphens) -->
  <text x="28" y="76" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">An intricate 3D vehicle modeling experiment rendered purely through CSS3</text>
  <text x="28" y="96" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">spatial transforms and perspective matrices without external 3D libraries.</text>

  <!-- Tech Chips & Metadata -->
  <g transform="translate(28, 120)">
    <!-- CSS Dot -->
    <circle cx="6" cy="10" r="5" fill="#563D7C"/>
    <text x="18" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">CSS3 3D</text>

    <!-- React -->
    <circle cx="90" cy="10" r="5" fill="#0284C7"/>
    <text x="102" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12">React.js</text>

    <!-- Matrix -->
    <circle cx="170" cy="10" r="5" fill="#2563EB"/>
    <text x="182" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12">Perspective</text>

    <!-- License -->
    <text x="265" y="14" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">MIT License</text>
  </g>

  <!-- Action Button -->
  <rect x="430" y="148" width="126" height="30" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="493" y="167" text-anchor="middle" fill="#1D4ED8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EXPLORE REPO -></text>
</svg>
