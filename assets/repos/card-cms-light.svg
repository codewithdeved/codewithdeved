<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Course-Management-System repository - Desktop CMS Architecture in Java (Light Mode)">
  <defs>
    <linearGradient id="repoBgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="repoStrokeGoldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLiveGoldLight { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes borderPulseGoldLight { 0%, 100% { stroke-opacity: 0.9; } 50% { stroke-opacity: 0.4; } }
    .pulse-dot-gold-light { animation: pulseLiveGoldLight 2s ease-in-out infinite; }
    .card-border-gold-light { animation: borderPulseGoldLight 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-dot-gold-light, .card-border-gold-light { animation: none; } }
  </style>

  <!-- Container -->
  <rect class="card-border-gold-light" x="0.5" y="0.5" width="579" height="199" rx="12" fill="url(#repoBgLight)" stroke="url(#repoStrokeGoldLight)" stroke-width="1.2"/>

  <!-- Top Bar: Octicon + Title + Public Badge -->
  <path d="M 28 26 c -1.1 0 -2 0.9 -2 2 v 16 c 0 0.6 0.4 1 1 1 h 12 c 0.6 0 1 -0.4 1 -1 V 28 c 0 -1.1 -0.9 -2 -2 -2 H 28 z M 30 28 h 6 v 14 h -6 V 28 z" fill="#64748B"/>
  <text x="46" y="38" fill="#B45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16.5" font-weight="700">Course-Management-System</text>
  
  <!-- Public Pill -->
  <rect x="295" y="24" width="55" height="18" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="322" y="36.5" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Public</text>

  <!-- Category Tag on Right -->
  <rect x="405" y="22" width="150" height="22" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <circle class="pulse-dot-gold-light" cx="419" cy="33" r="3.5" fill="#B45309"/>
  <text x="429" y="37" fill="#B45309" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">DESKTOP CMS</text>

  <!-- Description (no hyphens) -->
  <text x="28" y="76" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">A desktop Course Management System engineered in Java utilizing JavaFX,</text>
  <text x="28" y="96" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Swing, and AWT for academic course enrollment and grading workflows.</text>

  <!-- Tech Chips & Metadata -->
  <g transform="translate(28, 120)">
    <!-- Java Dot -->
    <circle cx="6" cy="10" r="5" fill="#B45309"/>
    <text x="18" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Java</text>

    <!-- JavaFX -->
    <circle cx="65" cy="10" r="5" fill="#D97706"/>
    <text x="77" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12">JavaFX</text>

    <!-- Swing -->
    <circle cx="135" cy="10" r="5" fill="#C9A45C"/>
    <text x="147" y="14" fill="#0F172A" font-family="-apple-system, sans-serif" font-size="12">Swing</text>

    <!-- License -->
    <text x="205" y="14" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">MIT License</text>
  </g>

  <!-- Action Button -->
  <rect x="430" y="148" width="126" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="493" y="167" text-anchor="middle" fill="#B45309" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EXPLORE REPO -></text>
</svg>
