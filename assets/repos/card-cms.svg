<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Course-Management-System repository - Desktop CMS Architecture in Java">
  <defs>
    <linearGradient id="repoBgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120F08"/>
      <stop offset="100%" stop-color="#080704"/>
    </linearGradient>
    <linearGradient id="repoBorderGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C98A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#997028" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="repoGridGold" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseRingGold { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }
    @keyframes beamFlowGold { 0% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 0; } }
    .pulse-glow-gold { animation: pulseRingGold 3.5s ease-in-out infinite 0.5s; }
    .beam-gold { stroke-dasharray: 4 6; animation: beamFlowGold 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-glow-gold, .beam-gold { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="579" height="199" rx="14" fill="url(#repoBgGold)" stroke="url(#repoBorderGold)" stroke-width="1.2"/>
  <rect x="1" y="1" width="578" height="198" rx="13" fill="url(#repoGridGold)"/>

  <!-- Top Category Chip & Pulse -->
  <rect x="24" y="20" width="190" height="22" rx="5" fill="#78350F" fill-opacity="0.35" stroke="#C9A45C" stroke-width="1"/>
  <circle cx="36" cy="31" r="3.5" fill="#EAB308"/>
  <text x="46" y="35" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1">DESKTOP CMS ARCHITECTURE</text>

  <!-- Repo Icon -->
  <circle cx="536" cy="32" r="16" fill="#78350F" fill-opacity="0.3"/>
  <circle class="beam-gold" cx="536" cy="32" r="20" fill="none" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.4"/>
  <text x="536" y="38" text-anchor="middle" font-size="16">☕</text>

  <!-- Repository Title -->
  <text x="24" y="74" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700">Course-Management-System</text>

  <!-- Description (no hyphens) -->
  <text x="24" y="104" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">A desktop Course Management System engineered in Java utilizing JavaFX,</text>
  <text x="24" y="124" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">Swing, and AWT for academic course enrollment and grading workflows.</text>

  <!-- Tech Stack Chips -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="55" height="24" rx="5" fill="#0B1426" stroke="#1E293B" stroke-width="1"/>
    <text x="27" y="16" text-anchor="middle" fill="#ED8B00" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">Java</text>

    <rect x="63" y="0" width="65" height="24" rx="5" fill="#0B1426" stroke="#1E293B" stroke-width="1"/>
    <text x="95" y="16" text-anchor="middle" fill="#F59E0B" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">JavaFX</text>

    <rect x="136" y="0" width="60" height="24" rx="5" fill="#0B1426" stroke="#1E293B" stroke-width="1"/>
    <text x="166" y="16" text-anchor="middle" fill="#FDE68A" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">Swing</text>

    <rect x="204" y="0" width="50" height="24" rx="5" fill="#0B1426" stroke="#1E293B" stroke-width="1"/>
    <text x="229" y="16" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">AWT</text>
  </g>

  <!-- Action Arrow -->
  <rect x="440" y="148" width="116" height="28" rx="6" fill="#854D0E" fill-opacity="0.3" stroke="#C9A45C" stroke-width="1"/>
  <text x="498" y="166" text-anchor="middle" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">VIEW REPO ↗</text>
</svg>
