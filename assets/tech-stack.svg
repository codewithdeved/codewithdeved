<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Technology Stack and Core Tooling Matrix">
  <defs>
    <linearGradient id="podBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080F22"/>
      <stop offset="100%" stop-color="#040712"/>
    </linearGradient>
    <linearGradient id="blueGlowPod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldGlowPod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C98A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#997028" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseCard { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
