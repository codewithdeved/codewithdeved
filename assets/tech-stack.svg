    .pulse-2 { animation: pulseCard 3.5s ease-in-out infinite 0.5s; }
    .pulse-3 { animation: pulseCard 4s ease-in-out infinite 1s; }
    .pulse-4 { animation: pulseCard 3.2s ease-in-out infinite 1.5s; }
    @media (prefers-reduced-motion: reduce) {
      .pulse-1, .pulse-2, .pulse-3, .pulse-4 { animation: none; }
    }
  </style>

