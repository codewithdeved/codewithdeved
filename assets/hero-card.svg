<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="t d">
  <title id="t">CodeWithDeved: Engineering the intersection of code and cognitive design</title>
  <desc id="d">Executive architecture details and live telemetry for Tayyab Ali, Founder and CEO at Vibeans Solutions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <radialGradient id="glowB" cx="400" cy="190" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7DB3FF"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A45C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98A"/>
      <stop offset="1" stop-color="#C9A45C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="780" height="380" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="780" height="380" fill="url(#bg)"/>
    <rect width="780" height="380" fill="url(#grid)"/>
    <rect width="780" height="380" fill="url(#glowB)"/>

    <!-- Brand Header -->
    <text x="56" y="56" fill="#C9A45C" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="8">CODEWITHDEVED</text>
    <rect x="56" y="70" width="60" height="3" rx="1.5" fill="#C9A45C"/>

    <!-- Headline -->
    <text x="56" y="128" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="42" font-weight="800">Engineering the</text>
    <text x="56" y="178" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="42" font-weight="800">Intersection of Code &amp;</text>
    <text x="56" y="228" fill="url(#blueText)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="42" font-weight="800">Cognitive Design.</text>

    <!-- Roles & Subtitle -->
    <text x="56" y="272" fill="#CBD5E1" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="600">Software Engineer  •  Founder and CEO at Vibeans Solutions</text>
    <text x="56" y="296" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13">AI SaaS Architecture  •  Cognitive UX Systems  •  Distributed Cloud Engineering</text>

    <!-- Telemetry HUD Pill -->
    <g transform="translate(56, 322)">
      <rect width="668" height="36" rx="8" fill="#080F1E" fill-opacity="0.9" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4.5" fill="#10B981"/>
      <text x="30" y="22" fill="#10B981" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700">SYS LIVE</text>
      <path d="M96 18 Q 106 10, 116 18 T 136 18 T 156 18 T 176 18 T 196 18" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="216" y="22" fill="#93C5FD" font-family="'Consolas', 'Courier New', monospace" font-size="11">LATENCY: 12ms • EDGE SYNCED</text>
      <text x="548" y="22" fill="#C9A45C" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="600">FLUX: 99.98%</text>
    </g>

    <rect x="0" y="376" width="780" height="4" fill="url(#goldLine)"/>
  </g>
  <rect x="0.5" y="0.5" width="779" height="379" rx="16" fill="none" stroke="#1E293B"/>
</svg>
