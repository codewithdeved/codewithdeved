<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Production Deployments - 6 Live SaaS Platforms Telemetry Console">
  <defs>
    <linearGradient id="prodBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#09142A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="prodBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes radarPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.9); } }
    @keyframes scanSweep { 0% { transform: translateX(-300px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(1200px); opacity: 0; } }
    .radar-dot { animation: radarPulse 2s ease-in-out infinite; transform-origin: 32px 30px; }
    .scan-line { animation: scanSweep 5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .radar-dot, .scan-line { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="109" rx="14" fill="url(#prodBg)" stroke="url(#prodBorder)" stroke-width="1.2"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#1E293B" stroke-width="1"/>
  <rect class="scan-line" x="0" y="55" width="200" height="2" fill="url(#scanGlow)"/>

  <!-- TOP BAR: Fleet Metrics -->
  <g transform="translate(30, 36)">
    <!-- Radar Icon -->
    <circle class="radar-dot" cx="0" cy="-6" r="5" fill="#10B981"/>
    <text x="16" y="-1" fill="#10B981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCTION FLEET: 6 LIVE NODES DEPLOYED</text>
    
    <!-- Central Telemetry -->
    <text x="570" y="-1" text-anchor="middle" fill="#93C5FD" font-family="'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="1">UPTIME: 99.98% • EDGE ACCELERATED</text>
    
    <!-- Right Badge -->
    <text x="1140" y="-1" text-anchor="end" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1">COLLABORATIVE ENTERPRISE SAAS</text>
  </g>

  <!-- BOTTOM BAR: Active Platforms Nodes -->
  <g transform="translate(30, 86)">
    <!-- Node 1: Creaite Hive -->
    <rect x="0" y="-16" width="160" height="26" rx="6" fill="#0B1426" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="14" cy="-3" r="3" fill="#10B981"/>
    <text x="26" y="1" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Creaite Hive (AI)</text>

    <!-- Node 2: DocBrio -->
    <rect x="180" y="-16" width="165" height="26" rx="6" fill="#0B1426" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="194" cy="-3" r="3" fill="#10B981"/>
    <text x="206" y="1" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">DocBrio (Doc Engine)</text>

    <!-- Node 3: Leadster.io -->
    <rect x="365" y="-16" width="170" height="26" rx="6" fill="#0B1426" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="379" cy="-3" r="3" fill="#10B981"/>
    <text x="391" y="1" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Leadster.io (B2B Lead)</text>

    <!-- Node 4: Site.XP -->
    <rect x="555" y="-16" width="165" height="26" rx="6" fill="#0B1426" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="569" cy="-3" r="3" fill="#10B981"/>
    <text x="581" y="1" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Site.XP (SEO Engine)</text>

    <!-- Node 5: PakMilkiyat -->
    <rect x="740" y="-16" width="175" height="26" rx="6" fill="#0B1426" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="754" cy="-3" r="3" fill="#10B981"/>
    <text x="766" y="1" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PakMilkiyat (PropTech)</text>

    <!-- Node 6: AI Genix Hub -->
    <rect x="935" y="-16" width="205" height="26" rx="6" fill="#0B1426" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="949" cy="-3" r="3" fill="#10B981"/>
    <text x="961" y="1" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">AI Genix Hub (Multi Modal)</text>
  </g>
</svg>
