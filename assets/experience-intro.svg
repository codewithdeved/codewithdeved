<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Professional Experience &amp; Leadership - 02 Active Roles">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="expBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E1E"/>
      <stop offset="50%" stop-color="#0B152B"/>
      <stop offset="100%" stop-color="#081022"/>
    </linearGradient>

    <!-- Border Glow Gradient (Cyan to Amber) -->
    <linearGradient id="expBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Top Laser Sheen Gradient -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Left Main Icon Aura -->
    <radialGradient id="iconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtitle Icon Aura -->
    <radialGradient id="subAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Traveling Border Trace Gradient -->
    <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Moving Top Laser Glint -->
    <linearGradient id="laserGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Pill Glass Shimmer -->
    <linearGradient id="pillSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A7F3D0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clipExpChassis">
      <rect x="1" y="1" width="1198" height="158" rx="16"/>
    </clipPath>
    <clipPath id="clipExpPill">
      <rect x="0" y="0" width="144" height="34" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 450; }
    .font-badge { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 700; }
    @keyframes pulseSheen {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes borderTrace {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes topSweep {
      0% { transform: translateX(-280px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1240px); opacity: 0; }
    }
    @keyframes auraBreathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.95; }
    }
    @keyframes briefcaseAscend {
      0%, 100% { opacity: 0.7; transform: translateY(0px); }
      50% { opacity: 1; transform: translateY(-1.5px); }
    }
    @keyframes ringOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes nexusPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.78; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    @keyframes pillWave {
      0%, 25% { transform: translateX(-160px); opacity: 0; }
      35% { opacity: 1; }
      55% { transform: translateX(170px); opacity: 0; }
      100% { transform: translateX(170px); opacity: 0; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 16; }
      100% { stroke-dashoffset: 0; }
    }
    .pulse-sheen { animation: pulseSheen 3s ease-in-out infinite; }
    .border-trace-halo { stroke-dasharray: 140 360; stroke-linecap: round; animation: borderTrace 7.5s linear infinite; }
    .border-trace-mid  { stroke-dasharray: 85 415;  stroke-linecap: round; animation: borderTrace 7.5s linear infinite; }
    .border-trace-core { stroke-dasharray: 38 462;  stroke-linecap: round; animation: borderTrace 7.5s linear infinite; }
    .top-glint { animation: topSweep 4.8s ease-in-out infinite; }
    .aura-breathe { animation: auraBreathe 3.6s ease-in-out infinite; }
    .briefcase-beam { animation: briefcaseAscend 2.8s ease-in-out infinite; }
    .synergy-ring { animation: ringOrbit 16s linear infinite; transform-origin: 16px 16px; }
    .synergy-nexus { animation: nexusPulse 3s ease-in-out infinite; transform-origin: 16px 15.5px; }
    .synergy-flow { stroke-dasharray: 4 4; animation: flowLine 2.4s linear infinite; }
    .pill-shimmer { animation: pillWave 5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-sheen, .border-trace-halo, .border-trace-mid, .border-trace-core, .top-glint,
      .aura-breathe, .briefcase-beam, .synergy-ring, .synergy-nexus, .synergy-flow, .pill-shimmer { animation: none; }
    }
  </style>

  <!-- Card Chassis -->
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="url(#expBg)" stroke="url(#expBorder)" stroke-width="1.5"/>

  <!-- Feathered Volumetric Perimeter Border Glow -->
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="none" stroke="url(#traceGrad)" stroke-width="4.5" stroke-opacity="0.16" pathLength="1000" class="border-trace-halo"/>
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="none" stroke="url(#traceGrad)" stroke-width="2.4" stroke-opacity="0.42" pathLength="1000" class="border-trace-mid"/>
  <rect x="1" y="1" width="1198" height="158" rx="16" fill="none" stroke="url(#traceGrad)" stroke-width="1.5" stroke-opacity="0.92" pathLength="1000" class="border-trace-core"/>
  
  <!-- Top Specular Laser Line & Sweep -->
  <rect x="220" y="1" width="760" height="2" fill="url(#topSheen)" class="pulse-sheen"/>
  <g clip-path="url(#clipExpChassis)">
    <rect x="0" y="0.5" width="240" height="2.5" fill="url(#laserGlint)" class="top-glint"/>
  </g>

  <!-- ================= ROW 1 ================= -->
  <!-- Main Heading Icon: 44x44 at x=52, y=26 -->
  <circle cx="74" cy="48" r="28" fill="url(#iconAura)" class="aura-breathe"/>
  <rect x="52" y="26" width="44" height="44" rx="10" fill="#0F1D38" stroke="#38BDF8" stroke-width="1.3"/>
  
  <!-- 3D Isometric Executive Terminal / Career Briefcase Node -->
  <g transform="translate(58, 32)">
    <!-- Briefcase Top Handle in Cyan Wireframe -->
    <path d="M12 7 L12 3 L20 3 L20 7" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Isometric Top Face -->
    <polygon points="16,5 27,11 16,17 5,11" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Isometric Left Face -->
    <polygon points="5,11 16,17 16,29 5,23" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Isometric Right Face -->
    <polygon points="16,17 27,11 27,23 16,29" fill="#132347" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Executive Center Clasp & Ascent Beam in Amber -->
    <g class="briefcase-beam">
      <polygon points="16,14 19,16.5 16,19 13,16.5" fill="#F59E0B"/>
      <line x1="16" y1="5" x2="16" y2="0" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main Section Title: Aligned at x=114, baseline at y=57 (center y=48) -->
  <text x="114" y="57" fill="#F8FAFC" class="font-title" font-size="29" letter-spacing="-0.4">Professional Experience &amp; Leadership</text>

  <!-- Right Side Badge: "02 Active Roles" (centered vertically at y=48) -->
  <g transform="translate(1004, 31)">
    <rect x="0" y="0" width="144" height="34" rx="8" fill="#0A162B" stroke="#10B981" stroke-width="1.2"/>
    <rect x="2" y="2" width="140" height="14" rx="6" fill="#10B981" fill-opacity="0.08"/>
    <g clip-path="url(#clipExpPill)">
      <rect x="0" y="0" width="75" height="34" fill="url(#pillSheen)" class="pill-shimmer"/>
    </g>
    <!-- Dual-Tier Active Milestone SVG Icon -->
    <g transform="translate(13, 9)">
      <!-- Base Layer 2 -->
      <path d="M1 10.5 L8 14 L15 10.5" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Top Diamond Layer 1 -->
      <polygon points="8,2 15,5.5 8,9 1,5.5" fill="#064E3B" stroke="#34D399" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- Core Active Center -->
      <circle cx="8" cy="5.5" r="1.4" fill="#A7F3D0"/>
    </g>
    <text x="37" y="22" fill="#34D399" class="font-badge" font-size="12.5" letter-spacing="0.4">02 Active Roles</text>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- Subheading Icon: 44x44 at x=52, y=90 (EXACTLY ALIGNED WITH MAIN ICON!) -->
  <circle cx="74" cy="112" r="28" fill="url(#subAura)" class="aura-breathe"/>
  <rect x="52" y="90" width="44" height="44" rx="10" fill="#0F1D38" stroke="#38BDF8" stroke-width="1.3"/>
  
  <!-- 3D Career Milestone / Dual-Node Synergy Compass (Founder + Engineer) -->
  <g transform="translate(58, 96)">
    <!-- Outer Orbit Ring with dashed technical ticks -->
    <ellipse cx="16" cy="16" rx="13" ry="13" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 2" class="synergy-ring"/>
    <circle cx="16" cy="16" r="11" fill="#0B132B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Dual Synergy Interconnect Pathway -->
    <line x1="16" y1="6" x2="9" y2="22" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" class="synergy-flow"/>
    <line x1="16" y1="6" x2="23" y2="22" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" class="synergy-flow"/>
    <line x1="9" y1="22" x2="23" y2="22" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" class="synergy-flow"/>
    <!-- Top Founder Node (Amber) -->
    <circle cx="16" cy="6" r="3.2" fill="#0E1D38" stroke="#F59E0B" stroke-width="1.4"/>
    <circle cx="16" cy="6" r="1.3" fill="#FEF3C7"/>
    <!-- Engineer Node Left (Cyan) -->
    <circle cx="9" cy="22" r="3.2" fill="#0E1D38" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="9" cy="22" r="1.3" fill="#A5F3FC"/>
    <!-- Delivery Node Right (Cyan) -->
    <circle cx="23" cy="22" r="3.2" fill="#0E1D38" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="23" cy="22" r="1.3" fill="#A5F3FC"/>
    <!-- Central Energy Nexus Diamond -->
    <polygon points="16,13 18.5,15.5 16,18 13.5,15.5" fill="#F59E0B" class="synergy-nexus"/>
  </g>

  <!-- Subheading Text: Aligned at x=114 (EXACTLY ALIGNED WITH MAIN HEADING!), baseline at y=118.5 -->
  <text x="114" y="118.5" fill="#94A3B8" class="font-sub" font-size="16.6" letter-spacing="0">Tracking active engineering roles, founder initiatives, and production software delivery across modern tech ecosystems.</text>
</svg>
