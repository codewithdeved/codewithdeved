<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 295" width="1200" height="295" role="img" aria-label="Enterprise Architecture Pipeline">
  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="nodeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070E20"/>
      <stop offset="100%" stop-color="#0A162F"/>
    </linearGradient>
    <linearGradient id="pipeLaser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes movePacket1 {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(890px); opacity: 0; }
    }
    @keyframes movePacket2 {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(890px); opacity: 0; }
    }
    @keyframes pulseNodeGlow {
      0%, 100% { stroke-opacity: 0.55; }
      50% { stroke-opacity: 0.95; }
    }
    .packet-stream-1 { animation: movePacket1 4.5s linear infinite; }
    .packet-stream-2 { animation: movePacket2 4.5s linear infinite 2.25s; }
    .node-chassis { animation: pulseNodeGlow 3.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .packet-stream-1, .packet-stream-2, .node-chassis { animation: none; }
    }
  </style>

  <!-- Outer Glass Chassis -->
  <rect x="2" y="2" width="1196" height="291" rx="8" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Title Ribbon -->
  <circle cx="28" cy="22" r="3.5" fill="#10B981"/>
  <text x="40" y="25" fill="#38BDF8" font-family="'Consolas', monospace" font-size="10" font-weight="700">ENTERPRISE SYSTEM BLUEPRINT • DATA PIPELINE ARCHITECTURE</text>
  <text x="1170" y="25" text-anchor="end" fill="#C9A45C" font-family="'Consolas', monospace" font-size="9.5" font-weight="700">END-TO-END SPECIFICATION</text>
  <line x1="24" y1="34" x2="1176" y2="34" stroke="#1E293B" stroke-width="0.8"/>

  <!-- Main Connecting Bus Track across all nodes -->
  <line x1="150" y1="160" x2="1050" y2="160" stroke="#1E293B" stroke-width="3"/>
  <line x1="150" y1="160" x2="1050" y2="160" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,6" stroke-opacity="0.6"/>

  <!-- Animated Traveling Data Packets along the central bus -->
  <g class="packet-stream-1" transform="translate(150, 160)">
    <circle cx="0" cy="0" r="4.5" fill="#38BDF8" filter="url(#glowBlue)"/>
    <circle cx="-12" cy="0" r="2.5" fill="#C9A45C" opacity="0.8"/>
  </g>
  <g class="packet-stream-2" transform="translate(150, 160)">
    <circle cx="0" cy="0" r="4.5" fill="#10B981" filter="url(#glowBlue)"/>
    <circle cx="-12" cy="0" r="2.5" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- ================= STAGE 01: COGNITIVE DESIGN ================= -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="265" height="215" rx="6" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="1.1" class="node-chassis"/>
    <rect x="0" y="0" width="265" height="30" rx="6" fill="#0B162E"/>
    <rect x="0" y="20" width="265" height="10" fill="#0B162E"/>
    <line x1="0" y1="30" x2="265" y2="30" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6"/>
    
    <text x="14" y="19" fill="#38BDF8" font-family="'Consolas', monospace" font-size="9" font-weight="700">STAGE 01 • INCEPTION</text>
    <text x="14" y="52" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700">COGNITIVE UX DESIGN</text>
    <line x1="14" y1="60" x2="120" y2="60" stroke="#38BDF8" stroke-width="1"/>

    <text x="14" y="82" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Human Cognitive Mental Models</text>
    <text x="14" y="102" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ 60fps Zero-Jank Micro-Interactions</text>
    <text x="14" y="122" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Scalable Atomic Design Tokens</text>
    <text x="14" y="142" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ WCAG AAA Contrast Integrity</text>

    <!-- Node Port Dot -->
    <circle cx="265" cy="108" r="4" fill="#38BDF8"/>

    <rect x="14" y="174" width="110" height="22" rx="3" fill="#050B18" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="69" y="188" text-anchor="middle" fill="#38BDF8" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">UX ARCHITECTURE</text>
  </g>

  <!-- ================= STAGE 02: FULL STACK CORE ================= -->
  <g transform="translate(325, 52)">
    <rect x="0" y="0" width="265" height="215" rx="6" fill="url(#nodeBg)" stroke="#C9A45C" stroke-width="1.1" class="node-chassis"/>
    <rect x="0" y="0" width="265" height="30" rx="6" fill="#1C180C"/>
    <rect x="0" y="20" width="265" height="10" fill="#1C180C"/>
    <line x1="0" y1="30" x2="265" y2="30" stroke="#C9A45C" stroke-width="0.8" stroke-opacity="0.6"/>

    <text x="14" y="19" fill="#C9A45C" font-family="'Consolas', monospace" font-size="9" font-weight="700">STAGE 02 • RUNTIME</text>
    <text x="14" y="52" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700">FULL-STACK CORE</text>
    <line x1="14" y1="60" x2="120" y2="60" stroke="#C9A45C" stroke-width="1"/>

    <text x="14" y="82" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Next.js 15 App Router &amp; React 19</text>
    <text x="14" y="102" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Strict TypeScript 5.x Typings</text>
    <text x="14" y="122" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Zero Cumulative Layout Shift (CLS)</text>
    <text x="14" y="142" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ High-Throughput REST &amp; WebSockets</text>

    <!-- Node Port Dots -->
    <circle cx="0" cy="108" r="4" fill="#38BDF8"/>
    <circle cx="265" cy="108" r="4" fill="#C9A45C"/>

    <rect x="14" y="174" width="110" height="22" rx="3" fill="#050B18" stroke="#C9A45C" stroke-width="0.8"/>
    <text x="69" y="188" text-anchor="middle" fill="#C9A45C" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">AST VERIFIED</text>
  </g>

  <!-- ================= STAGE 03: AI ENGINE & RAG ================= -->
  <g transform="translate(625, 52)">
    <rect x="0" y="0" width="265" height="215" rx="6" fill="url(#nodeBg)" stroke="#10B981" stroke-width="1.1" class="node-chassis"/>
    <rect x="0" y="0" width="265" height="30" rx="6" fill="#081E15"/>
    <rect x="0" y="20" width="265" height="10" fill="#081E15"/>
    <line x1="0" y1="30" x2="265" y2="30" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6"/>

    <text x="14" y="19" fill="#10B981" font-family="'Consolas', monospace" font-size="9" font-weight="700">STAGE 03 • INTELLIGENCE</text>
    <text x="14" y="52" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700">AI ENGINE &amp; RAG</text>
    <line x1="14" y1="60" x2="120" y2="60" stroke="#10B981" stroke-width="1"/>

    <text x="14" y="82" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Multi-Modal LLM Inference</text>
    <text x="14" y="102" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ High-Dimension Vector Embeddings</text>
    <text x="14" y="122" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Local Browser WASM Compute</text>
    <text x="14" y="142" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Real-Time Contextual Synthesis</text>

    <!-- Node Port Dots -->
    <circle cx="0" cy="108" r="4" fill="#C9A45C"/>
    <circle cx="265" cy="108" r="4" fill="#10B981"/>

    <rect x="14" y="174" width="118" height="22" rx="3" fill="#050B18" stroke="#10B981" stroke-width="0.8"/>
    <text x="73" y="188" text-anchor="middle" fill="#10B981" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">AI ORCHESTRATION</text>
  </g>

  <!-- ================= STAGE 04: GLOBAL EDGE CLOUD ================= -->
  <g transform="translate(925, 52)">
    <rect x="0" y="0" width="250" height="215" rx="6" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="1.1" class="node-chassis"/>
    <rect x="0" y="0" width="250" height="30" rx="6" fill="#0B162E"/>
    <rect x="0" y="20" width="250" height="10" fill="#0B162E"/>
    <line x1="0" y1="30" x2="250" y2="30" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6"/>

    <text x="14" y="19" fill="#38BDF8" font-family="'Consolas', monospace" font-size="9" font-weight="700">STAGE 04 • DEPLOYMENT</text>
    <text x="14" y="52" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="700">GLOBAL EDGE CLOUD</text>
    <line x1="14" y1="60" x2="120" y2="60" stroke="#38BDF8" stroke-width="1"/>

    <text x="14" y="82" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Vercel Edge Global Mesh</text>
    <text x="14" y="102" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Supabase PostgreSQL Cluster</text>
    <text x="14" y="122" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Automated GitHub CI/CD</text>
    <text x="14" y="142" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="10.5">▸ Multi-Region Redundancy</text>

    <!-- Node Port Dot -->
    <circle cx="0" cy="108" r="4" fill="#10B981"/>

    <rect x="14" y="174" width="110" height="22" rx="3" fill="#050B18" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="69" y="188" text-anchor="middle" fill="#38BDF8" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">99.98% SLA MESH</text>
  </g>
</svg>
