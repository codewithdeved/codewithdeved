<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="About Tayyab Ali (CodeWithDeved) - Engineering Philosophy and Background">
  <defs>
    <linearGradient id="bgAbout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#081124"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C"/>
      <stop offset="50%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#C9A45C"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="gridAbout" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="1200" height="450" rx="16"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseGreen { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes floatPill { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes waveFlow { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
    @keyframes barPulse { 0%, 100% { width: 140px; } 50% { width: 175px; } }
    @keyframes cardShimmer { 0% { transform: translateX(-150px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateX(470px); opacity: 0; } }
    
    .pulse-dot { animation: pulseGreen 2s ease-in-out infinite; transform-origin: 68px 108px; }
    .cursor { animation: blinkCursor 1s infinite; }
    .pill-1 { animation: floatPill 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill 4.5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill 5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPill 4.2s ease-in-out infinite 1.5s; }
    .waveform { stroke-dasharray: 8 6; animation: waveFlow 3s linear infinite; }
    .bar-anim { animation: barPulse 4s ease-in-out infinite; }
    .shimmer { animation: cardShimmer 4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .cursor, .pill-1, .pill-2, .pill-3, .pill-4, .waveform, .bar-anim, .shimmer { animation: none; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1200" height="450" fill="url(#bgAbout)"/>
    <rect width="1200" height="450" fill="url(#gridAbout)"/>

    <!-- Subtle Ambience Glow -->
    <circle cx="1080" cy="110" r="280" fill="#2563EB" opacity="0.14" filter="blur(40px)"/>
    <circle cx="100" cy="380" r="220" fill="#C9A45C" opacity="0.09" filter="blur(40px)"/>

    <!-- Top Window Chrome Bar -->
    <rect width="1200" height="38" fill="#060A14" fill-opacity="0.9"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="19" r="6" fill="#EF4444" opacity="0.85"/>
    <circle cx="48" cy="19" r="6" fill="#F59E0B" opacity="0.85"/>
    <circle cx="68" cy="19" r="6" fill="#10B981" opacity="0.85"/>
    
    <!-- Window Title -->
    <text x="600" y="24" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">tayyab@codewithdeved: ~/philosophy.sh</text>

    <!-- LEFT COLUMN: Terminal Narrative (x=50..650) -->
    <!-- Prompt Command -->
    <text x="50" y="74" fill="#60A5FA" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600">❯ <tspan fill="#F5F1E8">whoami --focus</tspan></text>
    <rect class="cursor" x="210" y="61" width="8" height="15" fill="#60A5FA"/>

    <!-- Status Badge -->
    <rect x="50" y="94" width="310" height="26" rx="13" fill="#0B1B33" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6"/>
    <circle class="pulse-dot" cx="68" cy="107" r="4.5" fill="#10B981"/>
    <text x="82" y="111" fill="#93C5FD" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO ENGINEERING LEADERSHIP &amp; AI SAAS</text>

    <!-- Headline Statement -->
    <text x="50" y="152" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700">Engineering the Nexus of Code Architecture</text>
    <text x="50" y="178" fill="url(#goldText)" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700">&amp; Human Cognitive Design</text>

    <!-- Bio Narrative (zero hyphens) -->
    <text x="50" y="214" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.5">I am <tspan fill="#F1F5F9" font-weight="600">Tayyab Ali</tspan> (CodeWithDeved), Founder and CEO at <tspan fill="#60A5FA" font-weight="600">Vibeans Solutions</tspan></text>
    <text x="50" y="236" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.5">and Software Engineer at <tspan fill="#F1F5F9" font-weight="600">Perception Tech</tspan>, based in Karachi, Pakistan.</text>
    <text x="50" y="258" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.5">I build production web systems and AI applications designed around how</text>
    <text x="50" y="280" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13.5">users process information, make high stakes decisions, and interact.</text>

    <!-- Live Telemetry / Waveform HUD -->
    <g transform="translate(50, 304)">
      <rect width="580" height="42" rx="8" fill="#060A14" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Sine/Brainwave path -->
      <path class="waveform" d="M 16 21 Q 40 5 65 21 T 115 21 T 165 21 T 215 21" fill="none" stroke="url(#waveGrad)" stroke-width="2"/>
      <text x="225" y="25" fill="#3B82F6" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">COGNITIVE FLOW</text>
      
      <!-- Animated Load Meter -->
      <text x="355" y="25" fill="#94A3B8" font-family="'Segoe UI', monospace" font-size="11">SYSTEM CAPACITY:</text>
      <rect x="465" y="15" width="95" height="12" rx="4" fill="#0B1426"/>
      <rect class="bar-anim" x="465" y="15" width="80" height="12" rx="4" fill="#10B981" fill-opacity="0.8"/>
    </g>

    <!-- Philosophy Quote Callout -->
    <rect x="50" y="362" width="580" height="60" rx="8" fill="#0B1426" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="50" y1="362" x2="50" y2="422" stroke="#C9A45C" stroke-width="4"/>
    <text x="70" y="388" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="13" font-style="italic">"Turning complex technical challenges into intuitive, high impact digital products."</text>
    <text x="70" y="408" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">— Tayyab Ali, Engineering Philosophy</text>

    <!-- VERTICAL DIVIDER WITH GRADIENT -->
    <line x1="660" y1="56" x2="660" y2="430" stroke="#1E293B" stroke-width="1"/>
    <circle cx="660" cy="240" r="3.5" fill="#C9A45C" opacity="0.9"/>

    <!-- RIGHT COLUMN: Interactive Matrix Cards (x=690..1150) -->
    <text x="690" y="74" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2">CORE CAPABILITIES &amp; SPECIALIZATIONS</text>

    <!-- Card 1: AI SaaS -->
    <g class="pill-1">
      <rect x="690" y="94" width="460" height="70" rx="10" fill="#091326" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="129" r="18" fill="#1E3A8A" fill-opacity="0.5"/>
      <text x="725" y="135" text-anchor="middle" font-size="18">🧠</text>
      <text x="756" y="121" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Generative AI &amp; Intelligent Products</text>
      <text x="756" y="142" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">LLM Integrations • Retrieval Augmented Generation (RAG) • Prompt Systems</text>
      <rect class="shimmer" x="690" y="94" width="100" height="2" fill="#60A5FA"/>
    </g>

    <!-- Card 2: Full Stack SaaS -->
    <g class="pill-2">
      <rect x="690" y="178" width="460" height="70" rx="10" fill="#091326" stroke="#C9A45C" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="213" r="18" fill="#78350F" fill-opacity="0.45"/>
      <text x="725" y="219" text-anchor="middle" font-size="18">🌐</text>
      <text x="756" y="205" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Full Stack &amp; Scalable Web Architecture</text>
      <text x="756" y="226" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">Next.js • TypeScript • Node.js • Cloud Microservices &amp; API Design</text>
      <rect class="shimmer" x="690" y="178" width="100" height="2" fill="#FDE68A"/>
    </g>

    <!-- Card 3: Cognitive UX -->
    <g class="pill-3">
      <rect x="690" y="262" width="460" height="70" rx="10" fill="#091326" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="297" r="18" fill="#1E3A8A" fill-opacity="0.5"/>
      <text x="725" y="303" text-anchor="middle" font-size="18">🎨</text>
      <text x="756" y="289" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Cognitive Design &amp; Decision UX</text>
      <text x="756" y="310" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">Human Perception • Friction Reduction • Trust Architecture &amp; Clarity</text>
      <rect class="shimmer" x="690" y="262" width="100" height="2" fill="#60A5FA"/>
    </g>

    <!-- Card 4: FinTech & HealthTech -->
    <g class="pill-4">
      <rect x="690" y="346" width="460" height="70" rx="10" fill="#091326" stroke="#C9A45C" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="381" r="18" fill="#78350F" fill-opacity="0.45"/>
      <text x="725" y="387" text-anchor="middle" font-size="18">💳</text>
      <text x="756" y="373" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="700">FinTech &amp; Healthcare Technology</text>
      <text x="756" y="394" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">High Integrity Workflows • Data Privacy • Enterprise Real Estate Systems</text>
      <rect class="shimmer" x="690" y="346" width="100" height="2" fill="#FDE68A"/>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="449" rx="16" fill="none" stroke="url(#borderGlow)" stroke-width="1.2"/>
</svg>
