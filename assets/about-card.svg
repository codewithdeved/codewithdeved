<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="About Tayyab Ali (CodeWithDeved) - Interactive Engineering Workstation">
  <defs>
    <linearGradient id="bgTerminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>
    <linearGradient id="terminalBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A45C"/>
      <stop offset="50%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#C9A45C"/>
    </linearGradient>
    <linearGradient id="cyanWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="packetGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#C9A45C"/>
    </linearGradient>
    <pattern id="termGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <clipPath id="termClip">
      <rect width="1200" height="480" rx="16"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseGreen { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes floatModule { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes waveMotion { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: 0; } }
    @keyframes barPulse { 0%, 100% { width: 95px; } 50% { width: 115px; } }
    @keyframes scanShimmer { 0% { transform: translateX(-160px); opacity: 0; } 50% { opacity: 0.85; } 100% { transform: translateX(480px); opacity: 0; } }
    @keyframes eqJump1 { 0%, 100% { height: 6px; y: 18px; } 50% { height: 20px; y: 4px; } }
    @keyframes eqJump2 { 0%, 100% { height: 22px; y: 2px; } 50% { height: 8px; y: 16px; } }
    @keyframes eqJump3 { 0%, 100% { height: 12px; y: 12px; } 50% { height: 24px; y: 0px; } }
    @keyframes eqJump4 { 0%, 100% { height: 18px; y: 6px; } 50% { height: 10px; y: 14px; } }
    @keyframes spinOrb { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes packetSlide { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(200px); opacity: 0; } }

    .pulse-dot { animation: pulseGreen 2s ease-in-out infinite; transform-origin: 68px 108px; }
    .cursor { animation: blinkCursor 1s infinite; }
    .mod-1 { animation: floatModule 4s ease-in-out infinite; }
    .mod-2 { animation: floatModule 4.5s ease-in-out infinite 0.5s; }
    .mod-3 { animation: floatModule 5s ease-in-out infinite 1s; }
    .mod-4 { animation: floatModule 4.2s ease-in-out infinite 1.5s; }
    .wave-line { stroke-dasharray: 8 6; animation: waveMotion 2.5s linear infinite; }
    .bar-gauge { animation: barPulse 3.5s ease-in-out infinite; }
    .shimmer-line { animation: scanShimmer 4s ease-in-out infinite; }
    .eq-1 { animation: eqJump1 1.2s ease-in-out infinite; }
    .eq-2 { animation: eqJump2 1.5s ease-in-out infinite 0.2s; }
    .eq-3 { animation: eqJump3 1.1s ease-in-out infinite 0.4s; }
    .eq-4 { animation: eqJump4 1.4s ease-in-out infinite 0.1s; }
    .spin-ring { animation: spinOrb 12s linear infinite; transform-origin: 725px 132px; }
    .packet-dot { animation: packetSlide 2.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .cursor, .mod-1, .mod-2, .mod-3, .mod-4, .wave-line, .bar-gauge, .shimmer-line, .eq-1, .eq-2, .eq-3, .eq-4, .spin-ring, .packet-dot { animation: none; }
    }
  </style>

  <g clip-path="url(#termClip)">
    <!-- Base Background -->
    <rect width="1200" height="480" fill="url(#bgTerminal)"/>
    <rect width="1200" height="480" fill="url(#termGrid)"/>

    <!-- Subtle Ambience Glow -->
    <circle cx="1060" cy="120" r="300" fill="#2563EB" opacity="0.12" filter="blur(50px)"/>
    <circle cx="120" cy="390" r="240" fill="#C9A45C" opacity="0.08" filter="blur(50px)"/>

    <!-- macOS Chrome Title Bar -->
    <rect width="1200" height="38" fill="#060A14" fill-opacity="0.95"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Window Control Buttons -->
    <circle cx="28" cy="19" r="6" fill="#EF4444" opacity="0.9"/>
    <circle cx="48" cy="19" r="6" fill="#F59E0B" opacity="0.9"/>
    <circle cx="68" cy="19" r="6" fill="#10B981" opacity="0.9"/>
    
    <!-- Terminal Header Session Title -->
    <text x="600" y="24" text-anchor="middle" fill="#94A3B8" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="600" letter-spacing="1.5">tayyab@codewithdeved: ~/architecture.sh (zsh)</text>

    <!-- LEFT COLUMN: Authentic Engineering Narrative (x=50..650) -->
    <!-- Shell Command Prompt -->
    <text x="50" y="74" fill="#60A5FA" font-family="'Consolas', 'Courier New', monospace" font-size="14.5" font-weight="600">❯ <tspan fill="#F5F1E8">whoami --focus</tspan></text>
    <rect class="cursor" x="215" y="61" width="8" height="15" fill="#60A5FA"/>

    <!-- Status Badge -->
    <rect x="50" y="94" width="330" height="26" rx="13" fill="#0B1B33" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6"/>
    <circle class="pulse-dot" cx="68" cy="107" r="4.5" fill="#10B981"/>
    <text x="82" y="111" fill="#93C5FD" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OPEN TO ENGINEERING LEADERSHIP &amp; AI SAAS</text>

    <!-- Headline Statement -->
    <text x="50" y="156" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700">Engineering the Nexus of Code Architecture</text>
    <text x="50" y="184" fill="url(#goldText)" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700">&amp; Human Cognitive Design</text>

    <!-- Bio Narrative (zero hyphens, high contrast) -->
    <text x="50" y="222" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="14.5">I am <tspan fill="#60A5FA" font-weight="700">Tayyab Ali</tspan> (CodeWithDeved), Founder and CEO at <tspan fill="#FDE68A" font-weight="600">Vibeans Solutions</tspan></text>
    <text x="50" y="244" fill="#CBD5E1" font-family="'Segoe UI', sans-serif" font-size="14.5">and Software Engineer at <tspan fill="#93C5FD" font-weight="600">Perception Tech</tspan>, based in Karachi, Pakistan.</text>
    <text x="50" y="266" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="14.5">I build production web systems and AI applications designed around how</text>
    <text x="50" y="288" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="14.5">users process information, make high stakes decisions, and interact.</text>

    <!-- Real Telemetry HUD (Cognitive Waveform + Equalizer + Load Gauge) -->
    <g transform="translate(50, 314)">
      <rect width="580" height="48" rx="8" fill="#060A14" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Sine/Brainwave path -->
      <path class="wave-line" d="M 16 24 Q 35 8 55 24 T 95 24 T 135 24 T 175 24" fill="none" stroke="url(#cyanWave)" stroke-width="2"/>
      <text x="185" y="28" fill="#60A5FA" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">COGNITIVE FLOW</text>
      
      <!-- 4-Band Equalizer -->
      <g transform="translate(305, 12)">
        <rect class="eq-1" x="0" y="10" width="3.5" height="15" rx="1.5" fill="#3B82F6"/>
        <rect class="eq-2" x="7" y="5" width="3.5" height="20" rx="1.5" fill="#60A5FA"/>
        <rect class="eq-3" x="14" y="8" width="3.5" height="17" rx="1.5" fill="#C9A45C"/>
        <rect class="eq-4" x="21" y="12" width="3.5" height="13" rx="1.5" fill="#10B981"/>
      </g>

      <!-- Live Capacity Gauge -->
      <text x="350" y="28" fill="#94A3B8" font-family="'Segoe UI', monospace" font-size="11">SYSTEM CAPACITY:</text>
      <rect x="460" y="17" width="105" height="14" rx="4" fill="#0B1426"/>
      <rect class="bar-gauge" x="460" y="17" width="95" height="14" rx="4" fill="#10B981" fill-opacity="0.85"/>
      <text x="512" y="28" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', monospace" font-size="9" font-weight="700">96%</text>
    </g>

    <!-- Executive Quote Callout -->
    <rect x="50" y="380" width="580" height="66" rx="8" fill="#0B1426" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="50" y1="380" x2="50" y2="446" stroke="#C9A45C" stroke-width="4"/>
    <text x="70" y="406" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="13.5" font-style="italic">"Turning complex technical challenges into intuitive, high impact digital products."</text>
    <text x="70" y="430" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">— Tayyab Ali, Engineering Philosophy</text>

    <!-- Center Vertical Divider -->
    <line x1="660" y1="56" x2="660" y2="456" stroke="#1E293B" stroke-width="1"/>
    <circle cx="660" cy="256" r="3.5" fill="#C9A45C" opacity="0.9"/>

    <!-- RIGHT COLUMN: 4 Tactile Glass Modules (x=690..1150) -->
    <text x="690" y="74" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="2">CORE CAPABILITIES &amp; SPECIALIZATIONS</text>

    <!-- Module 1: Generative AI -->
    <g class="mod-1">
      <rect x="690" y="94" width="460" height="74" rx="10" fill="#091326" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="131" r="20" fill="#1E3A8A" fill-opacity="0.5"/>
      <circle class="spin-ring" cx="725" cy="131" r="24" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="725" y="138" text-anchor="middle" font-size="20">🧠</text>
      <text x="760" y="122" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Generative AI &amp; Intelligent Products</text>
      <text x="760" y="144" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">LLM Integrations • Retrieval Augmented Generation (RAG) • Prompt Systems</text>
      <rect class="shimmer-line" x="690" y="94" width="100" height="2" fill="#60A5FA"/>
    </g>

    <!-- Module 2: Full Stack Architecture -->
    <g class="mod-2">
      <rect x="690" y="182" width="460" height="74" rx="10" fill="#091326" stroke="#C9A45C" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="219" r="20" fill="#78350F" fill-opacity="0.45"/>
      <text x="725" y="226" text-anchor="middle" font-size="20">🌐</text>
      <text x="760" y="210" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Full Stack &amp; Scalable Web Architecture</text>
      <text x="760" y="232" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">Next.js • TypeScript • Node.js • Cloud Microservices &amp; API Design</text>
      <rect class="shimmer-line" x="690" y="182" width="100" height="2" fill="#FDE68A"/>
    </g>

    <!-- Module 3: Cognitive UX -->
    <g class="mod-3">
      <rect x="690" y="270" width="460" height="74" rx="10" fill="#091326" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="307" r="20" fill="#1E3A8A" fill-opacity="0.5"/>
      <text x="725" y="314" text-anchor="middle" font-size="20">🎨</text>
      <text x="760" y="298" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Cognitive Design &amp; Decision UX</text>
      <text x="760" y="320" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">Human Perception • Friction Reduction • Trust Architecture &amp; Clarity</text>
      <rect class="shimmer-line" x="690" y="270" width="100" height="2" fill="#60A5FA"/>
    </g>

    <!-- Module 4: FinTech & HealthTech -->
    <g class="mod-4">
      <rect x="690" y="358" width="460" height="74" rx="10" fill="#091326" stroke="#C9A45C" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="725" cy="395" r="20" fill="#78350F" fill-opacity="0.45"/>
      <text x="725" y="402" text-anchor="middle" font-size="20">💳</text>
      <text x="760" y="386" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">FinTech &amp; Healthcare Technology</text>
      <text x="760" y="408" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12">High Integrity Workflows • Data Privacy • Enterprise Real Estate Systems</text>
      <rect class="shimmer-line" x="690" y="358" width="100" height="2" fill="#FDE68A"/>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="479" rx="16" fill="none" stroke="url(#terminalBorder)" stroke-width="1.2"/>
</svg>
