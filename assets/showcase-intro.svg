<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Engineering a New Dimension of Desktop Computing">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="50%" stop-color="#0C162D"/>
      <stop offset="100%" stop-color="#091224"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Top Laser Sheen Gradient -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Heading Icon Aura -->
    <radialGradient id="headingAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Subheading Icon Aura -->
    <radialGradient id="subAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Gemini Sparkle Gradient -->
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E75F6"/>
      <stop offset="50%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 600; }
    .font-body { font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; font-weight: 400; }
    .font-mono { font-family: 'Consolas', 'Fira Code', monospace; }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Card Chassis -->
  <rect x="1" y="1" width="1198" height="478" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  
  <!-- Top Specular Laser Line -->
  <rect x="300" y="1" width="600" height="2" fill="url(#topSheen)"/>

  <!-- 1. TOP STATUS BADGE -->
  <g transform="translate(52, 38)">
    <rect x="0" y="0" width="285" height="26" rx="13" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981" class="pulse-glow"/>
    <text x="26" y="17" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.2">FLAGSHIP WEB ENGINEERING</text>
  </g>

  <!-- 2. MAIN HEADING WITH REAL ACCURATE 3D DESKTOP COMPUTING ICON -->
  <g transform="translate(52, 80)">
    <!-- Icon Container (44x44 centered at 22, 22) -->
    <circle cx="22" cy="22" r="26" fill="url(#headingAura)"/>
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#0F1D38" stroke="#38BDF8" stroke-width="1.2"/>
    
    <!-- 3D Isometric Desktop Computing Vector Glyph -->
    <g transform="translate(6, 6)">
      <!-- Pedestal Base -->
      <polygon points="16,29 26,24 16,19 6,24" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <!-- Stem -->
      <line x1="16" y1="20" x2="16" y2="16" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <!-- Futuristic Floating Screen -->
      <polygon points="5,5 27,2 27,17 5,20" fill="#080F20" stroke="#38BDF8" stroke-width="1.4"/>
      <!-- Screen 3D Isometric Axes / Grid -->
      <line x1="7" y1="10" x2="25" y2="7" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="7" y1="15" x2="25" y2="12" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="16" y1="4" x2="16" y2="18" stroke="#F59E0B" stroke-width="1"/>
      <!-- Active Quantum Core Node -->
      <circle cx="16" cy="11" r="2.5" fill="#F59E0B" filter="url(#glow)"/>
    </g>

    <!-- Main Heading Text -->
    <text x="58" y="30" fill="#FFFFFF" class="font-title" font-size="27" letter-spacing="0.2">Engineering a New Dimension of Desktop Computing.</text>
  </g>

  <!-- 3. SUBHEADING WITH CREATIVE CODING WORKSTATION ICON -->
  <g transform="translate(52, 142)">
    <!-- Icon Container (36x36 centered at 18, 18) -->
    <circle cx="18" cy="18" r="20" fill="url(#subAura)"/>
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#161E2E" stroke="#F59E0B" stroke-width="1.1"/>
    
    <!-- Creative Coding Vector Glyph: Code Brackets + Core Sparkle -->
    <g transform="translate(4, 4)">
      <!-- Left Bracket -->
      <polyline points="9,7 4,14 9,21" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right Bracket -->
      <polyline points="19,7 24,14 19,21" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Center Creative Sparkle -->
      <path d="M14,8 Q14,14 8,14 Q14,14 14,20 Q14,14 20,14 Q14,14 14,8 Z" fill="#F59E0B"/>
    </g>

    <!-- Subheading Text -->
    <text x="50" y="24" fill="#38BDF8" class="font-sub" font-size="18" letter-spacing="0.1">An interactive digital workstation built with React, JavaScript, and pure CSS creativity.</text>
  </g>

  <!-- Subtle Accent Hairline -->
  <line x1="52" y1="196" x2="1148" y2="196" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- 4. CORE PARAGRAPHS -->
  <g transform="translate(52, 222)">
    <text x="0" y="0" fill="#E2E8F0" class="font-body" font-size="15.5" letter-spacing="0.1">
      <tspan x="0" dy="0">Explore a fully interactive desktop environment featuring functional applications, AI voice assistance, real-time hardware integration,</tspan>
      <tspan x="0" dy="25">multimedia playback, immersive 3D environments, and a custom-built driving game.</tspan>
      <tspan x="0" dy="32" fill="#94A3B8">A hands-on exploration of modern frontend engineering, creative problem-solving, and the possibilities of browser-based computing.</tspan>
    </text>
  </g>

  <!-- 5. TECH STACK LABEL -->
  <text x="52" y="332" fill="#64748B" class="font-mono" font-size="12" font-weight="800" letter-spacing="2">TECH STACK</text>

  <!-- 6. TECH STACK BADGES WITH REAL OFFICIAL BRAND ICONS -->
  <g transform="translate(52, 348)">
    
    <!-- BADGE 1: React.js -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="126" height="38" rx="8" fill="rgba(97, 218, 251, 0.08)" stroke="rgba(97, 218, 251, 0.4)" stroke-width="1"/>
      <!-- Official React Atom -->
      <g transform="translate(18, 19)">
        <ellipse rx="9.5" ry="3.6" fill="none" stroke="#61DAFB" stroke-width="1.1"/>
        <ellipse rx="9.5" ry="3.6" transform="rotate(60)" fill="none" stroke="#61DAFB" stroke-width="1.1"/>
        <ellipse rx="9.5" ry="3.6" transform="rotate(120)" fill="none" stroke="#61DAFB" stroke-width="1.1"/>
        <circle r="2.4" fill="#61DAFB"/>
      </g>
      <text x="36" y="24" fill="#F8FAFC" class="font-sub" font-size="14">React.js</text>
    </g>

    <!-- BADGE 2: JavaScript -->
    <g transform="translate(136, 0)">
      <rect x="0" y="0" width="134" height="38" rx="8" fill="rgba(247, 223, 30, 0.08)" stroke="rgba(247, 223, 30, 0.4)" stroke-width="1"/>
      <!-- Official JS Logo -->
      <g transform="translate(10, 9)">
        <rect x="0" y="0" width="20" height="20" rx="3" fill="#F7DF1E"/>
        <text x="3.5" y="15.5" fill="#000000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10.5" letter-spacing="-0.5">JS</text>
      </g>
      <text x="38" y="24" fill="#F8FAFC" class="font-sub" font-size="14">JavaScript</text>
    </g>

    <!-- BADGE 3: CSS3 -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="102" height="38" rx="8" fill="rgba(38, 77, 228, 0.08)" stroke="rgba(38, 77, 228, 0.4)" stroke-width="1"/>
      <!-- Official CSS3 Shield -->
      <g transform="translate(11, 9)">
        <polygon points="2,0 18,0 16.5,17 10,20 3.5,17" fill="#264DE4"/>
        <polygon points="10,1.5 16.5,1.5 15.2,15.5 10,18" fill="#2965F1"/>
        <text x="6" y="14.5" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">3</text>
      </g>
      <text x="38" y="24" fill="#F8FAFC" class="font-sub" font-size="14">CSS3</text>
    </g>

    <!-- BADGE 4: Gemini API -->
    <g transform="translate(392, 0)">
      <rect x="0" y="0" width="138" height="38" rx="8" fill="rgba(138, 180, 248, 0.08)" stroke="rgba(138, 180, 248, 0.4)" stroke-width="1"/>
      <!-- Official Google Gemini 4-Point Sparkle -->
      <g transform="translate(11, 9)">
        <path d="M10,0 C10,5.5 14.5,10 20,10 C14.5,10 10,14.5 10,20 C10,14.5 5.5,10 0,10 C5.5,10 10,5.5 10,0 Z" fill="url(#geminiGrad)"/>
      </g>
      <text x="38" y="24" fill="#F8FAFC" class="font-sub" font-size="14">Gemini API</text>
    </g>

    <!-- BADGE 5: ElevenLabs API -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="162" height="38" rx="8" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <!-- Official ElevenLabs Iconic Dual Audio Waves -->
      <g transform="translate(12, 10)">
        <rect x="4" y="2" width="3.2" height="15" rx="1.6" fill="#FFFFFF"/>
        <rect x="11" y="2" width="3.2" height="15" rx="1.6" fill="#A855F7"/>
      </g>
      <text x="38" y="24" fill="#F8FAFC" class="font-sub" font-size="14">ElevenLabs API</text>
    </g>

    <!-- BADGE 6: Custom Backend -->
    <g transform="translate(712, 0)">
      <rect x="0" y="0" width="168" height="38" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <!-- Real Server / Microservice Architecture Glyph -->
      <g transform="translate(12, 10)">
        <rect x="1" y="1" width="18" height="7" rx="2" fill="none" stroke="#10B981" stroke-width="1.2"/>
        <circle cx="4" cy="4.5" r="1" fill="#10B981"/>
        <line x1="8" y1="4.5" x2="15" y2="4.5" stroke="#10B981" stroke-width="1" stroke-dasharray="1 1"/>
        <rect x="1" y="10" width="18" height="7" rx="2" fill="none" stroke="#10B981" stroke-width="1.2"/>
        <circle cx="4" cy="13.5" r="1" fill="#10B981"/>
        <line x1="8" y1="13.5" x2="15" y2="13.5" stroke="#10B981" stroke-width="1" stroke-dasharray="1 1"/>
      </g>
      <text x="38" y="24" fill="#F8FAFC" class="font-sub" font-size="14">Custom Backend</text>
    </g>

    <!-- BADGE 7: Browser APIs -->
    <g transform="translate(890, 0)">
      <rect x="0" y="0" width="146" height="38" rx="8" fill="rgba(20, 184, 166, 0.08)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1"/>
      <!-- Browser Window & API Network Glyph -->
      <g transform="translate(11, 9)">
        <rect x="1" y="1" width="18" height="16" rx="3" fill="none" stroke="#14B8A6" stroke-width="1.2"/>
        <line x1="1" y1="6" x2="19" y2="6" stroke="#14B8A6" stroke-width="1"/>
        <circle cx="4" cy="3.5" r="0.8" fill="#EF4444"/>
        <circle cx="7" cy="3.5" r="0.8" fill="#F59E0B"/>
        <circle cx="10" cy="3.5" r="0.8" fill="#10B981"/>
        <!-- Mini Globe Grid inside window -->
        <circle cx="10" cy="11.5" r="3.5" fill="none" stroke="#14B8A6" stroke-width="0.8"/>
        <ellipse cx="10" cy="11.5" rx="1.5" ry="3.5" fill="none" stroke="#14B8A6" stroke-width="0.7"/>
      </g>
      <text x="38" y="24" fill="#F8FAFC" class="font-sub" font-size="14">Browser APIs</text>
    </g>

  </g>

  <!-- 7. TAGS / PILLARS ROW -->
  <g transform="translate(52, 420)">
    <text x="0" y="15" fill="#64748B" class="font-mono" font-size="12" font-weight="600" letter-spacing="0.5">
      <tspan fill="#38BDF8">#ReactJS</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#F59E0B">#JavaScript</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#94A3B8">#FrontendDevelopment</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#94A3B8">#WebEngineering</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#38BDF8">#CreativeCoding</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#60A5FA">#CSS3</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#A855F7">#AIIntegration</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#94A3B8">#WebApplications</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#38BDF8">#3DWebDesign</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#10B981">#InteractiveDesign</tspan>
    </text>
  </g>
</svg>