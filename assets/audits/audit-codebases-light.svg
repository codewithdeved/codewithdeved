<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-label="Open Source Codebase Audit &amp; Architectural Taxonomy (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="innerCardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="346" rx="10" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="38" rx="10" fill="#F1F5F9"/>
  <rect x="1" y="38" width="1198" height="1" fill="#E2E8F0"/>
  
  <circle cx="24" cy="20" r="4" fill="#059669"/>
  <text x="36" y="24" fill="#1D4ED8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ OPEN SOURCE CODEBASE AUDIT &amp; ARCHITECTURAL TAXONOMY</text>
  <text x="1176" y="24" text-anchor="end" fill="#64748B" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" font-weight="600">6 VERIFIED CODEBASES</text>
  <line x1="910" y1="20" x2="970" y2="20" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Row 1: AssistAI -->
  <g transform="translate(16, 48)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#2563EB"/>
    <text x="16" y="26" fill="#1D4ED8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">AssistAI</text>
    <rect x="170" y="12" width="110" height="18" rx="4" fill="#EFF6FF"/>
    <text x="225" y="25" text-anchor="middle" fill="#1D4ED8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">AI INTERFACE</text>
    <text x="300" y="26" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Next-generation web conversational agent interface featuring fluid markdown streaming, token buffering, and session memory.</text>
  </g>

  <!-- Row 2: Course-Management-System -->
  <g transform="translate(16, 96)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#B45309"/>
    <text x="16" y="26" fill="#B45309" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Course-Management-System</text>
    <rect x="235" y="12" width="100" height="18" rx="4" fill="#FEF3C7"/>
    <text x="285" y="25" text-anchor="middle" fill="#B45309" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">DESKTOP CMS</text>
    <text x="350" y="26" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Desktop enterprise education architecture with transactional role enforcement, grading pipelines, and local DB synchronization.</text>
  </g>

  <!-- Row 3: Employee-Information-System-EIS -->
  <g transform="translate(16, 144)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#059669"/>
    <text x="16" y="26" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Employee-Information-System-EIS</text>
    <rect x="280" y="12" width="100" height="18" rx="4" fill="#ECFDF5"/>
    <text x="330" y="25" text-anchor="middle" fill="#059669" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">DATABASE EIS</text>
    <text x="395" y="26" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Relational personnel operations registry featuring immutable audit logging, payroll schema models, and fast search indexing.</text>
  </g>

  <!-- Row 4: Tesla-Cyber-Truck -->
  <g transform="translate(16, 192)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#0284C7"/>
    <text x="16" y="26" fill="#0284C7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Tesla-Cyber-Truck</text>
    <rect x="170" y="12" width="120" height="18" rx="4" fill="#E0F2FE"/>
    <text x="230" y="25" text-anchor="middle" fill="#0284C7" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">3D MODELING</text>
    <text x="305" y="26" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Hardware-accelerated 3D keyframe canvas transformation simulating geometric polygon surfaces with React state orchestration.</text>
  </g>

  <!-- Row 5: Bugatti -->
  <g transform="translate(16, 240)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#D97706"/>
    <text x="16" y="26" fill="#D97706" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Bugatti</text>
    <rect x="120" y="12" width="100" height="18" rx="4" fill="#FEF3C7"/>
    <text x="170" y="25" text-anchor="middle" fill="#D97706" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">CSS3 3D</text>
    <text x="235" y="26" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Pure CSS3 spatial coordinate matrices and compound 3D perspective depth without external 3D libraries.</text>
  </g>

  <!-- Row 6: Harley-Davidson -->
  <g transform="translate(16, 288)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#2563EB"/>
    <text x="16" y="26" fill="#1D4ED8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Harley-Davidson</text>
    <rect x="160" y="12" width="110" height="18" rx="4" fill="#EFF6FF"/>
    <text x="215" y="25" text-anchor="middle" fill="#1D4ED8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">3D MOTION</text>
    <text x="285" y="26" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">Interactive 3D motorcycle kinematics, compound perspective transforms, and keyframe state engine in React.</text>
  </g>
</svg>
