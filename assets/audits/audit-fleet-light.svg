<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Production Fleet Architecture &amp; Pipeline Specs (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerCardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="10" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="38" rx="10" fill="#F1F5F9"/>
  <rect x="1" y="38" width="1198" height="1" fill="#E2E8F0"/>
  
  <circle cx="24" cy="20" r="4" fill="#059669"/>
  <text x="36" y="24" fill="#1D4ED8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ PRODUCTION FLEET ARCHITECTURE &amp; PIPELINE SPECS</text>
  <text x="1176" y="24" text-anchor="end" fill="#64748B" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" font-weight="600">4 PLATFORMS ONLINE • EDGE CACHED</text>
  <line x1="880" y1="20" x2="940" y2="20" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Row 1, Col 1: Creaite Hive -->
  <g transform="translate(16, 52)">
    <rect width="574" height="142" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="574" height="3" rx="1.5" fill="#2563EB"/>
    
    <text x="16" y="26" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Creaite Hive • AI Architectural Suite</text>
    <rect x="420" y="12" width="138" height="18" rx="4" fill="#EFF6FF"/>
    <text x="489" y="25" text-anchor="middle" fill="#1D4ED8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">DIFFUSION BRIDGE</text>
    
    <text x="16" y="54" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#1D4ED8" font-weight="700">• Core Engine: </tspan>Next.js 14 App Router, WebGL Viewport, Diffusion Inference Bridge
    </text>
    <text x="16" y="82" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#1D4ED8" font-weight="700">• Pipeline: </tspan>Sub-80ms prompt synthesis, SVG vectorization, and layered CAD export models
    </text>
    <text x="16" y="110" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#1D4ED8" font-weight="700">• Edge Delivery: </tspan>Global edge caching with low-latency streaming asset delivery across distributed zones
    </text>
  </g>

  <!-- Row 1, Col 2: DocBrio -->
  <g transform="translate(610, 52)">
    <rect width="574" height="142" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="574" height="3" rx="1.5" fill="#059669"/>
    
    <text x="16" y="26" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">DocBrio • Client-Side Document Toolkit</text>
    <rect x="420" y="12" width="138" height="18" rx="4" fill="#ECFDF5"/>
    <text x="489" y="25" text-anchor="middle" fill="#059669" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">WASM SANDBOX</text>
    
    <text x="16" y="54" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#059669" font-weight="700">• Privacy Model: </tspan>100% Client-Side Execution (Zero bytes transmitted to external servers)
    </text>
    <text x="16" y="82" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#059669" font-weight="700">• Wasm Core: </tspan>High-throughput WebAssembly binary compiler for memory-safe PDF manipulation
    </text>
    <text x="16" y="110" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#059669" font-weight="700">• Throughput: </tspan>Multi-threaded in-memory compression with instant local buffer downloads
    </text>
  </g>

  <!-- Row 2, Col 1: Leadster.io -->
  <g transform="translate(16, 204)">
    <rect width="574" height="142" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="574" height="3" rx="1.5" fill="#B45309"/>
    
    <text x="16" y="26" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Leadster.io • Conversational B2B Discovery</text>
    <rect x="420" y="12" width="138" height="18" rx="4" fill="#FEF3C7"/>
    <text x="489" y="25" text-anchor="middle" fill="#B45309" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">SMTP HANDSHAKE</text>
    
    <text x="16" y="54" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#B45309" font-weight="700">• Intelligence Core: </tspan>Conversational intent classification and multi-provider search orchestration
    </text>
    <text x="16" y="82" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#B45309" font-weight="700">• Data Validation: </tspan>Real-time SMTP handshake and domain MX record verification checks
    </text>
    <text x="16" y="110" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#B45309" font-weight="700">• Export Pipeline: </tspan>Dynamic schema mapper for CRM integrations and streamed CSV export
    </text>
  </g>

  <!-- Row 2, Col 2: PakMilkiyat -->
  <g transform="translate(610, 204)">
    <rect width="574" height="142" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="574" height="3" rx="1.5" fill="#0284C7"/>
    
    <text x="16" y="26" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">PakMilkiyat • Spatial PropTech Portal</text>
    <rect x="420" y="12" width="138" height="18" rx="4" fill="#E0F2FE"/>
    <text x="489" y="25" text-anchor="middle" fill="#0284C7" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">GEO-SPATIAL &lt;50MS</text>
    
    <text x="16" y="54" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#0284C7" font-weight="700">• Search Topology: </tspan>Multi-parameter property indexing with sub-50ms geo-spatial query response times
    </text>
    <text x="16" y="82" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#0284C7" font-weight="700">• Interface Engine: </tspan>Dynamic map layer synchronization, faceted price filters, and responsive galleries
    </text>
    <text x="16" y="110" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan fill="#0284C7" font-weight="700">• Security Architecture: </tspan>Encrypted inquiry routing and verified broker authentication protocols
    </text>
  </g>
</svg>
