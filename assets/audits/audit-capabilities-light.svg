<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="System Design Audit &amp; Capability Matrix (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerCardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="10" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="38" rx="10" fill="#F1F5F9"/>
  <rect x="1" y="38" width="1198" height="1" fill="#E2E8F0"/>
  
  <circle cx="24" cy="20" r="4" fill="#059669"/>
  <text x="36" y="24" fill="#1D4ED8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ SYSTEM DESIGN AUDIT &amp; CAPABILITY MATRIX</text>
  <text x="1176" y="24" text-anchor="end" fill="#64748B" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" font-weight="600">4 CLUSTERS EVALUATED</text>
  <line x1="930" y1="20" x2="990" y2="20" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Col 1: Generative AI (w=280) -->
  <g transform="translate(16, 52)">
    <rect width="280" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="3" rx="1.5" fill="#2563EB"/>
    <rect x="14" y="14" width="130" height="18" rx="4" fill="#EFF6FF"/>
    <text x="20" y="27" fill="#1D4ED8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="700">AGENTIC RAG</text>
    <text x="14" y="54" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Generative AI</text>
    <text x="14" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan x="14" dy="0">Autonomous Agent</tspan>
      <tspan x="14" dy="18">orchestration, LangChain &amp;</tspan>
      <tspan x="14" dy="18">LlamaIndex pipelines, prompt</tspan>
      <tspan x="14" dy="18">evaluation benchmarks, and</tspan>
      <tspan x="14" dy="18">vector retrieval architectures.</tspan>
    </text>
  </g>

  <!-- Col 2: Full Stack SaaS (w=280) -->
  <g transform="translate(308, 52)">
    <rect width="280" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="3" rx="1.5" fill="#B45309"/>
    <rect x="14" y="14" width="130" height="18" rx="4" fill="#FEF3C7"/>
    <text x="20" y="27" fill="#B45309" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="700">MULTI-TENANT</text>
    <text x="14" y="54" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Full Stack SaaS</text>
    <text x="14" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan x="14" dy="0">Multi-tenant topologies,</tspan>
      <tspan x="14" dy="18">PostgreSQL and Supabase</tspan>
      <tspan x="14" dy="18">schemas, edge serverless</tspan>
      <tspan x="14" dy="18">handlers, and Redis caching</tspan>
      <tspan x="14" dy="18">in-memory layers.</tspan>
    </text>
  </g>

  <!-- Col 3: Cognitive UX (w=280) -->
  <g transform="translate(600, 52)">
    <rect width="280" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="3" rx="1.5" fill="#059669"/>
    <rect x="14" y="14" width="130" height="18" rx="4" fill="#ECFDF5"/>
    <text x="20" y="27" fill="#059669" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="700">SUB-16MS LOOPS</text>
    <text x="14" y="54" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Cognitive UX</text>
    <text x="14" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan x="14" dy="0">Sub-16ms interaction loops,</tspan>
      <tspan x="14" dy="18">accessibility heuristics, dark</tspan>
      <tspan x="14" dy="18">glassmorphism aesthetics, and</tspan>
      <tspan x="14" dy="18">mathematical typography</tspan>
      <tspan x="14" dy="18">scale systems.</tspan>
    </text>
  </g>

  <!-- Col 4: FinTech Systems (w=280) -->
  <g transform="translate(892, 52)">
    <rect width="292" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="292" height="3" rx="1.5" fill="#0284C7"/>
    <rect x="14" y="14" width="130" height="18" rx="4" fill="#E0F2FE"/>
    <text x="20" y="27" fill="#0284C7" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="700">ZERO-TRUST</text>
    <text x="14" y="54" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">FinTech Systems</text>
    <text x="14" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">
      <tspan x="14" dy="0">Idempotent payment webhooks,</tspan>
      <tspan x="14" dy="18">ledger transaction integrity,</tspan>
      <tspan x="14" dy="18">zero-trust authentication, and</tspan>
      <tspan x="14" dy="18">PCI DSS compliance</tspan>
      <tspan x="14" dy="18">defensive workflows.</tspan>
    </text>
  </g>
</svg>
