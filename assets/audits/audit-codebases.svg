<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Open Source Codebase Audit &amp; Architectural Taxonomy">
  
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E2D4A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="innerCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1329"/>
      <stop offset="100%" stop-color="#060A16"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="38" rx="10" fill="#0A1326"/>
  <rect x="1" y="38" width="1198" height="1" fill="#1B2A47"/>
  
  <circle cx="24" cy="20" r="4" fill="#10B981"/>
  <text x="36" y="24" fill="#38BDF8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ OPEN SOURCE CODEBASE AUDIT &amp; ARCHITECTURAL TAXONOMY</text>
  <text x="1176" y="24" text-anchor="end" fill="#94A3B8" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" font-weight="600">6 VERIFIED CODEBASES</text>
  <line x1="910" y1="20" x2="970" y2="20" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Row 1: AssistAI -->
  <g transform="translate(16, 48)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCard)" stroke="#1B2A47" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#38BDF8"/>
    <text x="16" y="26" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">AssistAI</text>
    <rect x="170" y="12" width="110" height="18" rx="4" fill="#1B2A47"/>
    <text x="225" y="25" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">AI INTERFACE</text>
    <text x="300" y="26" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="12">Next-generation web conversational agent interface featuring fluid markdown streaming, token buffering, and session memory.</text>
  </g>

  <!-- Row 2: Course-Management-System -->
  <g transform="translate(16, 96)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCard)" stroke="#1B2A47" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#C9A45C"/>
    <text x="16" y="26" fill="#C9A45C" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Course-Management-System</text>
    <rect x="235" y="12" width="100" height="18" rx="4" fill="#1B2A47"/>
    <text x="285" y="25" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">DESKTOP CMS</text>
    <text x="350" y="26" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="12">Desktop enterprise education architecture with transactional role enforcement, grading pipelines, and local DB synchronization.</text>
  </g>

  <!-- Row 3: Employee-Information-System-EIS -->
  <g transform="translate(16, 144)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCard)" stroke="#1B2A47" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#10B981"/>
    <text x="16" y="26" fill="#10B981" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Employee-Information-System-EIS</text>
    <rect x="280" y="12" width="100" height="18" rx="4" fill="#1B2A47"/>
    <text x="330" y="25" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">DATABASE EIS</text>
    <text x="395" y="26" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="12">Relational personnel operations registry featuring immutable audit logging, payroll schema models, and fast search indexing.</text>
  </g>

  <!-- Row 4: Tesla-Cyber-Truck -->
  <g transform="translate(16, 192)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCard)" stroke="#1B2A47" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#60A5FA"/>
    <text x="16" y="26" fill="#60A5FA" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Tesla-Cyber-Truck</text>
    <rect x="170" y="12" width="120" height="18" rx="4" fill="#1B2A47"/>
    <text x="230" y="25" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">3D MODELING</text>
    <text x="305" y="26" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="12">Hardware-accelerated 3D keyframe canvas transformation simulating geometric polygon surfaces with React state orchestration.</text>
  </g>

  <!-- Row 5: Bugatti & Harley-Davidson -->
  <g transform="translate(16, 240)">
    <rect width="1168" height="42" rx="6" fill="url(#innerCard)" stroke="#1B2A47" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="42" rx="2" fill="#E2B86E"/>
    <text x="16" y="26" fill="#E2B86E" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Bugatti &amp; Harley-Davidson</text>
    <rect x="220" y="12" width="120" height="18" rx="4" fill="#1B2A47"/>
    <text x="280" y="25" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="600">CSS3 MATRICES</text>
    <text x="355" y="26" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="12">Precision CSS3 spatial coordinate matrices demonstrating pure visual kinetic motion styling without heavy 3D engine overhead.</text>
  </g>
</svg>