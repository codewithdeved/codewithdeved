<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Comprehensive Technology Audit &amp; Runtime Matrix (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerCardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="10" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="38" rx="10" fill="#F1F5F9"/>
  <rect x="1" y="38" width="1198" height="1" fill="#E2E8F0"/>
  
  <circle cx="24" cy="20" r="4" fill="#059669"/>
  <text x="36" y="24" fill="#1D4ED8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ COMPREHENSIVE TECHNOLOGY AUDIT &amp; RUNTIME MATRIX</text>
  <text x="1176" y="24" text-anchor="end" fill="#64748B" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" font-weight="600">24 RUNTIMES VALIDATED</text>
  <line x1="910" y1="20" x2="970" y2="20" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Tier 1: Frontend & UI -->
  <g transform="translate(16, 48)">
    <rect width="1168" height="44" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#2563EB"/>
    <text x="16" y="27" fill="#1D4ED8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Frontend &amp; UI Runtimes</text>
    <text x="220" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12.5">Next.js 14/15 App Router, React 18/19, TypeScript 5, Tailwind CSS, WebGL / Three.js, Canvas API, Responsive Viewports.</text>
  </g>

  <!-- Tier 2: Backend & Cloud -->
  <g transform="translate(16, 100)">
    <rect width="1168" height="44" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#B45309"/>
    <text x="16" y="27" fill="#B45309" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Backend &amp; Cloud Topology</text>
    <text x="220" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12.5">Node.js, Python 3.11+, Fastify, Express, PostgreSQL, Supabase, Redis In-Memory Caching, RESTful &amp; GraphQL APIs.</text>
  </g>

  <!-- Tier 3: AI & Cognitive -->
  <g transform="translate(16, 152)">
    <rect width="1168" height="44" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#059669"/>
    <text x="16" y="27" fill="#059669" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">AI &amp; Cognitive Workflows</text>
    <text x="220" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12.5">Autonomous Agents, LangChain, LlamaIndex, Vector Database Indexing, Prompt Synthesis, Diffusion Model Pipelines.</text>
  </g>

  <!-- Tier 4: DevOps & Infrastructure -->
  <g transform="translate(16, 204)">
    <rect width="1168" height="44" rx="6" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#0284C7"/>
    <text x="16" y="27" fill="#0284C7" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">DevOps &amp; Infrastructure</text>
    <text x="220" y="27" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12.5">Vercel Edge Platform, Docker Containerization, GitHub Actions CI/CD Automation, Linux System Administration, Git VCS.</text>
  </g>
</svg>
