<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Telemetry Data Pipeline &amp; Sync Specifications (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerCardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="10" fill="url(#cardBgLight)" stroke="url(#borderGradLight)" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="38" rx="10" fill="#F1F5F9"/>
  <rect x="1" y="38" width="1198" height="1" fill="#E2E8F0"/>
  
  <circle cx="24" cy="20" r="4" fill="#059669"/>
  <text x="36" y="24" fill="#1D4ED8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ TELEMETRY DATA PIPELINE &amp; SYNC SPECIFICATIONS</text>
  <text x="1176" y="24" text-anchor="end" fill="#64748B" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="11" font-weight="600">CRON 12H • AST VALIDATED</text>
  <line x1="900" y1="20" x2="960" y2="20" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Col 1: Sync Cadence -->
  <g transform="translate(16, 52)">
    <rect width="376" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="376" height="3" rx="1.5" fill="#2563EB"/>
    <rect x="16" y="16" width="140" height="20" rx="4" fill="#EFF6FF"/>
    <text x="24" y="30" fill="#1D4ED8" font-family="'Segoe UI Mono', monospace" font-size="11" font-weight="700">CRON: EVERY 12H</text>
    <text x="16" y="60" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Sync Cadence</text>
    <text x="16" y="86" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12.5">
      <tspan x="16" dy="0">Automated GitHub Actions cron</tspan>
      <tspan x="16" dy="20">schedule triggering every 12 hours</tspan>
      <tspan x="16" dy="20">for continuous edge synchronization</tspan>
      <tspan x="16" dy="20">across repository telemetry.</tspan>
    </text>
  </g>

  <!-- Col 2: Telemetry Verification -->
  <g transform="translate(412, 52)">
    <rect width="376" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="376" height="3" rx="1.5" fill="#059669"/>
    <rect x="16" y="16" width="150" height="20" rx="4" fill="#ECFDF5"/>
    <text x="24" y="30" fill="#059669" font-family="'Segoe UI Mono', monospace" font-size="11" font-weight="700">AST &amp; XML VERIFIED</text>
    <text x="16" y="60" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Telemetry Verification</text>
    <text x="16" y="86" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12.5">
      <tspan x="16" dy="0">Automated AST and XML validation</tspan>
      <tspan x="16" dy="20">ensuring zero syntax errors and</tspan>
      <tspan x="16" dy="20">optimal asset compression</tspan>
      <tspan x="16" dy="20">standards across all viewports.</tspan>
    </text>
  </g>

  <!-- Col 3: Data Source Integrity -->
  <g transform="translate(808, 52)">
    <rect width="376" height="172" rx="8" fill="url(#innerCardLight)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="376" height="3" rx="1.5" fill="#B45309"/>
    <rect x="16" y="16" width="160" height="20" rx="4" fill="#FEF3C7"/>
    <text x="24" y="30" fill="#B45309" font-family="'Segoe UI Mono', monospace" font-size="11" font-weight="700">PUBLIC DATA STREAMS</text>
    <text x="16" y="60" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Data Source Integrity</text>
    <text x="16" y="86" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12.5">
      <tspan x="16" dy="0">Real-time aggregation across public</tspan>
      <tspan x="16" dy="20">repositories, contribution streaks,</tspan>
      <tspan x="16" dy="20">commit activity, and language</tspan>
      <tspan x="16" dy="20">distribution matrices.</tspan>
    </text>
  </g>
</svg>
