<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" role="img" aria-label="Connect on LinkedIn">
  <defs>
    <linearGradient id="bgLi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="100%" stop-color="#0E1B38"/>
    </linearGradient>
    <linearGradient id="inIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <radialGradient id="auraLi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenLi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowLi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-li { animation: pulseAuraLi 3s ease-in-out infinite; transform-origin: 34px 34px; }
    .sheen-bar-li { animation: sheenMoveLi 4s linear infinite; }
    @keyframes pulseAuraLi {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sheenMoveLi {
      0% { transform: translateX(-340px); }
      100% { transform: translateX(340px); }
    }
  </style>

  <!-- Sleek Chassis (No harsh outer border) -->
  <rect x="0" y="0" width="340" height="68" rx="12" fill="url(#bgLi)"/>
  
  <!-- Subtle Top Specular Laser Line -->
  <rect class="sheen-bar-li" x="0" y="0" width="140" height="1.8" fill="url(#sheenLi)"/>

  <!-- LEFT: 3D Holographic LinkedIn Emblem (Compact & Centered at Y=34) -->
  <circle cx="34" cy="34" r="28" fill="url(#auraLi)"/>
  <circle class="pulse-ring-li" cx="34" cy="34" r="22" fill="none" stroke="#38BDF8" stroke-width="1.1" stroke-dasharray="3 3"/>
  
  <rect x="15" y="15" width="38" height="38" rx="9" fill="url(#inIconGrad)" filter="url(#glowLi)"/>
  <path d="M 17 23 A 7 7 0 0 1 24 16 L 44 16 A 7 7 0 0 1 51 23 Z" fill="#FFFFFF" opacity="0.22"/>
  
  <g fill="#FFFFFF" transform="translate(-8, -13)">
    <circle cx="36" cy="39" r="2.2"/>
    <rect x="34" y="43.5" width="4.2" height="16.5" rx="1"/>
    <path d="M41 43.5 h4 v2.2 h0.1 c0.5-1 1.9-2.5 4.3-2.5 4.6 0 5.4 3.1 5.4 7 v9.8 h-4.2 v-8.8 c0-2.1-0.1-4.8-3-4.8 -3 0-3.4 2.3-3.4 4.6 v9 h-4.2 Z"/>
  </g>

  <!-- RIGHT: Vertically Centered Title (Clean, Sleek, Professional) -->
  <text x="68" y="40" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">Connect on LinkedIn</text>
</svg>