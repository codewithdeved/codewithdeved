<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100" role="img" aria-label="Connect on LinkedIn">
  <defs>
    <linearGradient id="bgGradLi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1B"/>
      <stop offset="100%" stop-color="#0C162D"/>
    </linearGradient>
    <linearGradient id="borderGradLi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0A66C2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="inIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <radialGradient id="auraGlowLi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenLi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDropLi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-li { animation: pulseAuraLi 3s ease-in-out infinite; transform-origin: 58px 50px; }
    .sheen-bar-li { animation: sheenMoveLi 4s linear infinite; }
    @keyframes pulseAuraLi {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMoveLi {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="96" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="96" rx="14" fill="url(#bgGradLi)" stroke="url(#borderGradLi)" stroke-width="1.8"/>
  
  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 82" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-li" x="0" y="0" width="160" height="2" fill="url(#sheenLi)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="96"/>
    <line x1="352" y1="0" x2="352" y2="96"/>
    <line x1="0" y1="20" x2="380" y2="20"/>
    <line x1="0" y1="76" x2="380" y2="76"/>
  </g>

  <!-- LEFT: 3D Holographic LinkedIn Emblem (Vertically Centered at Y=50) -->
  <circle cx="58" cy="50" r="38" fill="url(#auraGlowLi)"/>
  <circle class="pulse-ring-li" cx="58" cy="50" r="30" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 4"/>
  
  <!-- 3D Beveled Badge Base -->
  <rect x="33" y="25" width="50" height="50" rx="12" fill="url(#inIconGrad)" stroke="#38BDF8" stroke-width="1.6" filter="url(#glowDropLi)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 35 35 A 10 10 0 0 1 45 26 L 71 26 A 10 10 0 0 1 81 35 Z" fill="#FFFFFF" opacity="0.22"/>
  
  <!-- Official LinkedIn "in" Monogram -->
  <g fill="#FFFFFF" transform="translate(1, -2)">
    <circle cx="45" cy="40" r="2.7"/>
    <rect x="42.5" y="45.5" width="5.2" height="21" rx="1.3"/>
    <path d="M51.5 45.5 h5 v2.8 h0.1 c0.7-1.3 2.4-3.1 5.5-3.1 5.9 0 6.9 3.9 6.9 8.9 v12.4 h-5.3 v-11.2 c0-2.7-0.1-6.1-3.8-6.1 -3.8 0-4.4 2.9-4.4 5.9 v11.4 h-5.3 Z"/>
  </g>

  <!-- RIGHT: Vertically Centered Title (Pure, Bold, Sleek) -->
  <text x="114" y="57" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20.5" font-weight="700" letter-spacing="0.2">Connect on LinkedIn</text>
</svg>