<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Connect on LinkedIn">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1B"/>
      <stop offset="100%" stop-color="#0C162D"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0A66C2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="inIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .card-chassis { transition: transform 0.3s ease; }
    .pulse-ring { animation: pulseAura 3s ease-in-out infinite; transform-origin: 58px 70px; }
    .sheen-bar { animation: sheenMove 4s linear infinite; }
    .live-dot { animation: dotBlink 2s ease-in-out infinite; }
    @keyframes pulseAura {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMove {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Glass Drop Shadow -->
  <rect x="2" y="2" width="376" height="136" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="136" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>
  
  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Sheen Laser Beam -->
  <g clip-path="url(#cardClip)">
    <rect class="sheen-bar" x="0" y="0" width="160" height="2" fill="url(#sheen)"/>
  </g>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="136"/>
    <line x1="352" y1="0" x2="352" y2="136"/>
    <line x1="0" y1="28" x2="380" y2="28"/>
    <line x1="0" y1="108" x2="380" y2="108"/>
  </g>

  <!-- LEFT: 3D Holographic LinkedIn Emblem -->
  <!-- Ambient Colored Radial Glow -->
  <circle cx="58" cy="70" r="44" fill="url(#auraGlow)"/>
  <!-- Pulsing Orbit Ring -->
  <circle class="pulse-ring" cx="58" cy="70" r="34" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 4"/>
  
  <!-- 3D Beveled Badge Base -->
  <rect x="30" y="42" width="56" height="56" rx="14" fill="url(#inIconGrad)" stroke="#38BDF8" stroke-width="1.6" filter="url(#glowDrop)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 33 54 A 11 11 0 0 1 44 43 L 72 43 A 11 11 0 0 1 83 54 Z" fill="#FFFFFF" opacity="0.22"/>
  
  <!-- Official Official LinkedIn "in" Monogram (Clean Vector) -->
  <g fill="#FFFFFF">
    <circle cx="46" cy="54" r="3"/>
    <rect x="43" y="60" width="6" height="24" rx="1.5"/>
    <path d="M53 60 h5.8 v3.2 h0.1 c0.8-1.5 2.7-3.6 6.3-3.6 6.7 0 7.8 4.4 7.8 10.1 v14.3 h-6 v-12.8 c0-3.1-0.1-7-4.3-7 -4.3 0-5 3.3-5 6.8 v13 h-6 Z"/>
  </g>

  <!-- RIGHT: Executive Typography & Details -->
  <!-- Top Category Chip -->
  <g transform="translate(108, 20)">
    <rect x="0" y="0" width="138" height="20" rx="5" fill="#0C1D3B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.9"/>
    <circle class="live-dot" cx="10" cy="10" r="3" fill="#10B981"/>
    <text x="18" y="14" fill="#38BDF8" font-family="'Consolas', monospace" font-size="9.5" font-weight="700" letter-spacing="1">EXECUTIVE NETWORK</text>
  </g>

  <!-- Main Action Title -->
  <text x="108" y="62" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.2">Connect on LinkedIn</text>

  <!-- Direct Handle & Metric -->
  <text x="108" y="82" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600">in/code-with-deved  •  500+ Conn</text>

  <!-- Bottom Interactive Action Pill -->
  <g transform="translate(108, 96)">
    <rect x="0" y="0" width="94" height="24" rx="6" fill="#0A66C2" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="12" y="16" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CONNECT ➔</text>
  </g>
</svg>
