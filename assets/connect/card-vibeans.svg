<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180" role="img" aria-label="Visit Vibeans Solutions Studio">
  <defs>
    <linearGradient id="cardBgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120F08"/>
      <stop offset="100%" stop-color="#060503"/>
    </linearGradient>
    <linearGradient id="borderGoldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C98A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#997028" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="cardPatternGold" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#FFFFFF" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlowGold { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }
    @keyframes beamFlowGold { 0% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 0; } }
    .pulse-glow-gold { animation: pulseGlowGold 3.5s ease-in-out infinite 0.5s; }
    .beam-gold { stroke-dasharray: 4 6; animation: beamFlowGold 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-glow-gold, .beam-gold { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="579" height="179" rx="14" fill="url(#cardBgGold)" stroke="url(#borderGoldGlow)" stroke-width="1.2"/>
  <rect x="1" y="1" width="578" height="178" rx="13" fill="url(#cardPatternGold)"/>

  <!-- Left Icon Area -->
  <circle cx="52" cy="52" r="24" fill="#78350F" fill-opacity="0.4"/>
  <circle class="beam-gold" cx="52" cy="52" r="30" fill="none" stroke="#C9A45C" stroke-width="1" stroke-opacity="0.4"/>
  <text x="52" y="60" text-anchor="middle" font-size="24">🚀</text>

  <!-- Title & Domain -->
  <text x="96" y="46" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">Vibeans Solutions</text>
  <rect x="96" y="56" width="145" height="20" rx="4" fill="#78350F" fill-opacity="0.4"/>
  <text x="104" y="70" fill="#FDE68A" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">vibeanssolutions.site</text>

  <!-- Description (no hyphens) -->
  <text x="32" y="112" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">Digital product studio delivering AI SaaS platforms, enterprise</text>
  <text x="32" y="132" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="13">web applications, and custom client engineering solutions.</text>

  <!-- Action Arrow Button -->
  <rect x="390" y="132" width="166" height="32" rx="6" fill="#854D0E" fill-opacity="0.35" stroke="#C9A45C" stroke-width="1"/>
  <text x="473" y="153" text-anchor="middle" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">VISIT DIGITAL STUDIO ↗</text>
</svg>
