<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100" role="img" aria-label="Connect on Email">
  <defs>
    <linearGradient id="bgGradMail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B1A"/>
      <stop offset="50%" stop-color="#101530"/>
      <stop offset="100%" stop-color="#1B1C40"/>
    </linearGradient>
    <linearGradient id="borderGradMail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mailIconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="auraGlowMail" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenMail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDropMail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-mail { animation: pulseAuraMail 3.1s ease-in-out infinite; transform-origin: 58px 50px; }
    .sheen-bar-mail { animation: sheenMoveMail 4.3s linear infinite; }
    @keyframes pulseAuraMail {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMoveMail {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="96" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="96" rx="14" fill="url(#bgGradMail)" stroke="url(#borderGradMail)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 82" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-mail" x="0" y="0" width="160" height="2" fill="url(#sheenMail)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="96"/>
    <line x1="352" y1="0" x2="352" y2="96"/>
    <line x1="0" y1="20" x2="380" y2="20"/>
    <line x1="0" y1="76" x2="380" y2="76"/>
  </g>

  <!-- LEFT: 3D Holographic Envelope Emblem (Vertically Centered at Y=50) -->
  <circle cx="58" cy="50" r="38" fill="url(#auraGlowMail)"/>
  <circle class="pulse-ring-mail" cx="58" cy="50" r="30" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base with Royal Indigo/Purple Gradient -->
  <rect x="33" y="25" width="50" height="50" rx="12" fill="url(#mailIconGrad)" stroke="#A78BFA" stroke-width="1.5" filter="url(#glowDropMail)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 35 35 A 10 10 0 0 1 45 26 L 71 26 A 10 10 0 0 1 81 35 Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- 3D Precision Mail Envelope Vector -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="38" width="28" height="22" rx="3"/>
    <polyline points="44,39 58,49 72,39"/>
    <line x1="45" y1="58" x2="53" y2="49" stroke-opacity="0.6"/>
    <line x1="71" y1="58" x2="63" y2="49" stroke-opacity="0.6"/>
  </g>
  <circle cx="58" cy="49" r="2.2" fill="#F59E0B"/>

  <!-- RIGHT: Vertically Centered Title (Pure, Bold, Sleek) -->
  <text x="114" y="57" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20.5" font-weight="700" letter-spacing="0.2">Connect on Email</text>
</svg>