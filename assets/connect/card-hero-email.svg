<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 68" width="260" height="68" role="img" aria-label="Connect on Email">
  <defs>
    <linearGradient id="bgMail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0D24"/>
      <stop offset="100%" stop-color="#191738"/>
    </linearGradient>
    <linearGradient id="mailIconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="auraMail" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenMail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowMail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-mail { animation: pulseAuraMail 3.1s ease-in-out infinite; transform-origin: 34px 34px; }
    .sheen-bar-mail { animation: sheenMoveMail 4.3s linear infinite; }
    @keyframes pulseAuraMail {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sheenMoveMail {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(260px); }
    }
  </style>

  <!-- Sleek Chassis (Snug Width) -->
  <rect x="0" y="0" width="260" height="68" rx="12" fill="url(#bgMail)"/>

  <!-- Subtle Top Specular Laser Line -->
  <rect class="sheen-bar-mail" x="0" y="0" width="110" height="1.8" fill="url(#sheenMail)"/>

  <!-- LEFT: 3D Holographic Envelope Emblem (Compact & Centered at Y=34) -->
  <circle cx="34" cy="34" r="26" fill="url(#auraMail)"/>
  <circle class="pulse-ring-mail" cx="34" cy="34" r="21" fill="none" stroke="#F59E0B" stroke-width="1.1" stroke-dasharray="3 3"/>

  <rect x="15" y="15" width="38" height="38" rx="9" fill="url(#mailIconGrad)" filter="url(#glowMail)"/>
  <path d="M 17 23 A 7 7 0 0 1 24 16 L 44 16 A 7 7 0 0 1 51 23 Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- 3D Mail Envelope Vector -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="23" y="24" width="22" height="17" rx="2.5"/>
    <polyline points="23,25 34,33 45,25"/>
    <line x1="24" y1="40" x2="30" y2="33" stroke-opacity="0.6"/>
    <line x1="44" y1="40" x2="38" y2="33" stroke-opacity="0.6"/>
  </g>
  <circle cx="34" cy="33" r="1.8" fill="#F59E0B"/>

  <!-- RIGHT: Vertically Centered Title (Snug, Zero Dead Space) -->
  <text x="64" y="40" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">Connect on Email</text>
</svg>