<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Connect on Email - tayyab@vibeanssolutions.site">
  <defs>
    <linearGradient id="mailBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B1A"/>
      <stop offset="50%" stop-color="#101530"/>
      <stop offset="100%" stop-color="#1B1C40"/>
    </linearGradient>
    <linearGradient id="mailBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mailIconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="mailAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mailSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="mailGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-mail { animation: pulseAuraMail 3.1s ease-in-out infinite; transform-origin: 58px 70px; }
    .sheen-bar-mail { animation: sheenMoveMail 4.3s linear infinite; }
    .live-dot-mail { animation: dotBlinkMail 2s ease-in-out infinite; }
    @keyframes pulseAuraMail {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMoveMail {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
    @keyframes dotBlinkMail {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="136" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="136" rx="14" fill="url(#mailBgGrad)" stroke="url(#mailBorderGrad)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-mail" x="0" y="0" width="160" height="2" fill="url(#mailSheen)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="136"/>
    <line x1="352" y1="0" x2="352" y2="136"/>
    <line x1="0" y1="28" x2="380" y2="28"/>
    <line x1="0" y1="108" x2="380" y2="108"/>
  </g>

  <!-- LEFT: 3D Holographic Envelope Emblem -->
  <circle cx="58" cy="70" r="44" fill="url(#mailAura)"/>
  <circle class="pulse-ring-mail" cx="58" cy="70" r="34" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base with Royal Indigo/Purple Gradient -->
  <rect x="30" y="42" width="56" height="56" rx="14" fill="url(#mailIconGrad)" stroke="#A78BFA" stroke-width="1.5" filter="url(#mailGlow)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 33 54 A 11 11 0 0 1 44 43 L 72 43 A 11 11 0 0 1 83 54 Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- 3D Precision Mail Envelope Vector -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="56" width="32" height="25" rx="3.5"/>
    <polyline points="42,57 58,69 74,57"/>
    <line x1="43" y1="79" x2="52" y2="69" stroke-opacity="0.6"/>
    <line x1="73" y1="79" x2="64" y2="69" stroke-opacity="0.6"/>
  </g>
  <circle cx="58" cy="69" r="2.5" fill="#F59E0B"/>

  <!-- RIGHT: Executive Typography & Details -->
  <!-- Top Category Chip -->
  <g transform="translate(108, 20)">
    <rect x="0" y="0" width="154" height="20" rx="5" fill="#1E1338" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="0.9"/>
    <circle class="live-dot-mail" cx="10" cy="10" r="3" fill="#F59E0B"/>
    <text x="18" y="14" fill="#C4B5FD" font-family="'Consolas', monospace" font-size="9.5" font-weight="700" letter-spacing="1">DIRECT FOUNDER INBOX</text>
  </g>

  <!-- Main Action Title -->
  <text x="108" y="62" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.2">Connect on Email</text>

  <!-- Direct Address & Response SLA -->
  <text x="108" y="82" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600">tayyab@vibeanssolutions.site</text>

  <!-- Bottom Interactive Action Pill -->
  <g transform="translate(108, 96)">
    <rect x="0" y="0" width="104" height="24" rx="6" fill="#7C3AED" fill-opacity="0.25" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="12" y="16" fill="#DDD6FE" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SEND EMAIL ➔</text>
  </g>
</svg>