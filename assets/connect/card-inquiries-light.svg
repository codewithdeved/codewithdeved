<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180" role="img" aria-label="Direct Inquiries and Strategic Advisory (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGoldGlowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlowInqLight { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.95; } }
    @keyframes beamFlowInqLight { 0% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 0; } }
    .pulse-glow-inq-light { animation: pulseGlowInqLight 3.2s ease-in-out infinite 1.5s; }
    .beam-inq-light { stroke-dasharray: 4 6; animation: beamFlowInqLight 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-glow-inq-light, .beam-inq-light { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="579" height="179" rx="14" fill="url(#cardBgLight)" stroke="url(#borderGoldGlowLight)" stroke-width="1.2"/>

  <!-- Left Icon Area -->
  <circle cx="52" cy="52" r="24" fill="#FEF3C7"/>
  <circle class="beam-inq-light" cx="52" cy="52" r="30" fill="none" stroke="#B45309" stroke-width="1" stroke-opacity="0.5"/>
  <text x="52" y="60" text-anchor="middle" font-size="24">✉️</text>

  <!-- Title & Channel -->
  <text x="96" y="46" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">Direct Inquiries</text>
  <rect x="96" y="56" width="160" height="20" rx="4" fill="#FEF3C7"/>
  <text x="104" y="70" fill="#B45309" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">Executive Consulting</text>

  <!-- Description (no hyphens) -->
  <text x="32" y="112" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">High stakes consultations, new venture collaborations, AI SaaS</text>
  <text x="32" y="132" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">product builds, and strategic engineering partnerships.</text>

  <!-- Action Arrow Button -->
  <rect x="390" y="132" width="166" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="473" y="153" text-anchor="middle" fill="#B45309" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">SEND DIRECT MESSAGE -></text>
</svg>
