<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180" role="img" aria-label="Connect on LinkedIn with Tayyab Ali (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderBlueGlowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlowLight { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.95; } }
    @keyframes beamFlowLight { 0% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 0; } }
    .pulse-glow-light { animation: pulseGlowLight 3s ease-in-out infinite; }
    .beam-light { stroke-dasharray: 4 6; animation: beamFlowLight 2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-glow-light, .beam-light { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="579" height="179" rx="14" fill="url(#cardBgLight)" stroke="url(#borderBlueGlowLight)" stroke-width="1.2"/>

  <!-- Left Icon Area -->
  <circle cx="52" cy="52" r="24" fill="#EFF6FF"/>
  <circle class="beam-light" cx="52" cy="52" r="30" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.5"/>
  <text x="52" y="60" text-anchor="middle" font-size="24">💼</text>

  <!-- Title & Handle -->
  <text x="96" y="46" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">LinkedIn Network</text>
  <rect x="96" y="56" width="130" height="20" rx="4" fill="#EFF6FF"/>
  <text x="104" y="70" fill="#1D4ED8" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">code-with-deved</text>

  <!-- Description (no hyphens) -->
  <text x="32" y="112" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">Direct messaging, advisory consultations, executive engineering</text>
  <text x="32" y="132" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">discussions, and professional software industry networking.</text>

  <!-- Action Arrow Button -->
  <rect x="390" y="132" width="166" height="32" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="473" y="153" text-anchor="middle" fill="#1D4ED8" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">CONNECT ON LINKEDIN -></text>
</svg>
