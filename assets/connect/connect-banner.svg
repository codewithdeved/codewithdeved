<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Open for Ventures and Collaboration status header">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#09142A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="bannerBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="30%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C9A45C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .pulse-dot { animation: pulseLive 2s ease-in-out infinite; transform-origin: 36px 32px; }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="63" rx="10" fill="url(#bannerBg)" stroke="url(#bannerBorder)" stroke-width="1.2"/>

  <!-- Left: Live Status -->
  <circle class="pulse-dot" cx="36" cy="32" r="5" fill="#10B981"/>
  <text x="52" y="37" fill="#10B981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">OPEN FOR VENTURES &amp; COLLABORATION</text>

  <!-- Center: Response Metric -->
  <text x="600" y="37" text-anchor="middle" fill="#93C5FD" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1">⚡ TYPICAL RESPONSE: WITHIN 24 HOURS</text>

  <!-- Right: Location & Timezone -->
  <text x="1165" y="37" text-anchor="end" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="12" letter-spacing="1">📍 KARACHI, PAKISTAN (UTC+5) • GLOBAL REMOTE</text>
</svg>
