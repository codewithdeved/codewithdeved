<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Visit our Website - Vibeans Solutions">
  <defs>
    <linearGradient id="webBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1B"/>
      <stop offset="50%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#112238"/>
    </linearGradient>
    <linearGradient id="webBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="webIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="webAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="webSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="webGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-web { animation: pulseAuraWeb 3.2s ease-in-out infinite; transform-origin: 58px 70px; }
    .globe-rot { animation: rotGlobe 9s linear infinite; transform-origin: 58px 70px; }
    .sheen-bar-web { animation: sheenMoveWeb 4.5s linear infinite; }
    .live-dot-web { animation: dotBlinkWeb 2s ease-in-out infinite; }
    @keyframes pulseAuraWeb {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes rotGlobe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sheenMoveWeb {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
    @keyframes dotBlinkWeb {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="136" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="136" rx="14" fill="url(#webBgGrad)" stroke="url(#webBorderGrad)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-web" x="0" y="0" width="160" height="2" fill="url(#webSheen)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#14B8A6" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="136"/>
    <line x1="352" y1="0" x2="352" y2="136"/>
    <line x1="0" y1="28" x2="380" y2="28"/>
    <line x1="0" y1="108" x2="380" y2="108"/>
  </g>

  <!-- LEFT: 3D Holographic Globe & Venture Emblem -->
  <circle cx="58" cy="70" r="44" fill="url(#webAura)"/>
  <circle class="pulse-ring-web" cx="58" cy="70" r="34" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base -->
  <rect x="30" y="42" width="56" height="56" rx="14" fill="url(#webIconGrad)" stroke="#14B8A6" stroke-width="1.6" filter="url(#webGlow)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 33 54 A 11 11 0 0 1 44 43 L 72 43 A 11 11 0 0 1 83 54 Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- 3D Globe Vector with Lat/Long Meshing -->
  <g class="globe-rot" stroke="#F8FAFC" stroke-width="1.4" fill="none">
    <circle cx="58" cy="70" r="16" stroke="#38BDF8" stroke-width="1.6"/>
    <ellipse cx="58" cy="70" rx="7.5" ry="16" stroke="#5EEAD4" stroke-width="1.2"/>
    <line x1="42" y1="70" x2="74" y2="70" stroke="#F59E0B" stroke-width="1.3"/>
    <ellipse cx="58" cy="70" rx="16" ry="6.5" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
  <circle cx="58" cy="70" r="2.5" fill="#F8FAFC"/>

  <!-- RIGHT: Executive Typography & Details -->
  <!-- Top Category Chip -->
  <g transform="translate(108, 20)">
    <rect x="0" y="0" width="132" height="20" rx="5" fill="#0C2522" stroke="#14B8A6" stroke-opacity="0.5" stroke-width="0.9"/>
    <circle class="live-dot-web" cx="10" cy="10" r="3" fill="#F59E0B"/>
    <text x="18" y="14" fill="#5EEAD4" font-family="'Consolas', monospace" font-size="9.5" font-weight="700" letter-spacing="1">VENTURE STUDIO</text>
  </g>

  <!-- Main Action Title -->
  <text x="108" y="62" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.2">Visit our Website</text>

  <!-- Direct Domain & Position -->
  <text x="108" y="82" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600">vibeanssolutions.site  •  Founder &amp; CEO</text>

  <!-- Bottom Interactive Action Pill -->
  <g transform="translate(108, 96)">
    <rect x="0" y="0" width="92" height="24" rx="6" fill="#0D9488" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="12" y="16" fill="#FDE047" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EXPLORE ➔</text>
  </g>
</svg>