<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" role="img" aria-label="Visit our Website">
  <defs>
    <linearGradient id="bgWeb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="100%" stop-color="#0B2028"/>
    </linearGradient>
    <linearGradient id="webIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="auraWeb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenWeb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-web { animation: pulseAuraWeb 3.2s ease-in-out infinite; transform-origin: 34px 34px; }
    .globe-rot { animation: rotGlobe 9s linear infinite; transform-origin: 34px 34px; }
    .sheen-bar-web { animation: sheenMoveWeb 4.5s linear infinite; }
    @keyframes pulseAuraWeb {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes rotGlobe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sheenMoveWeb {
      0% { transform: translateX(-340px); }
      100% { transform: translateX(340px); }
    }
  </style>

  <!-- Sleek Chassis (No harsh outer border) -->
  <rect x="0" y="0" width="340" height="68" rx="12" fill="url(#bgWeb)"/>

  <!-- Subtle Top Specular Laser Line -->
  <rect class="sheen-bar-web" x="0" y="0" width="140" height="1.8" fill="url(#sheenWeb)"/>

  <!-- LEFT: 3D Holographic Globe Emblem (Compact & Centered at Y=34) -->
  <circle cx="34" cy="34" r="28" fill="url(#auraWeb)"/>
  <circle class="pulse-ring-web" cx="34" cy="34" r="22" fill="none" stroke="#F59E0B" stroke-width="1.1" stroke-dasharray="3 3"/>

  <rect x="15" y="15" width="38" height="38" rx="9" fill="url(#webIconGrad)" filter="url(#glowWeb)"/>
  <path d="M 17 23 A 7 7 0 0 1 24 16 L 44 16 A 7 7 0 0 1 51 23 Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- 3D Globe Vector -->
  <g class="globe-rot" stroke="#F8FAFC" stroke-width="1.1" fill="none">
    <circle cx="34" cy="34" r="11" stroke="#38BDF8" stroke-width="1.3"/>
    <ellipse cx="34" cy="34" rx="5" ry="11" stroke="#5EEAD4" stroke-width="0.9"/>
    <line x1="23" y1="34" x2="45" y2="34" stroke="#F59E0B" stroke-width="1"/>
    <ellipse cx="34" cy="34" rx="11" ry="4.5" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  </g>
  <circle cx="34" cy="34" r="1.8" fill="#F8FAFC"/>

  <!-- RIGHT: Vertically Centered Title (Clean, Sleek, Professional) -->
  <text x="68" y="40" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">Visit our Website</text>
</svg>