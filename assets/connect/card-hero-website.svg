<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100" role="img" aria-label="Visit our Website">
  <defs>
    <linearGradient id="bgGradWeb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1B"/>
      <stop offset="50%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#112238"/>
    </linearGradient>
    <linearGradient id="borderGradWeb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="webIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="auraGlowWeb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenWeb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDropWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-web { animation: pulseAuraWeb 3.2s ease-in-out infinite; transform-origin: 58px 50px; }
    .globe-rot { animation: rotGlobe 9s linear infinite; transform-origin: 58px 50px; }
    .sheen-bar-web { animation: sheenMoveWeb 4.5s linear infinite; }
    @keyframes pulseAuraWeb {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes rotGlobe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sheenMoveWeb {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="96" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="96" rx="14" fill="url(#bgGradWeb)" stroke="url(#borderGradWeb)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 82" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-web" x="0" y="0" width="160" height="2" fill="url(#sheenWeb)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#14B8A6" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="96"/>
    <line x1="352" y1="0" x2="352" y2="96"/>
    <line x1="0" y1="20" x2="380" y2="20"/>
    <line x1="0" y1="76" x2="380" y2="76"/>
  </g>

  <!-- LEFT: 3D Holographic Globe Emblem (Vertically Centered at Y=50) -->
  <circle cx="58" cy="50" r="38" fill="url(#auraGlowWeb)"/>
  <circle class="pulse-ring-web" cx="58" cy="50" r="30" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base -->
  <rect x="33" y="25" width="50" height="50" rx="12" fill="url(#webIconGrad)" stroke="#14B8A6" stroke-width="1.6" filter="url(#glowDropWeb)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 35 35 A 10 10 0 0 1 45 26 L 71 26 A 10 10 0 0 1 81 35 Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- 3D Globe Vector with Lat/Long Meshing -->
  <g class="globe-rot" stroke="#F8FAFC" stroke-width="1.3" fill="none">
    <circle cx="58" cy="50" r="14" stroke="#38BDF8" stroke-width="1.5"/>
    <ellipse cx="58" cy="50" rx="6.5" ry="14" stroke="#5EEAD4" stroke-width="1.1"/>
    <line x1="44" y1="50" x2="72" y2="50" stroke="#F59E0B" stroke-width="1.2"/>
    <ellipse cx="58" cy="50" rx="14" ry="5.5" stroke="#F59E0B" stroke-width="0.9" stroke-dasharray="2 2"/>
  </g>
  <circle cx="58" cy="50" r="2.2" fill="#F8FAFC"/>

  <!-- RIGHT: Vertically Centered Title (Pure, Bold, Sleek) -->
  <text x="114" y="57" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20.5" font-weight="700" letter-spacing="0.2">Visit our Website</text>
</svg>