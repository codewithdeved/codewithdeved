<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Connect on WhatsApp - +92 336 3125 494">
  <defs>
    <linearGradient id="waBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06120D"/>
      <stop offset="50%" stop-color="#0B1E16"/>
      <stop offset="100%" stop-color="#112C20"/>
    </linearGradient>
    <linearGradient id="waBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#128C7E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="waIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="60%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <radialGradient id="waAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="waGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-wa { animation: pulseAuraWa 2.9s ease-in-out infinite; transform-origin: 58px 70px; }
    .sheen-bar-wa { animation: sheenMoveWa 4.1s linear infinite; }
    .live-dot-wa { animation: dotBlinkWa 2s ease-in-out infinite; }
    @keyframes pulseAuraWa {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMoveWa {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
    @keyframes dotBlinkWa {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="136" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="136" rx="14" fill="url(#waBgGrad)" stroke="url(#waBorderGrad)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-wa" x="0" y="0" width="160" height="2" fill="url(#waSheen)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#25D366" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="136"/>
    <line x1="352" y1="0" x2="352" y2="136"/>
    <line x1="0" y1="28" x2="380" y2="28"/>
    <line x1="0" y1="108" x2="380" y2="108"/>
  </g>

  <!-- LEFT: 3D Holographic WhatsApp Emblem -->
  <circle cx="58" cy="70" r="44" fill="url(#waAura)"/>
  <circle class="pulse-ring-wa" cx="58" cy="70" r="34" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base with Emerald Gradient -->
  <rect x="30" y="42" width="56" height="56" rx="15" fill="url(#waIconGrad)" stroke="#6EE7B7" stroke-width="1.5" filter="url(#waGlow)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 33 54 A 12 12 0 0 1 44 43 L 72 43 A 12 12 0 0 1 83 54 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- Official WhatsApp Vector Bubble & Handset -->
  <g fill="#FFFFFF" transform="translate(42, 54)">
    <path d="M 16 0 C 7.2 0 0 7.2 0 16 C 0 19.1 0.9 22 2.4 24.5 L 0.8 30.5 L 7 28.9 C 9.6 30.7 12.7 31.8 16 31.8 C 24.8 31.8 32 24.6 32 15.8 C 32 7 24.8 0 16 0 Z M 23.4 22.3 C 23.1 23.2 21.9 24.1 20.9 24.3 C 20.2 24.4 19.3 24.5 16.3 23.3 C 12.5 21.7 10 17.8 9.8 17.5 C 9.6 17.3 8.3 15.5 8.3 13.7 C 8.3 11.9 9.2 11 9.6 10.6 C 9.9 10.2 10.4 10.1 10.8 10.1 C 11 10.1 11.1 10.1 11.2 10.1 C 11.6 10.1 11.8 10.2 12 10.6 C 12.3 11.3 13 13.1 13.1 13.3 C 13.2 13.6 13.2 13.8 13 14.1 C 12.9 14.3 12.8 14.5 12.6 14.7 C 12.4 14.9 12.2 15.2 12.4 15.6 C 12.6 16 13.3 17.1 14.4 18 C 15.8 19.2 16.9 19.6 17.3 19.8 C 17.6 19.9 17.9 19.9 18.1 19.6 C 18.4 19.3 18.9 18.6 19.2 18.2 C 19.4 17.9 19.7 18 20 18.1 C 20.3 18.2 22.1 19.1 22.4 19.3 C 22.8 19.5 23 19.6 23.1 19.8 C 23.2 20.1 23.2 21.5 23.4 22.3 Z"/>
  </g>

  <!-- RIGHT: Executive Typography & Details -->
  <!-- Top Category Chip -->
  <g transform="translate(108, 20)">
    <rect x="0" y="0" width="160" height="20" rx="5" fill="#0E281C" stroke="#25D366" stroke-opacity="0.5" stroke-width="0.9"/>
    <circle class="live-dot-wa" cx="10" cy="10" r="3" fill="#25D366"/>
    <text x="18" y="14" fill="#6EE7B7" font-family="'Consolas', monospace" font-size="9.5" font-weight="700" letter-spacing="1">DIRECT ENCRYPTED CHAT</text>
  </g>

  <!-- Main Action Title -->
  <text x="108" y="62" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.2">Connect on WhatsApp</text>

  <!-- Direct Number & Availability -->
  <text x="108" y="82" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600">+92 336 3125 494  •  Instant Priority</text>

  <!-- Bottom Interactive Action Pill -->
  <g transform="translate(108, 96)">
    <rect x="0" y="0" width="102" height="24" rx="6" fill="#128C7E" fill-opacity="0.25" stroke="#25D366" stroke-width="1.2"/>
    <text x="14" y="16" fill="#A7F3D0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">MESSAGE ➔</text>
  </g>
</svg>