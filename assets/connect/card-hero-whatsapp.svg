<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" role="img" aria-label="Connect on WhatsApp">
  <defs>
    <linearGradient id="bgWa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08150F"/>
      <stop offset="100%" stop-color="#0F241A"/>
    </linearGradient>
    <linearGradient id="waIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="60%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <radialGradient id="auraWa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenWa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowWa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-wa { animation: pulseAuraWa 2.9s ease-in-out infinite; transform-origin: 34px 34px; }
    .sheen-bar-wa { animation: sheenMoveWa 4.1s linear infinite; }
    @keyframes pulseAuraWa {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sheenMoveWa {
      0% { transform: translateX(-340px); }
      100% { transform: translateX(340px); }
    }
  </style>

  <!-- Sleek Chassis (No harsh outer border) -->
  <rect x="0" y="0" width="340" height="68" rx="12" fill="url(#bgWa)"/>

  <!-- Subtle Top Specular Laser Line -->
  <rect class="sheen-bar-wa" x="0" y="0" width="140" height="1.8" fill="url(#sheenWa)"/>

  <!-- LEFT: 3D Holographic WhatsApp Emblem (Compact & Centered at Y=34) -->
  <circle cx="34" cy="34" r="28" fill="url(#auraWa)"/>
  <circle class="pulse-ring-wa" cx="34" cy="34" r="22" fill="none" stroke="#34D399" stroke-width="1.1" stroke-dasharray="3 3"/>

  <rect x="15" y="15" width="38" height="38" rx="10" fill="url(#waIconGrad)" filter="url(#glowWa)"/>
  <path d="M 17 23 A 7 7 0 0 1 24 16 L 44 16 A 7 7 0 0 1 51 23 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- Official WhatsApp Vector Glyph -->
  <g fill="#FFFFFF" transform="translate(23.5, 23.5) scale(0.66)">
    <path d="M 16 0 C 7.2 0 0 7.2 0 16 C 0 19.1 0.9 22 2.4 24.5 L 0.8 30.5 L 7 28.9 C 9.6 30.7 12.7 31.8 16 31.8 C 24.8 31.8 32 24.6 32 15.8 C 32 7 24.8 0 16 0 Z M 23.4 22.3 C 23.1 23.2 21.9 24.1 20.9 24.3 C 20.2 24.4 19.3 24.5 16.3 23.3 C 12.5 21.7 10 17.8 9.8 17.5 C 9.6 17.3 8.3 15.5 8.3 13.7 C 8.3 11.9 9.2 11 9.6 10.6 C 9.9 10.2 10.4 10.1 10.8 10.1 C 11 10.1 11.1 10.1 11.2 10.1 C 11.6 10.1 11.8 10.2 12 10.6 C 12.3 11.3 13 13.1 13.1 13.3 C 13.2 13.6 13.2 13.8 13 14.1 C 12.9 14.3 12.8 14.5 12.6 14.7 C 12.4 14.9 12.2 15.2 12.4 15.6 C 12.6 16 13.3 17.1 14.4 18 C 15.8 19.2 16.9 19.6 17.3 19.8 C 17.6 19.9 17.9 19.9 18.1 19.6 C 18.4 19.3 18.9 18.6 19.2 18.2 C 19.4 17.9 19.7 18 20 18.1 C 20.3 18.2 22.1 19.1 22.4 19.3 C 22.8 19.5 23 19.6 23.1 19.8 C 23.2 20.1 23.2 21.5 23.4 22.3 Z"/>
  </g>

  <!-- RIGHT: Vertically Centered Title (Clean, Sleek, Professional) -->
  <text x="68" y="40" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">Connect on WhatsApp</text>
</svg>