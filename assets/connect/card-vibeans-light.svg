<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="580" height="180" role="img" aria-label="Visit Vibeans Solutions Studio (Light Mode)">
  <defs>
    <linearGradient id="cardBgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="borderGoldGlowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlowGoldLight { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.95; } }
    @keyframes beamFlowGoldLight { 0% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 0; } }
    .pulse-glow-gold-light { animation: pulseGlowGoldLight 3.5s ease-in-out infinite 0.5s; }
    .beam-gold-light { stroke-dasharray: 4 6; animation: beamFlowGoldLight 2.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse-glow-gold-light, .beam-gold-light { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="579" height="179" rx="14" fill="url(#cardBgLight)" stroke="url(#borderGoldGlowLight)" stroke-width="1.2"/>

  <!-- Left Icon Area -->
  <circle cx="52" cy="52" r="24" fill="#FEF3C7"/>
  <circle class="beam-gold-light" cx="52" cy="52" r="30" fill="none" stroke="#B45309" stroke-width="1" stroke-opacity="0.5"/>
  <text x="52" y="60" text-anchor="middle" font-size="24">🚀</text>

  <!-- Title & Domain -->
  <text x="96" y="46" fill="#0F172A" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">Vibeans Solutions</text>
  <rect x="96" y="56" width="145" height="20" rx="4" fill="#FEF3C7"/>
  <text x="104" y="70" fill="#B45309" font-family="'Segoe UI', monospace" font-size="11" font-weight="600">vibeanssolutions.site</text>

  <!-- Description (no hyphens) -->
  <text x="32" y="112" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">Digital product studio delivering AI SaaS platforms, enterprise</text>
  <text x="32" y="132" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">web applications, and custom client engineering solutions.</text>

  <!-- Action Arrow Button -->
  <rect x="390" y="132" width="166" height="32" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="473" y="153" text-anchor="middle" fill="#B45309" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">VISIT DIGITAL STUDIO -></text>
</svg>
