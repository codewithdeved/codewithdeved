<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100" role="img" aria-label="Connect on Instagram">
  <defs>
    <linearGradient id="bgGradIg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0815"/>
      <stop offset="50%" stop-color="#140E24"/>
      <stop offset="100%" stop-color="#21102C"/>
    </linearGradient>
    <linearGradient id="borderGradIg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FD1D1D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F77737" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="igIconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#405DE6"/>
      <stop offset="25%" stop-color="#5851DB"/>
      <stop offset="50%" stop-color="#833AB4"/>
      <stop offset="75%" stop-color="#C13584"/>
      <stop offset="85%" stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#FD1D1D"/>
    </linearGradient>
    <radialGradient id="auraGlowIg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#833AB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenIg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FD1D1D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F77737" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDropIg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-ig { animation: pulseAuraIg 3s ease-in-out infinite; transform-origin: 58px 50px; }
    .sheen-bar-ig { animation: sheenMoveIg 4.2s linear infinite; }
    @keyframes pulseAuraIg {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMoveIg {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="96" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="96" rx="14" fill="url(#bgGradIg)" stroke="url(#borderGradIg)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 82" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-ig" x="0" y="0" width="160" height="2" fill="url(#sheenIg)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#E1306C" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="96"/>
    <line x1="352" y1="0" x2="352" y2="96"/>
    <line x1="0" y1="20" x2="380" y2="20"/>
    <line x1="0" y1="76" x2="380" y2="76"/>
  </g>

  <!-- LEFT: 3D Holographic Instagram Emblem (Vertically Centered at Y=50) -->
  <circle cx="58" cy="50" r="38" fill="url(#auraGlowIg)"/>
  <circle class="pulse-ring-ig" cx="58" cy="50" r="30" fill="none" stroke="#FD1D1D" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base with Rich Sunset Gradient -->
  <rect x="33" y="25" width="50" height="50" rx="13" fill="url(#igIconGrad)" stroke="#FFDC80" stroke-width="1.4" filter="url(#glowDropIg)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 35 35 A 11 11 0 0 1 45 26 L 71 26 A 11 11 0 0 1 81 35 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- Precision Instagram Vector Glyph -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="36" width="28" height="28" rx="8"/>
    <circle cx="58" cy="50" r="6.5"/>
    <circle cx="66" cy="42" r="1.1" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- RIGHT: Vertically Centered Title (Pure, Bold, Sleek) -->
  <text x="114" y="57" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20.5" font-weight="700" letter-spacing="0.2">Connect on Instagram</text>
</svg>