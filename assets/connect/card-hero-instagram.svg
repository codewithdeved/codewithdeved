<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="380" height="140" role="img" aria-label="Connect on Instagram - @codewithdeved">
  <defs>
    <linearGradient id="igBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0815"/>
      <stop offset="50%" stop-color="#140E24"/>
      <stop offset="100%" stop-color="#21102C"/>
    </linearGradient>
    <linearGradient id="igBorderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FD1D1D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F77737" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="igIconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#405DE6"/>
      <stop offset="25%" stop-color="#5851DB"/>
      <stop offset="50%" stop-color="#833AB4"/>
      <stop offset="75%" stop-color="#C13584"/>
      <stop offset="85%" stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#FD1D1D"/>
    </linearGradient>
    <radialGradient id="igAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#833AB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="igSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FD1D1D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F77737" stop-opacity="0"/>
    </linearGradient>
    <filter id="igGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-ig { animation: pulseAuraIg 3s ease-in-out infinite; transform-origin: 58px 70px; }
    .sheen-bar-ig { animation: sheenMoveIg 4.2s linear infinite; }
    .live-dot-ig { animation: dotBlinkIg 2s ease-in-out infinite; }
    @keyframes pulseAuraIg {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes sheenMoveIg {
      0% { transform: translateX(-380px); }
      100% { transform: translateX(380px); }
    }
    @keyframes dotBlinkIg {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>

  <!-- 3D Card Chassis with Beveled Drop Shadow -->
  <rect x="2" y="2" width="376" height="136" rx="14" fill="#000000" opacity="0.5"/>
  <rect x="0" y="0" width="380" height="136" rx="14" fill="url(#igBgGrad)" stroke="url(#igBorderGrad)" stroke-width="1.8"/>

  <!-- 3D Specular Highlight Inner Chamfer -->
  <path d="M 14 1 L 366 1 A 13 13 0 0 1 379 14 L 379 122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Top Laser Sheen -->
  <rect class="sheen-bar-ig" x="0" y="0" width="160" height="2" fill="url(#igSheen)"/>

  <!-- 3D Isometric Cyber Grid Accents -->
  <g stroke="#E1306C" stroke-opacity="0.08" stroke-width="1">
    <line x1="28" y1="0" x2="28" y2="136"/>
    <line x1="352" y1="0" x2="352" y2="136"/>
    <line x1="0" y1="28" x2="380" y2="28"/>
    <line x1="0" y1="108" x2="380" y2="108"/>
  </g>

  <!-- LEFT: 3D Holographic Instagram Camera Emblem -->
  <circle cx="58" cy="70" r="44" fill="url(#igAura)"/>
  <circle class="pulse-ring-ig" cx="58" cy="70" r="34" fill="none" stroke="#FD1D1D" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- 3D Beveled Badge Base with Rich Sunset Gradient -->
  <rect x="30" y="42" width="56" height="56" rx="15" fill="url(#igIconGrad)" stroke="#FFDC80" stroke-width="1.4" filter="url(#igGlow)"/>
  <!-- Specular 3D Glint on Badge Top -->
  <path d="M 33 54 A 12 12 0 0 1 44 43 L 72 43 A 12 12 0 0 1 83 54 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- Precision Instagram Vector Glyph -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera Body Outline -->
    <rect x="42" y="54" width="32" height="32" rx="9"/>
    <!-- Center Lens -->
    <circle cx="58" cy="70" r="7.5"/>
    <!-- Flash Aperture Dot -->
    <circle cx="67" cy="61" r="1.3" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- RIGHT: Executive Typography & Details -->
  <!-- Top Category Chip -->
  <g transform="translate(108, 20)">
    <rect x="0" y="0" width="144" height="20" rx="5" fill="#240D26" stroke="#E1306C" stroke-opacity="0.5" stroke-width="0.9"/>
    <circle class="live-dot-ig" cx="10" cy="10" r="3" fill="#E1306C"/>
    <text x="18" y="14" fill="#F472B6" font-family="'Consolas', monospace" font-size="9.5" font-weight="700" letter-spacing="1">CREATIVE DISPATCH</text>
  </g>

  <!-- Main Action Title -->
  <text x="108" y="62" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="0.2">Connect on Instagram</text>

  <!-- Direct Handle & Media Info -->
  <text x="108" y="82" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600">@codewithdeved  •  Tech &amp; Creative Media</text>

  <!-- Bottom Interactive Action Pill -->
  <g transform="translate(108, 96)">
    <rect x="0" y="0" width="90" height="24" rx="6" fill="#E1306C" fill-opacity="0.25" stroke="#FD1D1D" stroke-width="1.2"/>
    <text x="14" y="16" fill="#FCA5A5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">FOLLOW ➔</text>
  </g>
</svg>