<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" role="img" aria-label="Connect on Instagram">
  <defs>
    <linearGradient id="bgIg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120A1A"/>
      <stop offset="100%" stop-color="#1F0E2A"/>
    </linearGradient>
    <linearGradient id="igIconGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#405DE6"/>
      <stop offset="30%" stop-color="#833AB4"/>
      <stop offset="70%" stop-color="#C13584"/>
      <stop offset="100%" stop-color="#FD1D1D"/>
    </linearGradient>
    <radialGradient id="auraIg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E1306C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenIg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FD1D1D" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F77737" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowIg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pulse-ring-ig { animation: pulseAuraIg 3s ease-in-out infinite; transform-origin: 34px 34px; }
    .sheen-bar-ig { animation: sheenMoveIg 4.2s linear infinite; }
    @keyframes pulseAuraIg {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sheenMoveIg {
      0% { transform: translateX(-340px); }
      100% { transform: translateX(340px); }
    }
  </style>

  <!-- Sleek Chassis (No harsh outer border) -->
  <rect x="0" y="0" width="340" height="68" rx="12" fill="url(#bgIg)"/>

  <!-- Subtle Top Specular Laser Line -->
  <rect class="sheen-bar-ig" x="0" y="0" width="140" height="1.8" fill="url(#sheenIg)"/>

  <!-- LEFT: 3D Holographic Instagram Emblem (Compact & Centered at Y=34) -->
  <circle cx="34" cy="34" r="28" fill="url(#auraIg)"/>
  <circle class="pulse-ring-ig" cx="34" cy="34" r="22" fill="none" stroke="#FD1D1D" stroke-width="1.1" stroke-dasharray="3 3"/>

  <rect x="15" y="15" width="38" height="38" rx="10" fill="url(#igIconGrad)" filter="url(#glowIg)"/>
  <path d="M 17 23 A 7 7 0 0 1 24 16 L 44 16 A 7 7 0 0 1 51 23 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- Official Camera Glyph -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="23" y="23" width="22" height="22" rx="6"/>
    <circle cx="34" cy="34" r="5.2"/>
    <circle cx="40.5" cy="27.5" r="0.9" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- RIGHT: Vertically Centered Title (Clean, Sleek, Professional) -->
  <text x="68" y="40" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2">Connect on Instagram</text>
</svg>