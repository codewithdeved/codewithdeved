<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Circular Telemetry Gauges">
  <defs>
    <linearGradient id="gaugeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="gaugeBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sweepRadarLine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseDialBeacon {
      0%, 100% { opacity: 0.6; r: 3; }
      50% { opacity: 1; r: 4.5; filter: drop-shadow(0 0 5px #10B981); }
    }
    @keyframes topGlintMove {
      0% { transform: translateX(-400px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    .orbit-cw-1 { animation: spinClockwise 12s linear infinite; transform-origin: 200px 125px; }
    .orbit-ccw-2 { animation: spinCounterClockwise 15s linear infinite; transform-origin: 600px 125px; }
    .orbit-cw-3 { animation: spinClockwise 14s linear infinite; transform-origin: 1000px 125px; }
    .radar-sweep { animation: sweepRadarLine 4s linear infinite; transform-origin: 600px 125px; }
    .dial-beacon { animation: pulseDialBeacon 2s ease-in-out infinite; }
    .glint-track { animation: topGlintMove 5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .orbit-cw-1, .orbit-ccw-2, .orbit-cw-3, .radar-sweep, .dial-beacon, .glint-track { animation: none; }
    }
  </style>

  <!-- Outer Glass Chassis -->
  <rect x="2" y="2" width="1196" height="226" rx="8" fill="url(#gaugeBg)" stroke="#1E293B" stroke-width="1.2"/>
  
  <!-- Top Laser Glint -->
  <g class="glint-track">
    <line x1="0" y1="2" x2="300" y2="2" stroke="url(#gaugeBeam)" stroke-width="2"/>
  </g>

  <!-- Top Title Ribbon -->
  <circle cx="28" cy="22" r="3.5" fill="#10B981" class="dial-beacon"/>
  <text x="40" y="25" fill="#38BDF8" font-family="'Consolas', monospace" font-size="10" font-weight="700">QUANTITATIVE SYSTEM TELEMETRY • LIVE RUNTIME BENCHMARKS</text>
  <text x="1170" y="25" text-anchor="end" fill="#C9A45C" font-family="'Consolas', monospace" font-size="9.5" font-weight="700">AUTOMATED REAL-TIME HARVEST</text>
  <line x1="24" y1="34" x2="1176" y2="34" stroke="#1E293B" stroke-width="0.8"/>

  <!-- ================= GAUGE 1: 99.98% SYSTEM UPTIME ================= -->
  <!-- Center: (200, 125) -->
  <g>
    <!-- Background Circle Track -->
    <circle cx="200" cy="125" r="54" fill="#070E20" stroke="#162238" stroke-width="7"/>
    <!-- Animated Outer Dash Ring -->
    <circle cx="200" cy="125" r="66" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4,8" class="orbit-cw-1" stroke-opacity="0.8"/>
    <!-- Progress Arc: ~99.98% of 339 circumference -->
    <circle cx="200" cy="125" r="54" fill="none" stroke="#38BDF8" stroke-width="7" stroke-dasharray="339" stroke-dashoffset="4" stroke-linecap="round" transform="rotate(-90 200 125)"/>
    <!-- Inner Texts -->
    <text x="200" y="122" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700">99.98%</text>
    <text x="200" y="137" text-anchor="middle" fill="#94A3B8" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">UPTIME</text>
    <!-- Subtitle and Badge -->
    <text x="200" y="196" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700">FLEET AVAILABILITY</text>
    <rect x="150" y="204" width="100" height="16" rx="3" fill="#0B1426" stroke="#10B981" stroke-width="0.8"/>
    <text x="200" y="215" text-anchor="middle" fill="#10B981" font-family="'Consolas', monospace" font-size="8" font-weight="700">● MULTI-REGION LIVE</text>
  </g>

  <!-- Separator 1 -->
  <line x1="390" y1="55" x2="390" y2="210" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2,4"/>

  <!-- ================= GAUGE 2: < 38ms EDGE LATENCY ================= -->
  <!-- Center: (600, 125) -->
  <g>
    <!-- Background Circle Track -->
    <circle cx="600" cy="125" r="54" fill="#070E20" stroke="#162238" stroke-width="7"/>
    <!-- Sweeping Radar Beam -->
    <g class="radar-sweep">
      <line x1="600" y1="125" x2="600" y2="71" stroke="#38BDF8" stroke-width="2"/>
      <polygon points="600,125 560,75 600,71" fill="url(#radarSweepGrad)"/>
    </g>
    <!-- Animated Outer Dash Ring -->
    <circle cx="600" cy="125" r="66" fill="none" stroke="#C9A45C" stroke-width="1.2" stroke-dasharray="6,8" class="orbit-ccw-2" stroke-opacity="0.8"/>
    <!-- Progress Arc: ~85% of 339 circumference -->
    <circle cx="600" cy="125" r="54" fill="none" stroke="#C9A45C" stroke-width="7" stroke-dasharray="339" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90 600 125)"/>
    <!-- Inner Texts -->
    <text x="600" y="122" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700">&lt; 38ms</text>
    <text x="600" y="137" text-anchor="middle" fill="#C9A45C" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">GLOBAL TTFB</text>
    <!-- Subtitle and Badge -->
    <text x="600" y="196" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700">EDGE RUNTIME LATENCY</text>
    <rect x="550" y="204" width="100" height="16" rx="3" fill="#0B1426" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="600" y="215" text-anchor="middle" fill="#38BDF8" font-family="'Consolas', monospace" font-size="8" font-weight="700">● SUB-50MS TARGET</text>
  </g>

  <!-- Separator 2 -->
  <line x1="810" y1="55" x2="810" y2="210" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2,4"/>

  <!-- ================= GAUGE 3: 100/100 CODE QUALITY ================= -->
  <!-- Center: (1000, 125) -->
  <g>
    <!-- Background Circle Track -->
    <circle cx="1000" cy="125" r="54" fill="#070E20" stroke="#162238" stroke-width="7"/>
    <!-- Animated Outer Dash Ring -->
    <circle cx="1000" cy="125" r="66" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="5,7" class="orbit-cw-3" stroke-opacity="0.8"/>
    <!-- Progress Arc: 100% of 339 circumference -->
    <circle cx="1000" cy="125" r="54" fill="none" stroke="#10B981" stroke-width="7" stroke-dasharray="339" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 1000 125)"/>
    <!-- Inner Texts -->
    <text x="1000" y="122" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700">100 / 100</text>
    <text x="1000" y="137" text-anchor="middle" fill="#10B981" font-family="'Consolas', monospace" font-size="8.5" font-weight="700">AST INTEGRITY</text>
    <!-- Subtitle and Badge -->
    <text x="1000" y="196" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700">ARCHITECTURE HEALTH</text>
    <rect x="948" y="204" width="104" height="16" rx="3" fill="#0B1426" stroke="#C9A45C" stroke-width="0.8"/>
    <text x="1000" y="215" text-anchor="middle" fill="#C9A45C" font-family="'Consolas', monospace" font-size="8" font-weight="700">● ZERO REGRESSION</text>
  </g>
</svg>
