<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibeans Executive 3D Robot — GitHub Profile Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: 
        radial-gradient(circle at 50% 20%, rgba(0, 136, 255, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 85% 75%, rgba(255, 167, 0, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 15% 85%, rgba(0, 210, 255, 0.12) 0%, transparent 45%),
        #040711;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e6edf3;
      transition: background 0.3s ease;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
  <!-- Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // --- 1. Scene, Camera, Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.1, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.1, 0);
    controls.minDistance = 2.0;
    controls.maxDistance = 15.0;

    // --- 2. Studio Keynote Lighting (Exact 1:1 match to Vibeans Website) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
    scene.add(ambientLight);

    // Key Light from Top-Right (Cool Crisp Specular)
    const keyLight = new THREE.DirectionalLight(0xe0f2fe, 2.6);
    keyLight.position.set(10, 10, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    scene.add(keyLight);

    // Vibeans Signature Golden-Orange Rim Light from Bottom-Left
    const rimLight = new THREE.DirectionalLight(0xFFA700, 1.8);
    rimLight.position.set(-10, -5, -5);
    scene.add(rimLight);

    // Soft Blue Fill Light from Front
    const fillLight = new THREE.PointLight(0x0088FF, 1.3, 20);
    fillLight.position.set(0, 0, 5);
    scene.add(fillLight);

    // Ground Soft Shadow Contact Plane
    const shadowPlaneGeo = new THREE.PlaneGeometry(10, 10);
    const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.35 });
    const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = -2.85;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // --- 3. Authentic Vibeans Materials Palette ---
    const suitMaterial = new THREE.MeshStandardMaterial({ color: "#0B132B", roughness: 0.9, metalness: 0.1 });
    const blackShirtMaterial = new THREE.MeshStandardMaterial({ color: "#111111", roughness: 0.9, metalness: 0.0 });
    const bowMaterial = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.5, metalness: 0.1 });
    const skinMaterial = new THREE.MeshStandardMaterial({ color: "#f1c27d", roughness: 0.6, metalness: 0.1 });
    const darkSkinMaterial = new THREE.MeshStandardMaterial({ color: "#d29953", roughness: 0.7, metalness: 0.1 });
    const hairMaterial = new THREE.MeshStandardMaterial({ color: "#1c140d", roughness: 0.9, metalness: 0.1 });
    const shoeMaterial = new THREE.MeshStandardMaterial({ color: "#111111", roughness: 0.2, metalness: 0.6 });
    const metalMaterial = new THREE.MeshStandardMaterial({ color: "#a0aab5", metalness: 0.9, roughness: 0.2 });
    const tieMaterial = new THREE.MeshStandardMaterial({ color: "#ff7e00", roughness: 0.5, metalness: 0.2 });
    const cyanAccentMaterial = new THREE.MeshStandardMaterial({
      color: "#00d2ff",
      roughness: 0.4,
      metalness: 0.5,
      emissive: "#00d2ff",
      emissiveIntensity: 0.9
    });
    const irisMaterial = new THREE.MeshStandardMaterial({ color: "#3a2820", roughness: 0.22, metalness: 0.08 });
    const irisInnerMaterial = new THREE.MeshStandardMaterial({ color: "#5c4033", roughness: 0.25, metalness: 0.05 });
    const catchlightMaterial = new THREE.MeshBasicMaterial({ color: "#ffffff" });
    const eyelidSkinMaterial = new THREE.MeshStandardMaterial({ color: "#f1c27d", roughness: 0.6, metalness: 0.1, side: THREE.DoubleSide });
    const lashMaterial = new THREE.MeshStandardMaterial({ color: "#1c140d", roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide });
    const mouthMaterial = new THREE.MeshStandardMaterial({ color: "#3c1018", roughness: 0.88, metalness: 0.0, side: THREE.DoubleSide });
    const lipMaterial = new THREE.MeshStandardMaterial({ color: "#a86852", roughness: 0.54, metalness: 0.04, side: THREE.DoubleSide });
    const lowerLipMaterial = new THREE.MeshStandardMaterial({ color: "#b6765e", roughness: 0.50, metalness: 0.04, side: THREE.DoubleSide });
    const lipSeamMaterial = new THREE.MeshStandardMaterial({ color: "#542422", roughness: 0.75, metalness: 0.0, side: THREE.DoubleSide });
    const tongueMaterial = new THREE.MeshStandardMaterial({ color: "#cb5f6b", roughness: 0.65, metalness: 0.02, side: THREE.DoubleSide });
    const teethMaterial = new THREE.MeshStandardMaterial({ color: "#f8f6f0", roughness: 0.24, metalness: 0.02, emissive: "#24201c", emissiveIntensity: 0.42, side: THREE.DoubleSide });
    const nostrilMaterial = new THREE.MeshStandardMaterial({ color: "#3a2012", roughness: 0.9, metalness: 0.0 });

    // --- 4. Procedural Sculpted Geometries (Nose & Joyful Smile Tube) ---
    // Seamless 7x5 Organic Anatomical Nose Mesh
    const noseGeo = new THREE.BufferGeometry();
    const noseVertices = new Float32Array([
      -0.016,  0.075, 0.551,   -0.008,  0.075, 0.553,    0.000,  0.075, 0.555,    0.008,  0.075, 0.553,    0.016,  0.075, 0.551,
      -0.022,  0.045, 0.551,   -0.011,  0.045, 0.561,    0.000,  0.045, 0.566,    0.011,  0.045, 0.561,    0.022,  0.045, 0.551,
      -0.028,  0.015, 0.551,   -0.014,  0.015, 0.568,    0.000,  0.015, 0.575,    0.014,  0.015, 0.568,    0.028,  0.015, 0.551,
      -0.034, -0.010, 0.551,   -0.017, -0.010, 0.575,    0.000, -0.010, 0.582,    0.017, -0.010, 0.575,    0.034, -0.010, 0.551,
      -0.038, -0.028, 0.551,   -0.020, -0.028, 0.574,    0.000, -0.026, 0.585,    0.020, -0.028, 0.574,    0.038, -0.028, 0.551,
      -0.030, -0.044, 0.551,   -0.015, -0.044, 0.562,    0.000, -0.042, 0.570,    0.015, -0.044, 0.562,    0.030, -0.044, 0.551,
      -0.022, -0.055, 0.551,   -0.010, -0.055, 0.551,    0.000, -0.055, 0.551,    0.010, -0.055, 0.551,    0.022, -0.055, 0.551
    ]);
    const noseIndices = [];
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 4; c++) {
        const tl = r * 5 + c;
        const tr = r * 5 + (c + 1);
        const bl = (r + 1) * 5 + c;
        const br = (r + 1) * 5 + (c + 1);
        noseIndices.push(tl, bl, tr);
        noseIndices.push(tr, bl, br);
      }
    }
    noseGeo.setAttribute('position', new THREE.BufferAttribute(noseVertices, 3));
    noseGeo.setIndex(noseIndices);
    noseGeo.computeVertexNormals();

    // Joyful Smiling Tube Curve
    const smileCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.12, 0.028, 0.002),
      new THREE.Vector3(-0.065, -0.008, 0.003),
      new THREE.Vector3(0, -0.020, 0.004),
      new THREE.Vector3(0.065, -0.008, 0.003),
      new THREE.Vector3(0.12, 0.028, 0.002)
    ]);
    const smileTubeGeo = new THREE.TubeGeometry(smileCurve, 32, 0.012, 12, false);

    // --- 5. Assemble Full Procedural Robot Rig ---
    const robot = new THREE.Group();
    robot.position.set(0, -0.15, 0);
    scene.add(robot);

    // Joint Reference Handles
    const joints = {
      head: new THREE.Group(),
      leftShoulder: new THREE.Group(),
      rightShoulder: new THREE.Group(),
      leftElbow: new THREE.Group(),
      rightElbow: new THREE.Group(),
      leftHand: null,
      rightHand: null,
      leftHip: new THREE.Group(),
      rightHip: new THREE.Group(),
      leftKnee: new THREE.Group(),
      rightKnee: new THREE.Group(),
      leftFoot: new THREE.Group(),
      rightFoot: new THREE.Group(),
      leftEyebrow: new THREE.Group(),
      rightEyebrow: new THREE.Group(),
      leftEye: new THREE.Group(),
      rightEye: new THREE.Group(),
      leftPupil: new THREE.Group(),
      rightPupil: new THREE.Group()
    };

    // ─── A. HEAD & FACE ───
    joints.head.position.set(0, 1.6, 0);
    robot.add(joints.head);

    // Head base block
    const headMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 1.1), skinMaterial);
    headMesh.castShadow = true;
    joints.head.add(headMesh);

    // Shared procedural strip geometry builder (used by eyelids & sculpted human mouth)
    function createStripGeo(segments) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array((segments + 1) * 2 * 3);
      const indices = [];
      for (let i = 0; i < segments; i++) {
        const tl = i * 2;
        const bl = i * 2 + 1;
        const tr = (i + 1) * 2;
        const br = (i + 1) * 2 + 1;
        indices.push(tl, bl, tr);
        indices.push(tr, bl, br);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setIndex(indices);
      return geo;
    }

    // Warm Sculpted Arched Human Eyebrows (Natural friendly arch, zero rigid straight sticks)
    function buildBrowArch(isRight) {
      const s = isRight ? 1 : -1;
      const g = new THREE.Group();
      const pts = [
        new THREE.Vector3(-s * 0.088, -0.004, 0),
        new THREE.Vector3(-s * 0.030,  0.010, 0.003),
        new THREE.Vector3( s * 0.032,  0.014, 0.003),
        new THREE.Vector3( s * 0.088, -0.005, 0)
      ];
      const browCurve = new THREE.CatmullRomCurve3(pts);
      const browTube = new THREE.Mesh(new THREE.TubeGeometry(browCurve, 18, 0.0145, 10, false), hairMaterial);
      browTube.scale.set(1, 0.9, 0.55);
      browTube.castShadow = true;
      g.add(browTube);
      // Soft rounded end caps
      const capIn = new THREE.Mesh(new THREE.SphereGeometry(0.0135, 10, 10), hairMaterial);
      capIn.position.copy(pts[0]);
      capIn.scale.set(1, 0.9, 0.55);
      g.add(capIn);
      const capOut = new THREE.Mesh(new THREE.SphereGeometry(0.0115, 10, 10), hairMaterial);
      capOut.position.copy(pts[3]);
      capOut.scale.set(1, 0.9, 0.55);
      g.add(capOut);
      return g;
    }

    joints.leftEyebrow.position.set(-0.205, 0.275, 0.556);
    joints.leftEyebrow.add(buildBrowArch(false));
    joints.head.add(joints.leftEyebrow);

    joints.rightEyebrow.position.set(0.205, 0.275, 0.556);
    joints.rightEyebrow.add(buildBrowArch(true));
    joints.head.add(joints.rightEyebrow);

    // Soulful Human Eyes: Layered Iris, Dual Specular Catchlights, Saccadic Pupils & True Top-Down Sculpted Eyelids
    const LID_SEGS = 16;
    const eyeLidControllers = [];

    function createEye(isRight) {
      const eyeContainer = new THREE.Group();
      eyeContainer.position.set(isRight ? 0.205 : -0.205, 0.148, 0.55);

      const eyeLids = isRight ? joints.rightEye : joints.leftEye;
      eyeContainer.add(eyeLids);

      // Almond White Sclera
      const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.1, 32, 32), bowMaterial);
      sclera.scale.set(1.58, 0.82, 0.2);
      sclera.castShadow = true;
      eyeLids.add(sclera);

      // Pupil Group (Iris + Inner Iris + Pupil + Dual Corneal Catchlights — stays perfectly round during blinks!)
      const pupilGroup = isRight ? joints.rightPupil : joints.leftPupil;
      eyeLids.add(pupilGroup);

      const irisOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.1, 24), irisMaterial);
      irisOuter.position.set(0, 0, 0.018);
      irisOuter.rotation.x = Math.PI / 2;
      irisOuter.scale.set(1, 0.2, 1);
      pupilGroup.add(irisOuter);

      const irisInner = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.1, 24), irisInnerMaterial);
      irisInner.position.set(0, 0, 0.021);
      irisInner.rotation.x = Math.PI / 2;
      irisInner.scale.set(1, 0.2, 1);
      pupilGroup.add(irisInner);

      const pupil = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.1, 24), shoeMaterial);
      pupil.position.set(0, 0, 0.026);
      pupil.rotation.x = Math.PI / 2;
      pupil.scale.set(1, 0.2, 1);
      pupilGroup.add(pupil);

      // Bright corneal specular catchlights (primary + secondary glint for unmistakable living human warmth)
      const glintMain = new THREE.Mesh(new THREE.SphereGeometry(0.0095, 12, 12), catchlightMaterial);
      glintMain.position.set(0.015, 0.014, 0.037);
      glintMain.scale.set(1, 1, 0.3);
      pupilGroup.add(glintMain);

      const glintSub = new THREE.Mesh(new THREE.SphereGeometry(0.0048, 10, 10), catchlightMaterial);
      glintSub.position.set(-0.013, -0.012, 0.037);
      glintSub.scale.set(1, 1, 0.3);
      pupilGroup.add(glintSub);

      // True Top-Down Sculpted Upper Eyelid + Lash Arc + Soft Lower Lid Duchenne Cushion
      const upperLidGeo = createStripGeo(LID_SEGS);
      const upperLidMesh = new THREE.Mesh(upperLidGeo, eyelidSkinMaterial);
      eyeLids.add(upperLidMesh);

      const lashGeo = createStripGeo(LID_SEGS);
      const lashMesh = new THREE.Mesh(lashGeo, lashMaterial);
      eyeLids.add(lashMesh);

      const lowerLidGeo = createStripGeo(LID_SEGS);
      const lowerLidMesh = new THREE.Mesh(lowerLidGeo, eyelidSkinMaterial);
      eyeLids.add(lowerLidMesh);

      function updateEyelid(blinkAmt, smileSoften) {
        const halfW = 0.168;
        const uArr = upperLidGeo.attributes.position.array;
        const lArr = lashGeo.attributes.position.array;
        const bArr = lowerLidGeo.attributes.position.array;

        // Top of upper lid anchored flush with forehead skin; lower edge sweeps cleanly all the way down over eye during blink
        const openRimY = 0.056 - smileSoften * 0.006;
        const closedRimY = -0.074;
        const rimCenterY = THREE.MathUtils.lerp(openRimY, closedRimY, blinkAmt);
        const rimArch = THREE.MathUtils.lerp(0.022, -0.012, blinkAmt);

        const lowerOpenY = -0.074 + smileSoften * 0.014;
        const lowerClosedY = -0.064;
        const lowerCenterY = THREE.MathUtils.lerp(lowerOpenY, lowerClosedY, blinkAmt);

        for (let i = 0; i <= LID_SEGS; i++) {
          const s = (i / LID_SEGS) * 2 - 1;
          const x = s * halfW;
          const env = Math.max(0, 1 - s * s);
          const idx = i * 6;

          const yUpperTop = 0.088;
          const yUpperRim = rimCenterY + rimArch * (env - 0.5) - 0.042 * (1 - env) * (1 - blinkAmt * 0.8);
          const zLid = 0.040 + 0.003 * env;

          uArr[idx]     = x; uArr[idx + 1] = yUpperTop; uArr[idx + 2] = 0.039;
          uArr[idx + 3] = x; uArr[idx + 4] = yUpperRim; uArr[idx + 5] = zLid;

          // Sleek dark upper lash rim hugging the eyelid edge
          const lashThick = 0.0085 * Math.pow(env, 0.35) + 0.0025;
          lArr[idx]     = x; lArr[idx + 1] = yUpperRim + lashThick * 0.45; lArr[idx + 2] = zLid + 0.0018;
          lArr[idx + 3] = x; lArr[idx + 4] = yUpperRim - lashThick * 0.55; lArr[idx + 5] = zLid + 0.0018;

          // Subtle lower eyelid cushion rising slightly on smiles and blinks
          const yLowerRim = lowerCenterY - 0.012 * (1 - env);
          const yLowerBot = -0.088;
          bArr[idx]     = x; bArr[idx + 1] = yLowerRim; bArr[idx + 2] = 0.0395 + 0.002 * env;
          bArr[idx + 3] = x; bArr[idx + 4] = yLowerBot; bArr[idx + 5] = 0.0385;
        }
        upperLidGeo.attributes.position.needsUpdate = true;
        lashGeo.attributes.position.needsUpdate = true;
        lowerLidGeo.attributes.position.needsUpdate = true;
        upperLidGeo.computeVertexNormals();
        lowerLidGeo.computeVertexNormals();
      }

      updateEyelid(0, 0.5);
      eyeLidControllers.push(updateEyelid);

      return eyeContainer;
    }
    joints.head.add(createEye(false));
    joints.head.add(createEye(true));

    // Sculpted Nose with Dual Nostril Depth
    const noseMesh = new THREE.Mesh(noseGeo, skinMaterial);
    noseMesh.castShadow = true;
    joints.head.add(noseMesh);

    const lNostril = new THREE.Mesh(new THREE.SphereGeometry(0.007, 16, 16), nostrilMaterial);
    lNostril.position.set(-0.015, -0.042, 0.564);
    lNostril.rotation.set(0.3, 0.2, 0.35);
    lNostril.scale.set(0.9, 0.45, 0.35);
    joints.head.add(lNostril);

    const rNostril = new THREE.Mesh(new THREE.SphereGeometry(0.007, 16, 16), nostrilMaterial);
    rNostril.position.set(0.015, -0.042, 0.564);
    rNostril.rotation.set(0.3, -0.2, -0.35);
    rNostril.scale.set(0.9, 0.45, 0.35);
    joints.head.add(rNostril);

    // Anatomically Sculpted, Watertight 3D Human Speaking Mouth (Cupid's-Bow Upper Lip, Fuller Lower Lip, Warm Cavity, Curved Teeth & Pink Tongue)
    const mouthGroup = new THREE.Group();
    mouthGroup.position.set(0, -0.22, 0.553);

    const MOUTH_SEGS = 24;
    const INNER_SEGS = 16;

    const cavityGeo = createStripGeo(MOUTH_SEGS);
    const cavityMesh = new THREE.Mesh(cavityGeo, mouthMaterial);
    mouthGroup.add(cavityMesh);

    const teethGeo = createStripGeo(INNER_SEGS);
    const teethMesh = new THREE.Mesh(teethGeo, teethMaterial);
    mouthGroup.add(teethMesh);

    const tongueGeo = createStripGeo(INNER_SEGS);
    const tongueMesh = new THREE.Mesh(tongueGeo, tongueMaterial);
    mouthGroup.add(tongueMesh);

    const lipSeamGeo = createStripGeo(MOUTH_SEGS);
    const lipSeamMesh = new THREE.Mesh(lipSeamGeo, lipSeamMaterial);
    mouthGroup.add(lipSeamMesh);

    const upperLipGeo = createStripGeo(MOUTH_SEGS);
    const upperLipMesh = new THREE.Mesh(upperLipGeo, lipMaterial);
    mouthGroup.add(upperLipMesh);

    const lowerLipGeo = createStripGeo(MOUTH_SEGS);
    const lowerLipMesh = new THREE.Mesh(lowerLipGeo, lowerLipMaterial);
    mouthGroup.add(lowerLipMesh);

    // Soft cheek smile corner creases
    const cornerCreaseL = new THREE.Mesh(new THREE.SphereGeometry(0.0085, 12, 12), lipSeamMaterial);
    cornerCreaseL.scale.set(0.65, 1.35, 0.35);
    mouthGroup.add(cornerCreaseL);

    const cornerCreaseR = new THREE.Mesh(new THREE.SphereGeometry(0.0085, 12, 12), lipSeamMaterial);
    cornerCreaseR.scale.set(0.65, 1.35, 0.35);
    mouthGroup.add(cornerCreaseR);

    // Subtle lower-lip / mentolabial chin contour shadow
    const chinShadow = new THREE.Mesh(new THREE.SphereGeometry(0.052, 16, 12), darkSkinMaterial);
    chinShadow.scale.set(1.25, 0.14, 0.12);
    mouthGroup.add(chinShadow);

    function updateHumanMouth(openAmt, widthFactor, smileAmt, tongueLift) {
      const halfW = 0.132 * widthFactor;
      const cornerY = 0.024 * smileAmt - 0.006 * (1 - smileAmt);
      const upperCenterY = 0.004 + openAmt * 0.018;
      const lowerCenterY = -0.004 - openAmt * 0.068;

      function evalTop(s) {
        const arch = 1 - s * s;
        // Subtle natural Cupid's bow curve
        const cupid = -0.0038 * Math.exp(-s * s * 22) * (0.45 + 0.55 * openAmt);
        return cornerY * (1 - arch) + upperCenterY * arch + cupid;
      }
      function evalBot(s) {
        const lowerArch = Math.pow(Math.max(0, 1 - s * s), 0.76);
        return cornerY * (1 - lowerArch) + lowerCenterY * lowerArch;
      }

      const cavPos = cavityGeo.attributes.position.array;
      const upPos = upperLipGeo.attributes.position.array;
      const loPos = lowerLipGeo.attributes.position.array;
      const seamPos = lipSeamGeo.attributes.position.array;

      for (let i = 0; i <= MOUTH_SEGS; i++) {
        const u = i / MOUTH_SEGS;
        const s = u * 2 - 1;
        const x = s * halfW;
        const yT = evalTop(s);
        const yB = evalBot(s);
        const env = Math.max(0, 1 - s * s);

        // 1. Watertight inner oral cavity (recessed cleanly behind lips)
        const idx = i * 6;
        cavPos[idx]     = x; cavPos[idx + 1] = yT; cavPos[idx + 2] = 0.0012;
        cavPos[idx + 3] = x; cavPos[idx + 4] = yB; cavPos[idx + 5] = 0.0012;

        // 2. Sculpted Cupid's-bow upper lip with soft 3D pillowing
        const cupidPeaks = Math.exp(-Math.pow((Math.abs(s) - 0.24) / 0.18, 2));
        const upperThick = (0.0145 * Math.pow(env, 0.62) + 0.0045 * cupidPeaks) * (0.92 + 0.14 * (1 - widthFactor));
        const zLipOuter = 0.002 + 0.003 * env;
        const zLipCrown = 0.0065 + 0.0075 * env;
        upPos[idx]     = x; upPos[idx + 1] = yT + upperThick; upPos[idx + 2] = zLipOuter;
        upPos[idx + 3] = x; upPos[idx + 4] = yT - 0.001;      upPos[idx + 5] = zLipCrown;

        // 3. Fuller rounded lower lip with natural 3D pillowing
        const lowerThick = 0.0205 * Math.pow(env, 0.54) * (0.94 + 0.16 * (1 - widthFactor));
        loPos[idx]     = x; loPos[idx + 1] = yB + 0.001;      loPos[idx + 2] = zLipCrown + 0.001;
        loPos[idx + 3] = x; loPos[idx + 4] = yB - lowerThick; loPos[idx + 5] = zLipOuter;

        // 4. Crisp inner smile crease (most visible when mouth closes gently)
        const seamHalf = (0.0038 + 0.002 * (1 - openAmt)) * Math.pow(env, 0.35);
        const yMid = (yT + yB) * 0.5;
        seamPos[idx]     = x; seamPos[idx + 1] = yMid + seamHalf; seamPos[idx + 2] = 0.0072 + 0.007 * env;
        seamPos[idx + 3] = x; seamPos[idx + 4] = yMid - seamHalf; seamPos[idx + 5] = 0.0072 + 0.007 * env;
      }

      upperLipGeo.attributes.position.needsUpdate = true;
      lowerLipGeo.attributes.position.needsUpdate = true;
      lipSeamGeo.attributes.position.needsUpdate = true;

      const maxTeethH = 0.020 * Math.min(1, openAmt * 1.45);
      for (let i = 0; i <= INNER_SEGS; i++) {
        const tU = (i / INNER_SEGS) * 2 - 1; // -1..1 across teeth width
        const s = tU * teethSpan;
        const x = s * halfW;
        const yT = evalTop(s);
        const yB = evalBot(s);
        const roundedEdge = Math.pow(Math.max(0, 1 - tU * tU), 0.32);
        const yTeethBot = Math.max(yB + 0.004, yT - maxTeethH * roundedEdge);
        const idx = i * 6;

      { dur: 0.17, open: 0.68, width: 0.74, smile: 0.32, tongue: 0.22 }, // "ome" (OH)
      { dur: 0.12, open: 0.44, width: 0.60, smile: 0.20, tongue: 0.18 }, // "to"  (OO)
      { dur: 0.09, open: 0.02, width: 0.98, smile: 0.74, tongue: 0.00 }, // "m"   (MBP)
      { dur: 0.17, open: 0.80, width: 1.02, smile: 0.60, tongue: 0.35 }, // "y"   (AA)
      { dur: 0.10, open: 0.02, width: 0.95, smile: 0.68, tongue: 0.00 }, // "p"   (MBP)
      { dur: 0.18, open: 0.70, width: 0.72, smile: 0.28, tongue: 0.22 }, // "ro"  (OH)
      { dur: 0.13, open: 0.26, width: 1.06, smile: 0.72, tongue: 0.65 }, // "f"   (FV)
      { dur: 0.16, open: 0.76, width: 1.08, smile: 0.75, tongue: 0.42 }, // "ile" (AA/EE)
      { dur: 0.34, open: 0.05, width: 1.12, smile: 0.96, tongue: 0.05 }, // warm phrase smile breath
      { dur: 0.16, open: 0.78, width: 1.05, smile: 0.68, tongue: 0.38 }, // "glad" (AA)
      { dur: 0.14, open: 0.44, width: 0.62, smile: 0.24, tongue: 0.20 }, // "you're" (OO)
      { dur: 0.16, open: 0.40, width: 1.22, smile: 0.92, tongue: 0.58 }, // "here" (EE)
      { dur: 0.11, open: 0.25, width: 1.05, smile: 0.76, tongue: 0.68 }, // "feel" (FV)
      { dur: 0.15, open: 0.38, width: 1.24, smile: 0.94, tongue: 0.55 }, // "free" (EE)
      { dur: 0.17, open: 0.68, width: 0.76, smile: 0.34, tongue: 0.24 }, // "explore" (OH)
      { dur: 0.32, open: 0.06, width: 1.14, smile: 0.98, tongue: 0.05 }  // warm beaming finish
    ];
    const TOTAL_SPEECH_DUR = SPEECH_VISEMES.reduce((acc, v) => acc + v.dur, 0);
    let curMouthOpen = 0.08, curMouthWidth = 1.05, curMouthSmile = 0.88, curTongueLift = 0.2;

    // Pre-allocated scratch math objects for zero-GC 60fps quaternion arm solver
    const _qBaseHandUp = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI, 0, 0, 'XYZ'));
    const _qShoulder = new THREE.Quaternion();
    const _qWorldAdj = new THREE.Quaternion();
    const _qForearmWorld = new THREE.Quaternion();
    const _qElbow = new THREE.Quaternion();
    const _eShoulder = new THREE.Euler(0, 0, 0, 'XYZ');
    const _eWorldAdj = new THREE.Euler(0, 0, 0, 'YXZ');

    function applyNaturalHumanWaveArm(isRight, wt, shoulder, elbow, hand, fingers, thumb) {
      const s = isRight ? 1 : -1;

      // Poised, warm human wave curve: cushioned turnarounds, smooth fluid glide across center
      const wave = Math.sin(wt) * 0.21 - Math.sin(wt * 3.0) * 0.018;
      // Natural radioulnar pronation/supination twist
      const pronation = Math.sin(wt) * 0.11;
      // Soft 3D elliptical arc (subtle vertical lift through center of sweep)
      const lift = Math.cos(wt * 2.0) * 0.020;
      // Supple phase-lagged wrist follow-through (0.36 rad natural human lag)
      const wristLagZ = Math.sin(wt - 0.36) * 0.20;
      const wristNodX = -0.03 + Math.cos(wt - 0.32) * 0.045;

      // 1. Relaxed poised shoulder (grounded posture, zero wide flapping, zero stiffness)
      _eShoulder.set(
        -0.36 + lift * 0.6,
        -s * 0.16,
        s * (0.50 + wave * 0.10)
      );
      shoulder.rotation.copy(_eShoulder);
      _qShoulder.setFromEuler(_eShoulder);

      // 2. Exact world forearm orientation: open palm facing viewer, medial thumb, upright framing face/shoulders, strictly forward (+Z)
      _eWorldAdj.set(
        0.20 + lift * 0.4,
        -s * (0.12 - pronation),
        -s * (0.10 + wave)
      );
      _qWorldAdj.setFromEuler(_eWorldAdj);
      _qForearmWorld.multiplyQuaternions(_qWorldAdj, _qBaseHandUp);

      // 3. Solve exact local elbow rotation: qElbow = qShoulder^-1 * qForearmWorld
      _qElbow.copy(_qShoulder).invert().multiply(_qForearmWorld);
      elbow.quaternion.copy(_qElbow);

      // 4. Supple wrist follow-through
      if (hand) {
        hand.rotation.set(wristNodX, 0, s * wristLagZ);
      }

      // 5. Gentle alive human finger wave ripple (softly together, natural curl & subtle micro-motion)
      if (fingers) {
        for (let i = 0; i < fingers.length; i++) {
          const f = fingers[i];
          const phase = wt - 0.48 - i * 0.12;
          f.rotation.x = f.userData.baseCurlX + Math.sin(phase) * 0.055;
          f.rotation.z = f.userData.splayZ + s * Math.cos(phase) * 0.018;
        }
      }
      if (thumb) {
        thumb.rotation.x = 0.16 + Math.sin(wt - 0.40) * 0.035;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      const t = (now / 1000) * waveSpeedMultiplier;

      // 1. Rock-Solid Grounded Standing Posture (ZERO body rocking, swaying, or floating while waving!)
      const waveSpeed = 4.3;
      robot.position.set(0, -0.15, 0);
      robot.rotation.set(0, 0, 0);

      // 2. Authentic Human Saccadic Gaze Tracking (Warm eye contact + quick natural glances + micro-tremor)
      saccadeTimer += delta;
      if (saccadeTimer >= nextSaccadeInterval) {
        saccadeTimer = 0;
        if (Math.random() < 0.68) {
          // Warm sustained eye contact with viewer (1.4s - 3.2s)
          targetPupilX = (Math.random() - 0.5) * 0.008;
          targetPupilY = (Math.random() - 0.5) * 0.006;
          nextSaccadeInterval = 1.4 + Math.random() * 1.8;
        } else {
          // Quick natural conversational glance slightly aside or upward (0.45s - 0.95s)
          targetPupilX = (Math.random() - 0.5) * 0.048;
          targetPupilY = (Math.random() - 0.35) * 0.024;
          nextSaccadeInterval = 0.45 + Math.random() * 0.50;
        }
      }
      const gazeAlpha = Math.min(1, delta * 14.0);
      currentPupilX = THREE.MathUtils.lerp(currentPupilX, targetPupilX, gazeAlpha);
      currentPupilY = THREE.MathUtils.lerp(currentPupilY, targetPupilY, gazeAlpha);

      const microTremorX = Math.sin(t * 28.0) * 0.0005;
      const microTremorY = Math.cos(t * 23.0) * 0.0003;

      joints.leftPupil.position.x = currentPupilX + microTremorX;
      joints.leftPupil.position.y = currentPupilY + microTremorY;
      joints.rightPupil.position.x = currentPupilX + microTremorX;
      joints.rightPupil.position.y = currentPupilY + microTremorY;

      // 3. True Asymmetrical Human Top-Down Eyelid Blinking (110ms close + 50ms natural closed hold + 170ms gentle reopen, 22% double-blink)
      blinkTimer += delta;
      let blinkAmt = 0;
      const BLINK_CLOSE_DUR = 0.11;
      const BLINK_HOLD_DUR = 0.05;
      const BLINK_OPEN_DUR = 0.17;
      const BLINK_TOTAL = BLINK_CLOSE_DUR + BLINK_HOLD_DUR + BLINK_OPEN_DUR;

      if (!isBlinking && blinkTimer >= nextBlinkInterval) {
        isBlinking = true;
        blinkElapsed = 0;
        blinkTimer = 0;
        nextBlinkInterval = 2.2 + Math.random() * 1.4;
        isDoubleBlink = Math.random() < 0.22;
      }
      if (isBlinking) {
        blinkElapsed += delta;
        if (blinkElapsed < BLINK_CLOSE_DUR) {
          const p = blinkElapsed / BLINK_CLOSE_DUR;
          blinkAmt = p * p * (3 - 2 * p); // smooth natural eyelid sweep down
        } else if (blinkElapsed < BLINK_CLOSE_DUR + BLINK_HOLD_DUR) {
          blinkAmt = 1.0; // authentic 50ms closed eyelid hold
        } else if (blinkElapsed < BLINK_TOTAL) {
          const p = (blinkElapsed - BLINK_CLOSE_DUR - BLINK_HOLD_DUR) / BLINK_OPEN_DUR;
          blinkAmt = 1 - (p * p * (3 - 2 * p)); // smooth unhurried eyelid lift
        } else if (isDoubleBlink) {
          isDoubleBlink = false;
          blinkElapsed = 0;
          blinkAmt = 0;
        } else {
          isBlinking = false;
          blinkAmt = 0;
        }
      }

      // 4. Conversational Human Speech Viseme Animation
      let speechTime = t % TOTAL_SPEECH_DUR;
      let targetViseme = SPEECH_VISEMES[0];
      for (let i = 0; i < SPEECH_VISEMES.length; i++) {
        if (speechTime < SPEECH_VISEMES[i].dur) {
          targetViseme = SPEECH_VISEMES[i];
          break;
        }
        speechTime -= SPEECH_VISEMES[i].dur;
      }

      const lipAlpha = Math.min(1, delta * 17.5);
      curMouthOpen  = THREE.MathUtils.lerp(curMouthOpen,  targetViseme.open,   lipAlpha);
      curMouthWidth = THREE.MathUtils.lerp(curMouthWidth, targetViseme.width,  lipAlpha);
      curMouthSmile = THREE.MathUtils.lerp(curMouthSmile, targetViseme.smile,  lipAlpha);
      curTongueLift = THREE.MathUtils.lerp(curTongueLift, targetViseme.tongue, lipAlpha);

      updateHumanMouth(curMouthOpen, curMouthWidth, curMouthSmile, curTongueLift);
      mouthGroup.position.y = -0.22 - curMouthOpen * 0.008;

      // Update sculpted top-down eyelids (with soft Duchenne smile cheek-lift coupling!)
      for (let i = 0; i < eyeLidControllers.length; i++) {
        eyeLidControllers[i](blinkAmt, curMouthSmile);
      }

      // Subtle, natural human head micro-nods & gaze-coupled conversational turns (torso remains rock-steady!)
      const isSpeakingNow = curMouthOpen > 0.14;
      const speakHeadBob = isSpeakingNow ? (curMouthOpen * 0.018 + Math.sin(t * 7.2) * 0.008) : 0;
      joints.head.rotation.x = -0.015 + Math.cos(t * 1.6) * 0.010 + speakHeadBob - currentPupilY * 0.5;
      joints.head.rotation.y = Math.sin(t * 1.1) * 0.032 + currentPupilX * 0.85;
      joints.head.rotation.z = Math.sin(t * 1.5) * 0.018;

      // Warm, expressive arched human eyebrows (friendly conversational lift + subtle human asymmetry + blink dip)
      const browEmphasis = isSpeakingNow ? (0.005 + curMouthOpen * 0.016) : 0.004;
      const browAsym = Math.sin(t * 1.7) * 0.0035;
      const blinkDip = blinkAmt * 0.009;
      joints.leftEyebrow.position.y = 0.275 + browEmphasis + browAsym - blinkDip;
      joints.rightEyebrow.position.y = 0.275 + browEmphasis - browAsym * 0.6 - blinkDip;
      // Warm friendly neutral/lifted arch rotation (ZERO frowning V-angle!)
      joints.leftEyebrow.rotation.z = 0.03 + browEmphasis * 0.55;
      joints.rightEyebrow.rotation.z = -0.03 - browEmphasis * 0.55;

      // 5. Simultaneous & Continuous Two-Handed Poised Human Open-Palm Wave (Grounded Body, Strictly Forward, Zero Rest!)
      const wavePhaseOffset = 0.42;
      applyNaturalHumanWaveArm(
        true,
        t * waveSpeed,
        joints.rightShoulder,
        joints.rightElbow,
        joints.rightHand,
        joints.rightFingers,
        joints.rightThumb
      );
      applyNaturalHumanWaveArm(
        false,
        t * waveSpeed + wavePhaseOffset,
        joints.leftShoulder,
        joints.leftElbow,
        joints.leftHand,
        joints.leftFingers,
        joints.leftThumb
      );

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 7. Responsive Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 8. UI Preset Controls ---
    function setBg(bgColor, textColor = '#e6edf3') {
      if (bgColor === 'transparent') {
        document.body.style.background = 'radial-gradient(circle at center, #1f2937 0%, #0d1117 100%)';
        renderer.setClearColor(0x000000, 0);
      } else {
        document.body.style.background = bgColor;
        renderer.setClearColor(bgColor, 1);
      }
      document.body.style.color = textColor;
    }

    function setCameraView(preset) {
      if (preset === 'full') {
        gsapAnimateCamera(0, 0.1, 7.2, 0, 0.1, 0);
      } else if (preset === 'upper') {
        gsapAnimateCamera(0, 0.9, 4.4, 0, 0.85, 0);
      } else if (preset === 'face') {
        gsapAnimateCamera(0, 1.55, 2.5, 0, 1.55, 0);
      }
    }

    function resetView() {
      gsapAnimateCamera(0, 0.1, 7.2, 0, 0.1, 0);
    }

    function gsapAnimateCamera(cx, cy, cz, tx, ty, tz) {
      camera.position.set(cx, cy, cz);
      controls.target.set(tx, ty, tz);
    }

    // --- 9. Built-In WebM/Video Screen Capture for GitHub README ---
    let mediaRecorder = null;
    let recordedChunks = [];

    function toggleRecord() {
      const modal = document.getElementById('record-modal');
      const status = document.getElementById('record-status');
      const btn = document.getElementById('record-btn');

      modal.style.display = 'block';
      status.textContent = 'Recording 4-second seamless 60fps loop...';
      btn.disabled = true;

      const stream = renderer.domElement.captureStream(60);
      recordedChunks = [];
      
      const options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 5000000 };
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vibeans-github-robot-waving.webm';
        a.click();

        modal.style.display = 'none';
        btn.disabled = false;
        alert('Animation recorded successfully! File "vibeans-github-robot-waving.webm" has been saved.');
      };

      mediaRecorder.start();

      // Automatically capture exactly 4.0 seconds (a perfect 2-cycle harmonic wave)
      setTimeout(() => {
        mediaRecorder.stop();
      }, 4000);
    }
  </script>
